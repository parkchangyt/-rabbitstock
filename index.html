<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RabbitStock Ultimate</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#080d18;
  color:#eef3ff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

header{
  position:sticky;
  top:0;
  z-index:10;
  padding:14px;
  background:rgba(8,13,24,.94);
  backdrop-filter:blur(14px);
  border-bottom:1px solid #1d2739;
}

.head{
  display:flex;
  gap:8px;
}

input{
  flex:1;
  min-width:0;
  padding:13px;
  border:1px solid #344158;
  border-radius:12px;
  background:#101827;
  color:#fff;
  font-size:16px;
  outline:none;
  text-transform:uppercase;
}

button{
  border:0;
  border-radius:12px;
  padding:0 18px;
  background:#4d7cff;
  color:#fff;
  font-weight:700;
  font-size:15px;
}

main{
  max-width:720px;
  margin:auto;
  padding:14px;
}

.card{
  background:linear-gradient(145deg,#101827,#0c1320);
  border:1px solid #202c40;
  border-radius:18px;
  padding:16px;
  margin-bottom:12px;
  box-shadow:0 8px 30px rgba(0,0,0,.18);
}

.symbol{
  color:#91a0ba;
  font-size:13px;
}

.price{
  font-size:38px;
  font-weight:800;
  margin-top:3px;
}

.change{
  font-size:15px;
  margin-top:2px;
}

.green{
  color:#48d597;
}

.red{
  color:#ff637d;
}

.gray{
  color:#8491a8;
}

.judge{
  text-align:center;
  padding:20px 10px;
}

.judge-title{
  color:#8e9bb1;
  font-size:13px;
}

.judge-value{
  font-size:30px;
  font-weight:900;
  margin:8px 0;
}

.score{
  font-size:15px;
  color:#aeb9ca;
}

.reasons{
  margin-top:12px;
  line-height:1.7;
  color:#d9e0ec;
  font-size:14px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.metric{
  background:#0b1220;
  border:1px solid #202c40;
  border-radius:13px;
  padding:12px;
}

.metric small{
  display:block;
  color:#7e8ca4;
  margin-bottom:5px;
}

.metric strong{
  font-size:17px;
}

.chart{
  width:100%;
  height:250px;
}

canvas{
  width:100%;
  height:100%;
}

details{
  background:linear-gradient(145deg,#101827,#0c1320);
  border:1px solid #202c40;
  border-radius:16px;
  margin-bottom:10px;
  overflow:hidden;
}

summary{
  cursor:pointer;
  padding:16px;
  font-weight:800;
  list-style:none;
}

summary::-webkit-details-marker{
  display:none;
}

.detail{
  padding:0 15px 15px;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:9px 0;
  border-bottom:1px solid #1c2637;
  font-size:14px;
}

.row:last-child{
  border-bottom:0;
}

.label{
  color:#8795ab;
}

.value{
  text-align:right;
  word-break:break-word;
}

.item{
  padding:12px 0;
  border-bottom:1px solid #1c2637;
}

.item:last-child{
  border-bottom:0;
}

.item-title{
  font-weight:700;
  line-height:1.45;
}

.item-date{
  color:#7e8ca4;
  font-size:12px;
  margin:4px 0;
}

a{
  color:#75a5ff;
  text-decoration:none;
  font-size:13px;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  min-width:650px;
  border-collapse:collapse;
  font-size:12px;
}

th,td{
  padding:9px 6px;
  border-bottom:1px solid #202a3b;
  text-align:right;
  white-space:nowrap;
}

th{
  color:#7f8da4;
}

th:first-child,
td:first-child{
  text-align:left;
}

.loading{
  text-align:center;
  padding:35px 10px;
  color:#8d9ab0;
}

.error{
  padding:15px;
  border-radius:12px;
  background:#29141b;
  color:#ff8ca0;
  line-height:1.6;
}

.status{
  font-size:12px;
  color:#718097;
  text-align:center;
  padding:8px;
}

.source-ok{
  color:#4bd79a;
}

.source-no{
  color:#ff7187;
}

@media(max-width:420px){
  main{
    padding:10px;
  }

  .price{
    font-size:34px;
  }

  .card{
    padding:14px;
  }
}
</style>
</head>

<body>

<header>
  <div class="head">
    <input id="symbol" value="BRNX" autocomplete="off">
    <button onclick="loadStock()">분석</button>
  </div>
</header>

<main id="app">

  <div class="loading">
    데이터를 불러오는 중...
  </div>

</main>

<script>

const API =
"https://rabbitstock-final.keoss.workers.dev";

const $ = id =>
document.getElementById(id);


/* =====================================================
   숫자 표시
===================================================== */

function num(v, digits=2){

  if(
    v === null ||
    v === undefined ||
    v === "" ||
    !Number.isFinite(Number(v))
  ){
    return "데이터 없음";
  }

  return Number(v).toLocaleString(
    "en-US",
    {
      maximumFractionDigits:digits
    }
  );
}


function money(v){

  if(
    v === null ||
    v === undefined ||
    !Number.isFinite(Number(v))
  ){
    return "데이터 없음";
  }

  return "$"+Number(v).toLocaleString(
    "en-US",
    {
      minimumFractionDigits:2,
      maximumFractionDigits:4
    }
  );
}


function pct(v){

  if(
    v === null ||
    v === undefined ||
    !Number.isFinite(Number(v))
  ){
    return "데이터 없음";
  }

  const x=Number(v);

  return (x>=0?"+":"")+
    x.toFixed(2)+"%";
}


function cls(v){

  if(Number(v)>0)return "green";
  if(Number(v)<0)return "red";
  return "gray";
}


function esc(v){

  return String(v ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}


/* =====================================================
   분석
===================================================== */

async function loadStock(){

  const symbol =
    $("symbol").value
      .trim()
      .toUpperCase();

  if(!symbol)return;

  $("symbol").value=symbol;

  $("app").innerHTML =
  `<div class="loading">
     ${esc(symbol)} 데이터를 불러오는 중...
   </div>`;

  try{

    const r =
      await fetch(
        `${API}/all?symbol=${encodeURIComponent(symbol)}`,
        {
          cache:"no-store"
        }
      );

    if(!r.ok){

      throw new Error(
        "API HTTP "+r.status
      );
    }

    const data =
      await r.json();

    if(!data || data.ok===false){

      throw new Error(
        data?.error ||
        "API 응답 오류"
      );
    }

    render(data);

  }catch(e){

    $("app").innerHTML =
    `<div class="error">
      <b>데이터 연결 실패</b><br><br>
      ${esc(e.message)}<br><br>
      Cloudflare Worker 주소와 Deploy 상태를 확인하세요.
    </div>`;
  }
}


/* =====================================================
   화면
===================================================== */

function render(d){

  const t=d.technical || {};
  const f=d.flow || {};
  const s=d.short || {};
  const rs=d.regSHO || {};
  const th=d.threshold || {};
  const dp=d.darkpool?.data || {};
  const sec=d.sec || {};
  const dil=d.dilution || {};
  const war=d.warrant || {};
  const fin=d.finnhubQuote || {};

  const reasons =
    (f.reasons || []).length
      ? f.reasons
          .map(x=>`• ${esc(x)}`)
          .join("<br>")
      : "판단 근거 데이터 없음";


  $("app").innerHTML = `

  <!-- PRICE -->

  <section class="card">

    <div class="symbol">
      ${esc(d.symbol || "")}
    </div>

    <div class="price">
      ${money(d.price)}
    </div>

    <div class="change ${cls(d.change)}">
      ${pct(d.change)}
    </div>

  </section>


  <!-- JUDGMENT -->

  <section class="card judge">

    <div class="judge-title">
      종합 판단
    </div>

    <div class="judge-value">
      ${esc(f.judgment || "확인 불가")}
    </div>

    <div class="score">
      매집 ${num(f.accumulationScore,0)}
      &nbsp; / &nbsp;
      매도 ${num(f.sellScore,0)}
    </div>

    <div class="reasons">
      ${reasons}
    </div>

  </section>


  <!-- TECHNICAL -->

  <section class="card">

    <div class="grid">

      <div class="metric">
        <small>MA20</small>
        <strong>${money(t.ma20)}</strong>
      </div>

      <div class="metric">
        <small>MA50</small>
        <strong>${money(t.ma50)}</strong>
      </div>

      <div class="metric">
        <small>RSI</small>
        <strong>${num(t.rsi,1)}</strong>
      </div>

      <div class="metric">
        <small>VWAP</small>
        <strong>${money(t.vwap)}</strong>
      </div>

      <div class="metric">
        <small>거래량 비율</small>
        <strong>${t.volumeRatio===null?
          "데이터 없음":
          num(t.volumeRatio,2)+"배"}
        </strong>
      </div>

      <div class="metric">
        <small>추세</small>
        <strong>${esc(t.trend || "확인 불가")}</strong>
      </div>

    </div>

  </section>


  <!-- CHART -->

  <section class="card">

    <div class="symbol">
      최근 주가
    </div>

    <div class="chart">
      <canvas id="priceChart"></canvas>
    </div>

  </section>


  <!-- DARK POOL -->

  <details>

    <summary>🌑 Dark Pool</summary>

    <div class="detail">

      ${row(
        "현재 Dark Pool",
        dp.darkPoolPercent,
        "%"
      )}

      ${row(
        "5일 평균",
        dp.avg5,
        "%"
      )}

      ${row(
        "22일 평균",
        dp.avg22,
        "%"
      )}

      ${row(
        "66일 평균",
        dp.avg66,
        "%"
      )}

      ${row(
        "Buy",
        dp.buyPercent,
        "%"
      )}

      ${row(
        "Sell",
        dp.sellPercent,
        "%"
      )}

      <div class="status">
        출처:
        <a
          href="${esc(d.darkpool?.source || "#")}"
          target="_blank">
          DarkFina 원문
        </a>
      </div>

    </div>

  </details>


  <!-- SHORT -->

  <details>

    <summary>🔥 Short Interest</summary>

    <div class="detail">

      ${row(
        "현재 공매도 잔고",
        s.shortInterest
      )}

      ${row(
        "이전 공매도 잔고",
        s.previousShortInterest
      )}

      ${row(
        "변동",
        s.shortChange
      )}

      ${row(
        "변동률",
        s.shortPercentChange,
        "%"
      )}

      ${row(
        "Days To Cover",
        s.daysToCover
      )}

      ${row(
        "평균 일 거래량",
        s.averageDailyVolume
      )}

      ${row(
        "기준일",
        s.settlementDate
      )}

      <div class="status">
        ${esc(s.status || "데이터 없음")}
      </div>

    </div>

  </details>


  <!-- REG SHO -->

  <details>

    <summary>🚨 Reg SHO / Threshold</summary>

    <div class="detail">

      ${row(
        "최근 Short Volume",
        rs.shortVolume
      )}

      ${row(
        "Short Exempt",
        rs.shortExemptVolume
      )}

      ${row(
        "전체 거래량",
        rs.totalVolume
      )}

      ${row(
        "Short Volume %",
        rs.shortVolumePercent,
        "%"
      )}

      ${row(
        "Reg SHO 기준일",
        rs.date
      )}

      ${row(
        "Threshold 등록",
        th.active ? "YES" : "NO"
      )}

      ${row(
        "Threshold Flag",
        th.thresholdListFlag
      )}

      ${row(
        "Reg SHO Threshold Flag",
        th.regShoThresholdFlag
      )}

      ${row(
        "Threshold 날짜",
        th.date
      )}

    </div>

  </details>


  <!-- DILUTION -->

  <details>

    <summary>💵 희석 / 실제 주식수</summary>

    <div class="detail">

      ${row(
        "현재 발행주식수",
        dil.sharesOutstanding
      )}

      ${
        (dil.filings || []).length
        ?
        dil.filings
          .map(secItem)
          .join("")
        :
        `<div class="status">
          희석 관련 SEC 공시 데이터 없음
        </div>`
      }

    </div>

  </details>


  <!-- WARRANT -->

  <details>

    <summary>🎫 워런트 / 전환</summary>

    <div class="detail">

      ${
        (war.filings || []).length
        ?
        war.filings
          .map(secItem)
          .join("")
        :
        `<div class="status">
          워런트/전환 관련 SEC 공시 데이터 없음
        </div>`
      }

    </div>

  </details>


  <!-- SEC -->

  <details>

    <summary>📑 SEC 공시 · 최근 60건</summary>

    <div class="detail">

      ${
        (sec.filings || []).length
        ?
        sec.filings
          .map(secItem)
          .join("")
        :
        `<div class="status">
          SEC 공시 데이터 없음
        </div>`
      }

    </div>

  </details>


  <!-- NEWS -->

  <details>

    <summary>📰 뉴스 · 최근 30일</summary>

    <div class="detail">

      ${
        (d.news || []).length
        ?
        d.news
          .map(newsItem)
          .join("")
        :
        `<div class="status">
          Finnhub 뉴스 데이터 없음
        </div>`
      }

    </div>

  </details>


  <!-- STOCKTITAN -->

  <details>

    <summary>📰 StockTitan</summary>

    <div class="detail">

      ${
        d.stocktitan?.items?.length
        ?
        d.stocktitan.items
          .map(x => `

            <div class="item">

              <div class="item-title">
                ${esc(x.title)}
              </div>

              <div>
                <a
                  href="${esc(x.url)}"
                  target="_blank">
                  원문 읽기 →
                </a>
              </div>

            </div>

          `)
          .join("")
        :
        `<div class="status">
          StockTitan 데이터 없음
        </div>`
      }

    </div>

  </details>


  <!-- RECENT DAYS -->

  <details>

    <summary>📅 최근 20거래일</summary>

    <div class="detail table-wrap">

      ${historyTable(d.history || [])}

    </div>

  </details>


  <!-- SOURCES -->

  <section class="card">

    <div class="symbol">
      데이터 연결 상태
    </div>

    <div class="row">
      <span class="label">Twelve Data</span>
      <span class="value ${d.sources?.twelveData?"source-ok":"source-no"}">
        ${d.sources?.twelveData?"연결":"없음"}
      </span>
    </div>

    <div class="row">
      <span class="label">Finnhub</span>
      <span class="value ${d.sources?.finnhub?"source-ok":"source-no"}">
        ${d.sources?.finnhub?"연결":"없음"}
      </span>
    </div>

    <div class="row">
      <span class="label">FINRA</span>
      <span class="value ${d.sources?.finra?"source-ok":"source-no"}">
        ${d.sources?.finra?"연결":"없음"}
      </span>
    </div>

    <div class="row">
      <span class="label">SEC EDGAR</span>
      <span class="value ${d.sources?.sec?"source-ok":"source-no"}">
        ${d.sources?.sec?"연결":"없음"}
      </span>
    </div>

    <div class="row">
      <span class="label">StockTitan</span>
      <span class="value ${d.sources?.stockTitan?"source-ok":"source-no"}">
        ${d.sources?.stockTitan?"연결":"없음"}
      </span>
    </div>

    <div class="row">
      <span class="label">DarkFina</span>
      <span class="value ${d.sources?.darkFina?"source-ok":"source-no"}">
        ${d.sources?.darkFina?"연결":"없음"}
      </span>
    </div>

  </section>

  <div class="status">
    RabbitStock Ultimate
  </div>

  `;

  drawChart(
    d.history || []
  );
}


/* =====================================================
   ROW
===================================================== */

function row(label,value,suffix=""){

  let v =
    value === null ||
    value === undefined ||
    value === ""
      ? "데이터 없음"
      : num(value,2);

  if(
    value !== null &&
    value !== undefined &&
    value !== "" &&
    suffix
  ){
    v += suffix;
  }

  return `
    <div class="row">
      <span class="label">
        ${esc(label)}
      </span>

      <span class="value">
        ${esc(v)}
      </span>
    </div>
  `;
}


/* =====================================================
   SEC
===================================================== */

function secItem(x){

  return `

    <div class="item">

      <div class="item-title">
        ${esc(x.form || "")}
        ${x.description
          ? " · "+esc(x.description)
          : ""}
      </div>

      <div class="item-date">
        ${esc(x.filed || "")}
      </div>

      ${
        x.url
        ?
        `<a
          href="${esc(x.url)}"
          target="_blank">
          원문 읽기 →
        </a>`
        :
        ""
      }

    </div>

  `;
}


/* =====================================================
   NEWS
===================================================== */

function newsItem(x){

  const title =
    x.headline ||
    x.title ||
    "뉴스";

  const url =
    x.url ||
    x.link ||
    "#";

  const date =
    x.datetime
      ? new Date(
          Number(x.datetime)*1000
        ).toISOString().slice(0,10)
      :
        x.publishedAt ||
        x.date ||
        "";

  return `

    <div class="item">

      <div class="item-title">
        ${esc(title)}
      </div>

      <div class="item-date">
        ${esc(date)}
        ${x.source
          ? " · "+esc(x.source)
          : ""}
      </div>

      <a
        href="${esc(url)}"
        target="_blank">
        원문 읽기 →
      </a>

    </div>

  `;
}


/* =====================================================
   HISTORY TABLE
===================================================== */

function historyTable(arr){

  const rows =
    arr
      .slice()
      .sort(
        (a,b)=>
          String(b.date)
            .localeCompare(
              String(a.date)
            )
      )
      .slice(0,20);

  if(!rows.length){

    return `
      <div class="status">
        주가 데이터 없음
      </div>
    `;
  }

  return `

    <table>

      <thead>

        <tr>

          <th>날짜</th>
          <th>시가</th>
          <th>고가</th>
          <th>저가</th>
          <th>종가</th>
          <th>등락</th>
          <th>거래량</th>
          <th>거래대금</th>

        </tr>

      </thead>

      <tbody>

        ${
          rows.map((x,i)=>{

            const prev =
              rows[i+1]?.close;

            const change =
              prev &&
              x.close
                ? ((x.close/prev)-1)*100
                : null;

            const value =
              x.close !== null &&
              x.volume !== null
                ? x.close*x.volume
                : null;

            return `

              <tr>

                <td>
                  ${esc(x.date)}
                </td>

                <td>
                  ${money(x.open)}
                </td>

                <td>
                  ${money(x.high)}
                </td>

                <td>
                  ${money(x.low)}
                </td>

                <td>
                  ${money(x.close)}
                </td>

                <td class="${cls(change)}">
                  ${pct(change)}
                </td>

                <td>
                  ${num(x.volume,0)}
                </td>

                <td>
                  ${money(value)}
                </td>

              </tr>

            `;

          }).join("")
        }

      </tbody>

    </table>

  `;
}


/* =====================================================
   CHART
===================================================== */

function drawChart(arr){

  const canvas =
    document.getElementById(
      "priceChart"
    );

  if(!canvas)return;

  const ctx =
    canvas.getContext("2d");

  const rect =
    canvas.getBoundingClientRect();

  const dpr =
    window.devicePixelRatio || 1;

  canvas.width =
    rect.width*dpr;

  canvas.height =
    rect.height*dpr;

  ctx.scale(dpr,dpr);

  const w=rect.width;
  const h=rect.height;

  const data =
    arr
      .filter(
        x =>
          Number.isFinite(
            Number(x.close)
          )
      )
      .slice(-60);

  if(!data.length){

    ctx.fillStyle="#7d8aa0";

    ctx.font="14px sans-serif";

    ctx.fillText(
      "차트 데이터 없음",
      20,
      40
    );

    return;
  }

  const values =
    data.map(
      x=>Number(x.close)
    );

  const min =
    Math.min(...values);

  const max =
    Math.max(...values);

  const pad=25;

  const range =
    max-min || 1;

  ctx.clearRect(
    0,
    0,
    w,
    h
  );

  /* grid */

  ctx.strokeStyle="#1d293b";

  ctx.lineWidth=1;

  for(
    let i=0;
    i<5;
    i++
  ){

    const y =
      pad+
      (h-pad*2)*
      i/4;

    ctx.beginPath();

    ctx.moveTo(
      0,
      y
    );

    ctx.lineTo(
      w,
      y
    );

    ctx.stroke();
  }

  /* line */

  ctx.beginPath();

  data.forEach(
    (x,i)=>{

      const px =
        data.length===1
          ? w/2
          :
          i*
          (w/(data.length-1));

      const py =
        h-pad-
        (
          (Number(x.close)-min)/
          range
        )*
        (h-pad*2);

      if(i===0)
        ctx.moveTo(px,py);
      else
        ctx.lineTo(px,py);
    }
  );

  ctx.strokeStyle="#6f9cff";

  ctx.lineWidth=2.5;

  ctx.stroke();

  /* last price */

  const last =
    values[values.length-1];

  ctx.fillStyle="#eef3ff";

  ctx.font="12px sans-serif";

  ctx.fillText(
    "$"+last.toFixed(2),
    8,
    18
  );
}


/* =====================================================
   ENTER
===================================================== */

$("symbol")
  .addEventListener(
    "keydown",
    e=>{
      if(e.key==="Enter"){
        loadStock();
      }
    }
  );


/* =====================================================
   START
===================================================== */

loadStock();

</script>
