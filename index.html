<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RabbitStock Ultimate</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#09101e;color:#eef3ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:900px;margin:auto;padding:16px}
.header{padding:8px 2px 18px}
.logo{font-size:24px;font-weight:900}
.sub{color:#8492ad;font-size:12px;margin-top:4px}
.search{display:flex;gap:8px;margin-bottom:14px}
input{flex:1;min-width:0;background:#111b2d;border:1px solid #263650;border-radius:12px;padding:14px;color:#fff;font-size:16px;font-weight:700}
button{border:0;border-radius:12px;padding:0 20px;background:#eef3ff;color:#09101e;font-weight:900}
.hero,.card{background:#101a2b;border:1px solid #1d2b43;border-radius:18px;padding:18px;margin-bottom:12px}
.heroTop{display:flex;justify-content:space-between;align-items:flex-start}
.ticker{font-size:30px;font-weight:950}
.name{font-size:13px;color:#8290a9;margin-top:3px}
.price{font-size:32px;font-weight:950;text-align:right}
.change{font-size:13px;text-align:right;margin-top:4px}
.up{color:#36df91}.down{color:#ff637d}.neutral{color:#b8c2d6}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.metric{background:#0c1525;border-radius:14px;padding:13px}
.label{font-size:11px;color:#7787a2}
.value{font-size:18px;font-weight:850;margin-top:5px}
.title{font-size:15px;font-weight:900;margin-bottom:12px}
.judge{font-size:25px;font-weight:950;margin-bottom:12px}
.scoreRow{display:flex;justify-content:space-between;font-size:12px;color:#91a0b8;margin:8px 0 5px}
.bar{height:9px;background:#202c40;border-radius:99px;overflow:hidden}
.fillA{height:100%;background:#36df91}
.fillB{height:100%;background:#ff637d}
.reason{font-size:13px;color:#bdc7d9;line-height:1.65;margin-top:12px}
canvas{width:100%;height:280px;display:block}
details{background:#101a2b;border:1px solid #1d2b43;border-radius:16px;margin-bottom:10px;overflow:hidden}
summary{padding:17px;font-weight:900;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
.content{padding:0 15px 15px}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #1d2940;font-size:13px}
.row:last-child{border-bottom:0}
.k{color:#8290a9}
.v{text-align:right;font-weight:750}
.news{padding:12px 0;border-bottom:1px solid #1d2940}
.news:last-child{border:0}
.newsTitle{font-weight:800;font-size:13px;line-height:1.45}
.newsMeta{font-size:11px;color:#75849d;margin-top:5px}
table{width:100%;border-collapse:collapse;font-size:11px}
th,td{padding:8px 4px;border-bottom:1px solid #1c2940;text-align:right}
th:first-child,td:first-child{text-align:left}
.status{padding:20px;text-align:center;color:#7f8da7}
.small{font-size:10px;color:#65738b}
.error{color:#ff7188}
</style>
</head>

<body>
<div class="app">

<div class="header">
  <div class="logo">🐇 RabbitStock Ultimate</div>
  <div class="sub">다중 데이터 교차검증 주식 분석</div>
</div>

<div class="search">
  <input id="symbol" value="BRNX" placeholder="티커 입력">
  <button onclick="analyze()">분석</button>
</div>

<div id="app">
  <div class="status">종목을 분석하는 중...</div>
</div>

</div>

<script>
const API="https://rabbitstock-final.keoss.workers.dev";

const $=id=>document.getElementById(id);

function esc(v){
  return String(v??"").replace(/[&<>"']/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[m]));
}

function num(v,d=2){
  if(v===null||v===undefined||v===""||!Number.isFinite(Number(v))) return "데이터 없음";
  return Number(v).toLocaleString("en-US",{maximumFractionDigits:d});
}

function pct(v){
  if(v===null||v===undefined||v===""||!Number.isFinite(Number(v))) return "데이터 없음";
  return num(v,2)+"%";
}

function cls(v){
  return Number(v)>0?"up":Number(v)<0?"down":"neutral";
}

function val(v){
  return v===null||v===undefined||v===""?"데이터 없음":esc(v);
}

function get(obj,...keys){
  for(const k of keys){
    const v=obj?.[k];
    if(v!==undefined&&v!==null&&v!=="") return v;
  }
  return null;
}

async function getJSON(url){
  const r=await fetch(url,{cache:"no-store"});
  if(!r.ok) throw new Error("API "+r.status);
  return await r.json();
}

function metric(label,value){
  return `
  <div class="metric">
    <div class="label">${esc(label)}</div>
    <div class="value">${val(value)}</div>
  </div>`;
}

function row(k,v,source=""){
  return `<div class="row">
    <span class="k">${esc(k)}</span>
    <span class="v">${val(v)}${source?`<div class="small">${esc(source)}</div>`:""}</span>
  </div>`;
}

function newsItem(n){
  const title=get(n,"headline","title","description")||"제목 없음";
  const date=get(n,"datetime","date","published_at","publishedAt");
  const source=get(n,"source","publisher")||"뉴스";
  const url=get(n,"url","link");
  return `<div class="news">
    <div class="newsTitle">${url?`<a href="${esc(url)}" target="_blank" style="color:#eef3ff;text-decoration:none">${esc(title)}</a>`:esc(title)}</div>
    <div class="newsMeta">${esc(date||"")} · ${esc(source)}</div>
  </div>`;
}

function drawChart(history){
  const c=document.getElementById("chart");
  if(!c||!history?.length)return;

  const dpr=devicePixelRatio||1;
  const w=c.clientWidth;
  const h=280;
  c.width=w*dpr;c.height=h*dpr;
  const x=c.getContext("2d");
  x.scale(dpr,dpr);
  x.clearRect(0,0,w,h);

  const data=history.slice(-90).map(a=>({
    date:get(a,"date","datetime"),
    close:Number(get(a,"close","price"))
  })).filter(a=>Number.isFinite(a.close));

  if(!data.length)return;

  const min=Math.min(...data.map(a=>a.close));
  const max=Math.max(...data.map(a=>a.close));
  const pad=(max-min||1)*.12;
  const lo=min-pad,hi=max+pad;

  const L=42,R=10,T=18,B=30;
  const pw=w-L-R,ph=h-T-B;

  x.strokeStyle="#24334c";
  x.lineWidth=1;

  for(let i=0;i<4;i++){
    const yy=T+ph*i/3;
    x.beginPath();x.moveTo(L,yy);x.lineTo(w-R,yy);x.stroke();
  }

  x.strokeStyle="#63a7ff";
  x.lineWidth=2;
  x.beginPath();

  data.forEach((p,i)=>{
    const px=L+pw*i/(data.length-1||1);
    const py=T+(hi-p.close)/(hi-lo)*ph;
    if(i===0)x.moveTo(px,py);else x.lineTo(px,py);
  });
  x.stroke();

  x.fillStyle="#8b99b0";
  x.font="10px sans-serif";
  x.fillText(num(hi),4,T+4);
  x.fillText(num(lo),4,T+ph);

  const last=data[data.length-1];
  x.fillText(last.date||"",Math.max(L,w-100),h-8);
}

function render(d){
  const q=d.quote||d.data?.quote||{};
  const h=d.history||d.data?.history||[];
  const t=d.technical||d.data?.technical||{};
  const flow=d.flow||d.data?.flow||{};
  const short=d.short||d.data?.short||{};
  const dark=d.darkpool||d.data?.darkpool||{};
  const dilution=d.dilution||d.data?.dilution||{};
  const warrant=d.warrant||d.data?.warrant||{};
  const sec=d.sec||d.data?.sec||{};
  const news=d.news||d.data?.news||[];

  const symbol=get(q,"symbol")||get(d,"symbol")||$("symbol").value.toUpperCase();
  const price=get(q,"close","price","current","last");
  const change=get(q,"change","percent_change");
  const name=get(q,"name","companyName")||"";
  const exchange=get(q,"exchange")||"";

  const accumulation=Number(get(flow,"accumulationScore","accumulation","buyScore"))||0;
  const selling=Number(get(flow,"sellScore","sellingScore","sell"))||0;

  let judgment=get(flow,"judgment","signal","conclusion");

  if(!judgment){
    if(accumulation>=75)judgment="🟢 강한 매집";
    else if(accumulation>=60)judgment="🟢 매집";
    else if(selling>=70)judgment="🔴 강한 매도";
    else if(selling>=55)judgment="🟠 분산";
    else judgment="🟡 중립";
  }

  const reasons=get(d,"reasons")||get(flow,"reasons")||[];

  $("app").innerHTML=`

  <div class="hero">
    <div class="heroTop">
      <div>
        <div class="ticker">${esc(symbol)}</div>
        <div class="name">${esc(name)} ${exchange?`· ${esc(exchange)}`:""}</div>
      </div>
      <div>
        <div class="price">$${val(num(price,4))}</div>
        <div class="change ${cls(change)}">${change===null?"데이터 없음":(Number(change)>0?"+":"")+num(change,2)+"%"}</div>
      </div>
    </div>

    <div class="grid" style="margin-top:15px">
      ${metric("거래량",num(get(q,"volume","day_volume"),0))}
      ${metric("52주 위치",pct(get(q,"52week_position","week52_position")))}
    </div>
  </div>

  <div class="card">
    <div class="title">🎯 종합 판단</div>
    <div class="judge">${esc(judgment)}</div>

    <div class="scoreRow"><span>매집 점수</span><b>${num(accumulation,0)}/100</b></div>
    <div class="bar"><div class="fillA" style="width:${Math.max(0,Math.min(100,accumulation))}%"></div></div>

    <div class="scoreRow"><span>매도 점수</span><b>${num(selling,0)}/100</b></div>
    <div class="bar"><div class="fillB" style="width:${Math.max(0,Math.min(100,selling))}%"></div></div>

    <div class="reason">
      ${Array.isArray(reasons)?reasons.map(x=>"• "+esc(x)).join("<br>"):
        esc(reasons||"가격·거래량·다크풀·공매도·희석·기술지표를 종합하여 판단합니다.")}
    </div>
  </div>

  <div class="card">
    <div class="title">📈 주가 차트</div>
    <canvas id="chart"></canvas>
    <div class="small">최근 거래일 기준 · 실제 수집 데이터만 표시</div>
  </div>

  <div class="card">
    <div class="title">📊 핵심 지표</div>
    <div class="grid">
      ${metric("MA20 · 최근 20일 평균",num(get(t,"ma20","MA20")))}
      ${metric("MA50 · 최근 50일 평균",num(get(t,"ma50","MA50")))}
      ${metric("MA200 · 장기 평균",num(get(t,"ma200","MA200")))}
      ${metric("RSI · 상승/하락 강도",num(get(t,"rsi","RSI")))}
      ${metric("VWAP · 거래량 가중 평균",num(get(t,"vwap","VWAP")))}
      ${metric("OBV · 거래량 흐름",num(get(t,"obv","OBV"),0))}
      ${metric("거래량 / 20일 평균",pct(get(t,"volumeRatio","volume_ratio")))}
      ${metric("추세",get(t,"trend","Trend"))}
    </div>
  </div>

  <details>
    <summary>🌑 다크풀 · 매집 / 분산</summary>
    <div class="content">
      ${row("다크풀 비율",pct(get(dark,"darkPoolPercent","percentage","ratio")),"DarkFina / FINRA ATS")}
      ${row("다크풀 거래량",num(get(dark,"volume"),0))}
      ${row("다크풀 거래금액",get(dark,"value","dollarVolume"))}
      ${row("5일 평균",pct(get(dark,"avg5","fiveDayAverage")))}
      ${row("22일 평균",pct(get(dark,"avg22","twentyTwoDayAverage")))}
      ${row("66일 평균",pct(get(dark,"avg66","sixtySixDayAverage")))}
      ${row("매수 비율",pct(get(dark,"buyPercent","buyRatio")))}
      ${row("매도 비율",pct(get(dark,"sellPercent","sellRatio")))}
      ${row("판정",get(dark,"judgment","signal"))}
    </div>
  </details>

  <details>
    <summary>🔥 공매도 / Short Interest</summary>
    <div class="content">
      ${row("Short Interest",num(get(short,"shortInterest","sharesShort"),0),"FINRA")}
      ${row("Short % Float",pct(get(short,"shortPercentFloat","shortPctFloat")),"FINRA")}
      ${row("Days to Cover",num(get(short,"daysToCover")),"FINRA")}
      ${row("전회
