<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1">

<title>RabbitStock Ultimate</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#08101d;
  color:#edf3ff;
  font-family:-apple-system,BlinkMacSystemFont,
  "Segoe UI",sans-serif;
}

header{
  padding:18px 14px 10px;
  position:sticky;
  top:0;
  background:#08101dee;
  backdrop-filter:blur(12px);
  z-index:5;
}

.logo{
  font-size:22px;
  font-weight:900;
}

.sub{
  color:#8492a8;
  font-size:12px;
  margin-top:3px;
}

.search{
  display:flex;
  gap:8px;
  margin-top:14px;
}

input{
  flex:1;
  background:#111c2d;
  border:1px solid #26364e;
  color:white;
  padding:13px;
  border-radius:12px;
  font-size:16px;
  text-transform:uppercase;
}

button{
  border:0;
  border-radius:12px;
  padding:0 17px;
  background:#2d7cff;
  color:white;
  font-weight:800;
}

main{
  padding:8px 12px 30px;
}

.card{
  background:#101a2a;
  border:1px solid #223149;
  border-radius:16px;
  margin:10px 0;
  padding:15px;
}

.title{
  font-size:16px;
  font-weight:900;
  margin-bottom:12px;
}

.price{
  font-size:34px;
  font-weight:900;
}

.change{
  font-size:17px;
  margin-top:4px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.box{
  background:#0b1422;
  border-radius:12px;
  padding:11px;
}

.label{
  color:#8492a8;
  font-size:11px;
}

.value{
  margin-top:5px;
  font-weight:800;
  font-size:15px;
}

.bar{
  height:9px;
  background:#1e2b3e;
  border-radius:20px;
  overflow:hidden;
  margin-top:6px;
}

.fill{
  height:100%;
  background:#3d8bfd;
}

.good{color:#4ddc8a}
.bad{color:#ff6575}
.warn{color:#ffbd58}
.gray{color:#8492a8}

.bigscore{
  font-size:42px;
  font-weight:900;
  text-align:center;
}

.center{
  text-align:center;
}

.row{
  display:flex;
  justify-content:space-between;
  padding:8px 0;
  border-bottom:1px solid #1d2a3d;
  font-size:13px;
}

.row:last-child{
  border-bottom:0;
}

.source{
  color:#64748b;
  font-size:10px;
  margin-top:10px;
}

.news{
  padding:10px 0;
  border-bottom:1px solid #1d2a3d;
}

.news:last-child{
  border:0;
}

.news a{
  color:#eaf1ff;
  text-decoration:none;
  font-size:13px;
  font-weight:700;
}

.small{
  font-size:11px;
  color:#718097;
  margin-top:4px;
}

.loading{
  text-align:center;
  padding:30px;
  color:#8290a5;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  background:#19283d;
  font-size:11px;
  font-weight:800;
}
</style>
</head>

<body>

<header>
  <div class="logo">🐇 RabbitStock Ultimate</div>
  <div class="sub">실제 데이터 기반 자동 분석</div>

  <div class="search">
    <input id="symbol"
           value="BRNX"
           maxlength="10"
           placeholder="티커 입력">
    <button onclick="load()">분석</button>
  </div>
</header>

<main id="app">
  <div class="loading">
    데이터를 불러오는 중...
  </div>
</main>

<script>

const API =
"https://rabbitstock-final.keoss.workers.dev";

const $ = id =>
document.getElementById(id);

function num(v,d=2){
  if(v===null ||
     v===undefined ||
     !Number.isFinite(Number(v)))
    return "데이터 없음";

  return Number(v).toLocaleString(
    "en-US",
    {maximumFractionDigits:d}
  );
}

function pct(v){
  if(v===null ||
     v===undefined ||
     !Number.isFinite(Number(v)))
    return "데이터 없음";

  return Number(v).toFixed(2)+"%";
}

function color(v){
  if(v===null ||
     v===undefined ||
     !Number.isFinite(Number(v)))
    return "gray";

  return Number(v)>=0
    ? "good"
    : "bad";
}

function scoreBar(v){
  if(v===null ||
     v===undefined ||
     !Number.isFinite(Number(v)))
    return `<div class="gray">데이터 없음</div>`;

  return `
    <div>${Number(v).toFixed(0)}</div>
    <div class="bar">
      <div class="fill"
           style="width:${Math.max(0,Math.min(100,v))}%">
      </div>
    </div>`;
}

function value(v){
  if(v===null ||
     v===undefined ||
     !Number.isFinite(Number(v)))
    return `<span class="gray">데이터 없음</span>`;

  return num(v);
}

function row(a,b){
  return `
    <div class="row">
      <span>${a}</span>
      <b>${b}</b>
    </div>`;
}

function status(ok, text){
  return `
    <span class="badge ${ok?'good':'warn'}">
      ${ok?'● ':'⚠ '}${text}
    </span>`;
}

async function load(){

  const symbol =
    $("symbol").value
      .trim()
      .toUpperCase();

  if(!symbol) return;

  $("app").innerHTML =
    `<div class="loading">
      ${symbol} 데이터 분석 중...<br><br>
      주가 → 공매도 → SEC → 희석 → 워런트 → 매집 분석
    </div>`;

  try{

    const r =
      await fetch(
        API +
        "/all?symbol=" +
        encodeURIComponent(symbol),
        {cache:"no-store"}
      );

    if(!r.ok)
      throw new Error("API 오류");

    const d = await r.json();

    render(d);

  }catch(e){

    $("app").innerHTML = `
      <div class="card center">
        <div class="title">
          ⚠️ 데이터 연결 실패
        </div>
        <div class="gray">
          ${e.message}
        </div>
        <br>
        <button onclick="load()">
          다시 시도
        </button>
      </div>`;
  }
}

function render(d){

  const q = d.quote || {};
  const f = d.flow || {};
  const si = d.shortInterest || {};
  const rs = d.regSho || {};
  const dil = d.dilution || {};
  const a = d.analysis || {};
  const news = d.news?.items || [];

  const changeClass =
    Number(q.changePercent)>=0
      ? "good"
      : "bad";

  $("app").innerHTML = `

  <!-- PRICE -->

  <div class="card">

    <div class="title">
      📊 ${d.symbol}
      <span class="badge">
        ${q.exchange || "시장"}
      </span>
    </div>

    <div class="price">
      $${value(q.price)}
    </div>

    <div class="change ${changeClass}">
      ${q.changePercent===null
        ? "데이터 없음"
        : `${q.change>=0?"▲":"▼"}
           ${num(q.change)} 
           (${pct(q.changePercent)})`}
    </div>

    <div class="grid"
         style="margin-top:14px">

      <div class="box">
        <div class="label">거래량</div>
        <div class="value">
          ${value(q.volume)}
        </div>
      </div>

      <div class="box">
        <div class="label">20일 평균</div>
        <div class="value">
          ${value(q.avgVolume20)}
        </div>
      </div>

      <div class="box">
        <div class="label">거래량 급증</div>
        <div class="value">
          ${q.volumeSurge===null
            ?"데이터 없음"
            :q.volumeSurge.toFixed(2)+"x"}
        </div>
      </div>

      <div class="box">
        <div class="label">52주 위치</div>
        <div class="value">
          ${pct(q.position52)}
        </div>
      </div>

    </div>

    <div class="source">
      출처: ${q.source || "확인 안 됨"}
    </div>

  </div>


  <!-- FINAL SCORE -->

  <div class="card">

    <div class="title">
      🎯 종합 분석
    </div>

    <div class="bigscore">
      ${a.score===null
        ?"—"
        :Number(a.score).toFixed(0)+"/100"}
    </div>

    <div class="center">
      ${a.verdict || "판단 불가"}
    </div>

    <br>

    <div class="grid">

      <div class="box">
        <div class="label">데이터 커버리지</div>
        <div class="value">
          ${pct(a.coverage)}
        </div>
      </div>

      <div class="box">
        <div class="label">신뢰도</div>
        <div class="value">
          ${a.dataQuality || "데이터 부족"}
        </div>
      </div>

    </div>

  </div>


  <!-- SHORT -->

  <div class="card">

    <div class="title">
      🩳 공매도 분석
    </div>

    ${
      si.ok
      ? `
        ${row("결제일",si.settlementDate || "—")}
        ${row("Short Interest",
               value(si.currentShort))}
        ${row("이전 SI",
               value(si.previousShort))}
        ${row("SI 변화",
               si.changePercent===null
               ?"데이터 없음"
               :pct(si.changePercent))}
      `
      : `
        <div class="box warn">
          ⚠️ Short Interest 데이터 없음
          <br>
          <span class="small">
            데이터가 없다고 공매도가 낮은 것은 아닙니다.
          </span>
        </div>
      `
    }

    <br>

    <b>Reg SHO 일일 공매도</b>

    ${
      rs.ok
      ? `
        ${row("최근 일자",
               rs.latest?.date || "—")}
        ${row("Short Volume",
               value(rs.latest?.shortVolume))}
        ${row("전체 Volume",
               value(rs.latest?.totalVolume))}
        ${row("Short Ratio",
               pct(rs.latest?.shortRatio))}
        ${row("평균 Ratio",
               pct(rs.averageRatio20))}
      `
      : `
        <div class="box warn"
             style="margin-top:8px">
          ⚠️ Reg SHO 데이터 없음
        </div>
      `
    }

    <div class="source">
      Short Interest와 Reg SHO는 서로 다른 데이터입니다.
    </div>

  </div>


  <!-- DILUTION -->

  <div class="card">

    <div class="title">
      🧬 희석 분석
    </div>

    ${
      dil.ok
      ? `
        ${row(
          "현재 발행주식",
          value(dil.currentOutstandingShares)
        )}

        ${row(
          "등록주식",
          value(dil.registeredShares)
        )}

        ${row(
          "현재 희석",
          dil.currentDilutionPercent===null
          ?"확정 불가"
          :pct(dil.currentDilutionPercent)
        )}

        ${row(
          "잠재 희석",
          dil.potentialWarrantDilutionPercent===null
          ?"데이터 없음"
          :pct(dil.potentialWarrantDilutionPercent)
        )}

        ${row(
          "등록 형태",
          dil.resaleRegistration
          ?"재판매 등록"
          :dil.primaryOffering
            ?"신규/Primary 가능"
            :"확인 필요"
        )}

        ${row(
          "최근 공시",
          `${dil.latestFiling?.form || "—"}
           ${dil.latestFiling?.filingDate || ""}`
        )}
      `
      : `
        <div class="box warn">
          ⚠️ 희석 데이터 부족
        </div>
      `
    }

    <div class="source">
      과거 F-3 등록주식을 단순 합산하지 않습니다.
    </div>

  </div>


  <!-- WARRANT -->

  <div class="card">

    <div class="title">
      🎫 워런트 분석
    </div>

    ${
      dil.ok
      ? `
        ${row(
          "워런트",
          value(dil.warrantShares)
        )}

        ${row(
          "행사가",
          dil.exercisePrice===null
          ?"데이터 없음"
          :"$"+num(dil.exercisePrice)
        )}

        ${row(
          "현재가",
          q.price===null
          ?"데이터 없음"
          :"$"+num(q.price)
        )}

        ${row(
          "상태",
          dil.warrantStatus || "데이터 없음"
        )}
      `
      : `
        <div class="box warn">
          ⚠️ 워런트 데이터 부족
        </div>
      `
    }

    <div class="source">
      실제 SEC 공시에서 확인 가능한 값만 표시합니다.
    </div>

  </div>


  <!-- FLOW -->

  <div class="card">

    <div class="title">
      💰 매집 / 매도 분석
    </div>

    ${
      f.ok
      ? `
        <div class="grid">

          <div class="box">
            <div class="label">
              매집 가능성
            </div>
            <div class="value good">
              ${pct(f.accumulationScore)}
            </div>
            ${scoreBar(f.accumulationScore)}
          </div>

          <div class="box">
            <div class="label">
              분산 가능성
            </div>
            <div class="value bad">
              ${pct(f.distributionScore)}
            </div>
            ${scoreBar(f.distributionScore)}
          </div>

        </div>

        <br>

        ${row(
          "판정",
          f.signal || "중립"
        )}

        ${row(
          "거래량 비율",
          f.volumeRatio===null
          ?"데이터 없음"
          :f.volumeRatio.toFixed(2)+"x"
        )}

        ${row(
          "VWAP",
          d.vwap===null
          ?"데이터 없음"
          :"$"+num(d.vwap)
        )}
      `
      : `
        <div class="box warn">
          ⚠️ 매집/분산 데이터 부족
        </div>
      `
    }

    <div class="source">
      매집/분산은 가격·거래량 기반 추정치이며 실제 투자자 주체를 직접 확인하는 값은 아닙니다.
    </div>

  </div>


  <!-- PRICE TREND -->

  <div class="card">

    <div class="title">
      📈 가격 추세
    </div>

    ${row(
      "단기 추세",
      q.trend || "데이터 없음"
    )}

    ${row(
      "20일 평균",
      q.sma20===null
      ?"데이터 없음"
      :"$"+num(q.sma20)
    )}

    ${row(
      "50일 평균",
      q.sma50===null
      ?"데이터 없음"
      :"$"+num(q.sma50)
    )}

    ${row(
      "200일 평균",
      q.sma200===null
      ?"데이터 없음"
      :"$"+num(q.sma200)
    )}

    ${row(
      "52주 고가",
      q.high52===null
      ?"데이터 없음"
      :"$"+num(q.high52)
    )}

    ${row(
      "52주 저가",
      q.low52===null
      ?"데이터 없음"
      :"$"+num(q.low52)
    )}

  </div>


  <!-- SEC -->

  <div class="card">

    <div class="title">
      📑 SEC 최근 공시
    </div>

    ${
      d.sec?.filings?.length
      ? d.sec.filings.slice(0,8).map(x=>`
        <div class="news">
          <a href="${x.url}"
             target="_blank">
            ${x.form} · ${x.filingDate}
          </a>
          <div class="small">
            ${x.description || x.primaryDocument}
          </div>
        </div>
      `).join("")
      : `<div class="gray">
           SEC 공시 데이터 없음
         </div>`
    }

  </div>


  <!-- NEWS -->

  <div class="card">

    <div class="title">
      📰 최근 뉴스
    </div>

    ${
      news.length
      ? news.slice(0,10).map(x=>`
        <div class="news">
          <a href="${x.link}"
             target="_blank">
            ${x.title}
          </a>
          <div class="small">
            ${x.publisher || ""}
          </div>
        </div>
      `).join("")
      : `<div class="gray">
           뉴스 데이터 없음
         </div>`
    }

  </div>


  <div class="card center">

    <div class="title">
      🧠 최종 판단
    </div>

    <div style="font-size:20px;font-weight:900">
      ${a.verdict || "판단 불가"}
    </div>

    <br>

    <div class="small">
      데이터가 없는 항목은 0점으로 처리하지 않습니다.
      <br>
      투자 판단 전 원문 공시와 시장 데이터를 확인하세요.
    </div>

    <div class="source">
      업데이트: ${d.updatedAt || "—"}
    </div>

  </div>

  `;
}

load();

</script>

</body>
</html>
