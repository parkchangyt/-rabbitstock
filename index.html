<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RabbitStock</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#080d19;
 color:#f2f5ff;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.wrap{
 max-width:900px;
 margin:auto;
 padding:14px;
}

.top{
 position:sticky;
 top:0;
 z-index:10;
 background:#080d19ee;
 backdrop-filter:blur(14px);
 padding:8px 0 12px;
}

h1{
 margin:4px 0;
 font-size:28px;
}

.sub{
 color:#8e9ab7;
 font-size:12px;
}

.search{
 display:flex;
 gap:7px;
 margin-top:12px;
}

input{
 flex:1;
 min-width:0;
 padding:14px;
 border-radius:12px;
 border:1px solid #34415f;
 background:#121a2d;
 color:#fff;
 font-size:17px;
 text-transform:uppercase;
}

button{
 border:0;
 border-radius:12px;
 padding:13px 16px;
 background:#5c7cff;
 color:#fff;
 font-weight:800;
}

.status{
 margin:10px 0;
 padding:10px;
 border-radius:10px;
 background:#11192c;
 color:#9ca9c6;
 font-size:12px;
}

.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:9px;
}

.card{
 background:#11192c;
 border:1px solid #273552;
 border-radius:16px;
 padding:15px;
 margin-bottom:10px;
}

.wide{
 grid-column:1/-1;
}

h2,h3{
 margin:0 0 12px;
}

.label{
 color:#8996b5;
 font-size:11px;
}

.value{
 font-size:23px;
 font-weight:900;
 margin-top:4px;
}

.small{
 color:#aeb9d2;
 font-size:12px;
 line-height:1.6;
}

.good{color:#5fe6a4}
.bad{color:#ff7189}
.warn{color:#ffd166}
.blue{color:#7fa2ff}

.score{
 font-size:50px;
 font-weight:950;
}

.bar{
 height:9px;
 background:#293551;
 border-radius:9px;
 overflow:hidden;
 margin:10px 0;
}

.bar i{
 display:block;
 height:100%;
 background:#6685ff;
}

.row{
 display:flex;
 justify-content:space-between;
 gap:10px;
 padding:9px 0;
 border-bottom:1px solid #26324d;
}

.row:last-child{
 border-bottom:0;
}

.info{
 display:inline-flex;
 width:18px;
 height:18px;
 align-items:center;
 justify-content:center;
 border:1px solid #67728d;
 border-radius:50%;
 color:#b5bfd5;
 font-size:11px;
 cursor:pointer;
}

.explain{
 display:none;
 margin-top:8px;
 padding:10px;
 background:#0b1223;
 border-radius:10px;
 color:#aab6d0;
 font-size:12px;
 line-height:1.6;
}

.show{
 display:block;
}

table{
 width:100%;
 border-collapse:collapse;
 font-size:12px;
}

th,td{
 padding:8px;
 border-bottom:1px solid #293550;
 text-align:right;
}

th:first-child,
td:first-child{
 text-align:left;
}

.news a{
 color:#dce5ff;
 text-decoration:none;
}

.news a:hover{
 text-decoration:underline;
}

.tag{
 display:inline-block;
 background:#263451;
 border-radius:7px;
 padding:4px 7px;
 margin:2px;
 font-size:10px;
}

.alert{
 background:#251a20;
 border:1px solid #633040;
 padding:11px;
 border-radius:11px;
 color:#ffb0bd;
 font-size:12px;
 line-height:1.6;
}

@media(max-width:600px){

 .wrap{
  padding:11px;
 }

 .value{
  font-size:20px;
 }

 .score{
  font-size:44px;
 }

 button{
  padding:12px;
 }

}
</style>
</head>

<body>

<div class="wrap">

<div class="top">

<h1>🐰 RabbitStock</h1>

<div class="sub">
주가 · 공매도 · SEC · 뉴스 · 희석 · 숏스퀴즈 종합분석
</div>

<div class="search">

<input
 id="ticker"
 value="BRNX"
 maxlength="12"
 autocomplete="off"
>

<button onclick="loadData()">분석</button>

<button onclick="loadData()">↻</button>

</div>

</div>

<div id="status" class="status">
데이터 불러오는 중...
</div>

<div id="app"></div>

</div>


<script>

const API=
"https://rabbitstock-final.keoss.workers.dev";


const $=id=>
document.getElementById(id);


function esc(v){

 return String(v ?? "")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");

}


function number(v,d=2){

 if(v===null || v===undefined || !Number.isFinite(Number(v))){
  return "N/A";
 }

 return Number(v).toLocaleString(
  "en-US",
  {maximumFractionDigits:d}
 );

}


function percent(v){

 if(v===null || v===undefined || !Number.isFinite(Number(v))){
  return "N/A";
 }

 return Number(v).toFixed(2)+"%";

}


function explain(text){

 return `
 <span
 class="info"
 onclick="
 this.parentElement.nextElementSibling
 .classList.toggle('show')
 "
 >i</span>

 <div class="explain">
 ${esc(text)}
 </div>
 `;

}


function card(title,body){

 return `
 <section class="card wide">

 <h3>${title}</h3>

 ${body}

 </section>
 `;

}


function scoreColor(score){

 if(score>=70) return "good";

 if(score>=45) return "warn";

 return "bad";

}


async function loadData(){

 let ticker=
 $("ticker").value.trim().toUpperCase();

 if(!/^[A-Z0-9.-]{1,12}$/.test(ticker)){

  $("status").textContent=
  "티커를 확인하세요.";

  return;

 }

 $("status").textContent=
 `${ticker} 데이터 불러오는 중...`;

 $("app").innerHTML="";

 try{

  const response=
  await fetch(
   API+
   "/all?symbol="+
   encodeURIComponent(ticker)+
   "&_="+Date.now(),
   {cache:"no-store"}
  );

  if(!response.ok){

   throw new Error(
    "HTTP "+response.status
   );

  }

  const data=
  await response.json();

  render(data);

 }

 catch(error){

  $("status").textContent=
  "데이터 연결 실패";

  $("app").innerHTML=

  card(
   "⚠️ 연결 오류",
   `
   <div class="small">
   Worker 연결에 실패했습니다.<br><br>
   ${esc(error.message)}
   </div>
   `
  );

 }

}


function render(d){

 const q=
 d.quote || {};

 const s=
 d.short || {};

 const si=
 s.shortInterest || {};

 const ds=
 s.dailyShortVolume || {};

 const sec=
 d.sec || {};

 const sa=
 sec.analysis || {};

 const news=
 d.news?.news || [];

 const analysis=
 d.analysis || {};


 let score=
 analysis.score;


 if(score===null || score===undefined){

  score=50;

  if(ds.shortRatio!=null &&
     ds.averageShortRatio!=null){

   if(
    ds.shortRatio>
    ds.averageShortRatio
   ){

    score+=12;

   }

  }

  if(
   sa.riskScore!=null &&
   sa.riskScore<35
  ){

   score+=8;

  }

  if(
   q.changePercent!=null &&
   q.changePercent>-10
  ){

   score+=8;

  }

  score=
  Math.max(
   0,
   Math.min(100,score)
  );

 }


 let verdict=
 analysis.verdict;

 if(!verdict){

  if(score>=70)
   verdict="긍정";

  else if(score>=45)
   verdict="중립";

  else
   verdict="주의";

 }


 let shortRatio=
 ds.shortRatio;

 let avgShort=
 ds.averageShortRatio;


 let difference=
 (
  shortRatio!=null &&
  avgShort!=null
 )
 ?
 shortRatio-avgShort
 :
 null;


 let scoreClass=
 scoreColor(score);


 $("status").innerHTML=
 `
 ${esc(d.symbol||"")}

 · 업데이트

 ${esc(d.updatedAt||"")}

 ·

 <span class="${q.ok?"good":"bad"}">

 ${q.ok?"주가 정상":"주가 확인 필요"}

 </span>
 `;


 let html="";


 /* 현재가 */

 html+=card(
 "💵 현재 주가",

 `
 <div class="grid">

 <div>

 <div class="label">
 현재가
 </div>

 <div class="value">
 $${number(q.price,4)}
 </div>

 <div class="small">
 ${esc(q.currency||"USD")}
 ·
 ${esc(q.exchange||"")}
 </div>

 </div>


 <div>

 <div class="label">
 등락
 </div>

 <div class="value ${
  Number(q.change)>=0
  ?"good"
  :"bad"
 }">

 ${
  q.change==null
  ?"N/A"
  :
  (
   Number(q.change)>=0
   ?"+"
   :""
  )
  +
  number(q.change,4)
 }
 
 (${percent(q.changePercent)})

 </div>

 </div>


 <div>

 <div class="label">
 전일 종가
 </div>

 <div class="value">
 $${number(q.previousClose,4)}
 </div>

 </div>


 <div>

 <div class="label">
 거래 데이터
 </div>

 <div class="small">
 ${esc(q.source||"N/A")}
 </div>

 </div>

 </div>

 ${explain(
 "현재가는 연결된 시세 데이터입니다. 장중 가격과 지연 가격이 다를 수 있으므로 실제 주문 화면의 가격도 함께 확인하세요."
 )}

 `
 );


 /* Rabbit Score */

 html+=card(
 "🐰 Rabbit Score",

 `
 <div class="score ${scoreClass}">
 ${number(score,0)}
 <span style="font-size:18px">
 / 100
 </span>
 </div>

 <div class="bar">

 <i style="
 width:${Math.max(
  0,
  Math.min(100,score)
 )}%
 "></i>

 </div>

 <div class="value ${scoreClass}"
 style="font-size:20px">

 ${esc(verdict)}

 </div>

 <div class="small">

 ${esc(
  analysis.analysisText ||
  "주가·공매도·SEC·뉴스 데이터를 종합한 참고용 점수입니다."
 )}

 </div>

 ${explain(
 "Rabbit Score는 여러 신호를 하나의 점수로 표현한 참고용 지표입니다. 점수가 높다고 주가 상승이나 수익이 보장되는 것은 아닙니다."
 )}

 `
 );


 /* 공매 */

 html+=card(
 "🔴 공매도 압박",

 `
 <div class="grid">

 <div>

 <div class="label">
 Daily Short Volume
 </div>

 <div class="value ${
  difference!=null &&
  difference>0
  ?"bad"
  :""
 }">

 ${percent(shortRatio)}

 </div>

 </div>


 <div>

 <div class="label">
 최근 평균
 </div>

 <div class="value">

 ${percent(avgShort)}

 </div>

 </div>


 <div>

 <div class="label">
 Days to Cover
 </div>

 <div class="value">

 ${number(si.daysToCover,2)}

 </div>

 </div>


 <div>

 <div class="label">
 Short Interest
 </div>

 <div class="value">

 ${number(si.currentShort,0)}

 </div>

 </div>

 </div>


 <div class="small">

 ${esc(
  s.squeeze ||
  "공매 데이터 확인 필요"
 )}

 </div>


 ${explain(
 "FINRA Daily Short Volume은 그날 보고된 거래량 중 Short Volume으로 분류된 비중입니다. 실제 Short Interest와 동일하지 않습니다."
 )}

 `
 );


 /* 공매 역사 */

 let history="";

 for(
  const item of
  (ds.history||[])
 ){

  history+=`

  <tr>

  <td>
  ${esc(item.date)}
  </td>

  <td>
  ${number(item.shortVolume,0)}
  </td>

  <td>
  ${number(item.totalVolume,0)}
  </td>

  <td>
  ${percent(item.shortRatio)}
  </td>

  </tr>

  `;

 }


 html+=card(
 "📊 최근 공매 거래비중",

 `
 <table>

 <thead>

 <tr>

 <th>날짜</th>
 <th>Short</th>
 <th>Total</th>
 <th>비중</th>

 </tr>

 </thead>

 <tbody>

 ${
  history ||
  `
  <tr>
  <td colspan="4">
  N/A
  </td>
  </tr>
  `
 }

 </tbody>

 </table>


 ${explain(
 "최근 FINRA Consolidated NMS Daily Short Sale Volume 데이터입니다. 이 수치는 Short Interest 잔고가 아니라 거래량 기준 데이터입니다."
 )}

 `
 );


 /* 숏스퀴즈 */

 let squeezeText=
 "보통";

 if(
  difference!=null &&
  difference>=10 &&
  si.daysToCover!=null &&
  si.daysToCover>=1
 ){

  squeezeText=
  "관심";

 }

 if(
  difference!=null &&
  difference>=15 &&
  si.daysToCover!=null &&
  si.daysToCover>=2
 ){

  squeezeText=
  "높음";

 }


 html+=card(
 "🔥 숏스퀴즈 레이더",

 `
 <div class="row">

 <span>
 공매 거래비중
 </span>

 <b>
 ${
  difference==null
  ?"N/A"
  :
  (
   difference>=0
   ?"평균 대비 +"
   :"평균 대비 "
  )
  +
  difference.toFixed(2)
  +"%p"
 }
 </b>

 </div>


 <div class="row">

 <span>
 Days to Cover
 </span>

 <b>
 ${number(si.daysToCover,2)}
 </b>

 </div>


 <div class="row">

 <span>
 Short Interest
 </span>

 <b>
 ${number(si.currentShort,0)}
 </b>

 </div>


 <div class="row">

 <span>
 현재 판단
 </span>

 <b class="${
  squeezeText==="높음"
  ?"bad"
  :
  squeezeText==="관심"
  ?"warn"
  :""
 }">

 ${squeezeText}

 </b>

 </div>


 <div class="alert">

 ⚠️ Short Interest 실제 주식 수가 없으면
 숏스퀴즈 강도를 확정할 수 없습니다.

 </div>


 ${explain(
 "숏스퀴즈는 공매 잔고, Days to Cover, 거래량, 가격 상승, 매수세 등이 동시에 개선될 때 가능성이 커집니다. Daily Short Volume 하나만으로 숏스퀴즈를 판단하면 안 됩니다."
 )}

 `
 );


 /* SEC */

 html+=card(
 "🏦 SEC / 희석 레이더",

 `
 <div class="grid">

 <div>

 <div class="label">
 회사
 </div>

 <div class="small">
 ${esc(
  sec.companyName||"N/A"
 )}
 </div>

 </div>


 <div>

 <div class="label">
 CIK
 </div>

 <div class="small">
 ${esc(sec.cik||"N/A")}
 </div>

 </div>


 <div>

 <div class="label">
 위험 점수
 </div>

 <div class="value">
 ${number(sa.riskScore,0)}
 </div>

 </div>


 <div>

 <div class="label">
 위험 등급
 </div>

 <div class="value ${
  sa.riskLevel==="낮음"
  ?"good"
  :"warn"
 }">

 ${esc(
  sa.riskLevel||"N/A"
 )}

 </div>

 </div>

 </div>


 <div class="row">

 <span>
 등록/증권
 </span>

 <b>
 ${esc(
  sa.offering||"N/A"
 )}
 </b>

 </div>


 <div class="row">

 <span>
 희석
 </span>

 <b>
 ${esc(
  sa.dilution||"N/A"
 )}
 </b>

 </div>


 <div class="row">

 <span>
 Warrant
 </span>

 <b>
 ${esc(
  sa.warrant||"N/A"
 )}
 </b>

 </div>


 <div class="row">

 <span>
 ATM
 </span>

 <b>
 ${esc(
  sa.atm||"N/A"
 )}
 </b>

 </div>


 <div class="row">

 <span>
 Convertible
 </span>

 <b>
 ${esc(
  sa.convertible||"N/A"
 )}
 </b>

 </div>


 ${explain(
 "F-3나 S-8 같은 등록 공시가 있다는 사실만으로 즉시 주식이 발행됐다는 뜻은 아닙니다. 실제 발행 여부와 조건은 SEC 원문을 확인해야 합니다."
 )}

 `
 );


 /* SEC 공시 */

 let filingHTML="";

 for(
  const f of
  (sec.filings||[]).slice(0,12)
 ){

  filingHTML+=`

  <div class="row">

  <span>
  ${esc(f.date)}
  ·
  ${esc(f.form)}
  </span>

  <a
  href="${esc(f.url)}"
  target="_blank"
  rel="noopener"
  style="color:#7fa2ff"
  >
  원문 ↗
  </a>

  </div>

  `;

 }


 html+=card(
 "📑 최근 SEC 공시",

 `
 <div>

 ${
  (sec.recentForms||[])
  .slice(0,20)
  .map(
   x=>`
   <span class="tag">
   ${esc(x)}
   </span>
   `
  )
  .join("")
  ||
  "N/A"
 }

 </div>

 ${filingHTML}

 `
 );


 /* 뉴스 */

 let newsHTML="";

 for(
  const n of news
 ){

  newsHTML+=`

  <div class="row">

  <div>

  <a
  href="${esc(n.link)}"
  target="_blank"
  rel="noopener"
  >

  ${esc(n.title)}

  </a>

  <div class="label">

  ${esc(n.source||"")}
  ·
  ${esc(n.publishedAt||"")}

  </div>

  </div>

  </div>

  `;

 }


 html+=card(
 "📰 최신 뉴스",

 `
 <div class="news">

 ${
  newsHTML ||
  "뉴스 없음"
 }

 </div>


 ${explain(
 "뉴스 제목과 원문 링크를 보여줍니다. 호재·악재 여부는 기사 원문과 실제 시장 반응을 함께 확인해야 합니다."
 )}

 `
 );


 /* 급등 조건 */

 let conditions=[];


 if(
  ds.shortRatio!=null &&
  ds.averageShortRatio!=null &&
  ds.shortRatio>ds.averageShortRatio
 ){

  conditions.push(
   "공매 거래비중 평균 상회"
  );

 }


 if(
  q.changePercent!=null &&
  q.changePercent>-5
 ){

  conditions.push(
   "가격 안정/반등"
  );

 }


 if(
  news.length>0
 ){

  conditions.push(
   "최근 뉴스 존재"
  );

 }


 if(
  sa.riskLevel==="낮음"
 ){

  conditions.push(
   "SEC 희석 위험 낮음"
  );

 }


 html+=card(
 "🚨 급등 조건 감시",

 `
 <div class="row">

 <span>
 현재 충족 조건
 </span>

 <b>
 ${conditions.length} / 4
 </b>

 </div>


 ${
  conditions.length
  ?
  conditions
  .map(
   x=>`
   <div class="row">
   <span>✓</span>
   <b>${esc(x)}</b>
   </div>
   `
  )
  .join("")
  :
  `
  <div class="small">
  현재 확인되는 강한 조건이 부족합니다.
  </div>
  `
 }


 ${explain(
 "급등 조건은 거래량, 공매 압박, 가격 움직임, SEC 위험, 뉴스 등을 조합한 참고용 신호입니다. 조건 충족만으로 급등을 예측할 수 없습니다."
 )}

 `
 );


 /* 한줄 해석 */

 html+=card(
 "🧠 현재 상황 한줄 해석",

 `
 <div
 class="small"
 style="
 font-size:15px;
 color:#eef2ff;
 "
 >

 ${makeInterpretation(
  q,
  ds,
  si,
  sa
 )}

 </div>

 ${explain(
 "현재 연결된 데이터를 자동으로 요약합니다. 데이터가 부족한 부분은 임의로 추정하지 않습니다."
 )}

 `
 );


 /* 데이터 상태 */

 html+=card(
 "📡 데이터 연결 상태",

 `
 ${stateRow(
  "Quote",
  q.ok
 )}

 ${stateRow(
  "Short",
  s.ok
 )}

 ${stateRow(
  "SEC",
  sec.ok
 )}

 ${stateRow(
  "News",
  d.news?.ok
 )}

 `
 );


 $("app").innerHTML=
 html;

}

function makeInterpretation(
 q,
 ds,
 si,
 sa
){

 let text=[];


 if(
  ds.shortRatio!=null
 ){

  text.push(
   `FINRA Daily Short Volume은 ${ds.shortRatio.toFixed(2)}%`
  );

 }


 if(
  ds.shortRatio!=null &&
  ds.averageShortRatio!=null
 ){

  let diff=
  ds.shortRatio-
  ds.averageShortRatio;

  text.push(
   `최근 평균보다 ${
    diff>=0
    ?"+"
    :""
   }${diff.toFixed(2)}%p`
  );

 }


 if(
  q.changePercent!=null
 ){

  text.push(
   `주가는 전일 대비 ${q.changePercent.toFixed(2)}%`
  );

 }


 if(
  si.daysToCover!=null
 ){

  text.push(
   `Days to Cover ${si.daysToCover.toFixed(2)}일`
  );

 }


 if(
  sa.riskLevel
 ){

  text.push(
   `SEC 희석 위험 ${sa.riskLevel}`
  );

 }


 if(text.length===0){

  return "현재 분석 가능한 데이터가 부족합니다.";

 }


 let result=
 text.join(" · ")+".";


 if(
  ds.shortRatio!=null &&
  ds.averageShortRatio!=null &&
  ds.shortRatio>
  ds.averageShortRatio
 ){

  result+=
  " 공매 거래비중은 최근 평균보다 높은 상태입니다.";

 }


 if(
  si.currentShort==null
 ){

  result+=
  " 실제 Short Interest 주식 수가 확인되지 않아 숏스퀴즈 강도 판단에는 제한이 있습니다.";

 }


 return result;

}
