<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>RabbitStock Ultimate</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#080d18;
 color:#eef3ff;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
.wrap{max-width:760px;margin:auto;padding:14px}
h1{margin:5px 0;font-size:25px}
.sub{color:#8290aa;font-size:12px;margin-bottom:14px}

.search{
 display:flex;gap:8px;margin-bottom:12px
}
input{
 flex:1;padding:13px;border-radius:12px;
 border:1px solid #263149;background:#101827;
 color:white;font-size:16px;text-transform:uppercase
}
button{
 border:0;border-radius:12px;padding:12px 15px;
 background:#3478f6;color:white;font-weight:700
}

.card{
 background:linear-gradient(145deg,#101827,#0c1321);
 border:1px solid #202c43;
 border-radius:18px;
 padding:16px;
 margin-bottom:12px;
 box-shadow:0 8px 25px #0004;
}
.price{
 font-size:34px;font-weight:800;margin-top:4px
}
.change{font-weight:700;margin-top:4px}
.up{color:#ff5964}
.down{color:#4aa3ff}
.muted{color:#8290aa}
.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:9px;
}
.metric{
 background:#0b1220;
 border:1px solid #1d2940;
 border-radius:12px;
 padding:11px;
}
.metric b{display:block;font-size:16px;margin-top:4px}
.metric span{font-size:11px;color:#7f8ca5}

.judgement{
 border-radius:16px;
 padding:17px;
 background:#111b2d;
 border:1px solid #263653;
}
.judge{
 font-size:25px;
 font-weight:900;
 margin:5px 0 8px;
}
.score{
 font-size:38px;
 font-weight:900;
}
.reason{
 padding:10px 0;
 border-top:1px solid #202c42;
 font-size:13px;
 line-height:1.5;
}

.chartbox{
 overflow:hidden;
}
.chart{
 width:100%;
 height:370px;
 background:#080e19;
 border-radius:14px;
 border:1px solid #1e2a40;
 position:relative;
 touch-action:none;
}
canvas{
 width:100%;
 height:100%;
 display:block;
}
.tooltip{
 position:absolute;
 display:none;
 background:#111b2c;
 border:1px solid #35435d;
 border-radius:10px;
 padding:9px 11px;
 font-size:11px;
 line-height:1.55;
 pointer-events:none;
 z-index:5;
 box-shadow:0 5px 20px #0008;
}
.legend{
 display:flex;
 gap:13px;
 flex-wrap:wrap;
 margin-top:9px;
 color:#9ba8bf;
 font-size:11px;
}
.legend span:before{
 content:"";
 display:inline-block;
 width:9px;height:9px;
 border-radius:50%;
 background:currentColor;
 margin-right:4px;
}
details{
 background:#101827;
 border:1px solid #202c43;
 border-radius:15px;
 margin-bottom:10px;
 overflow:hidden;
}
summary{
 padding:15px;
 font-weight:800;
 cursor:pointer;
}
.detail{
 padding:0 14px 14px;
}
table{
 width:100%;
 border-collapse:collapse;
 font-size:10px;
 white-space:nowrap;
}
th,td{
 padding:8px 5px;
 border-bottom:1px solid #1c2739;
 text-align:right;
}
th:first-child,td:first-child{text-align:left}
th{color:#7e8ba4}
.pos{color:#ff5964}
.neg{color:#4aa3ff}
.badge{
 display:inline-block;
 padding:4px 7px;
 border-radius:7px;
 background:#18243a;
 font-size:10px;
}
.loading{
 text-align:center;
 padding:25px;
 color:#8290aa;
}
.error{
 color:#ff6570;
 padding:12px;
 line-height:1.5;
}
.small{font-size:11px;color:#7f8ca5}
</style>
</head>

<body>
<div class="wrap">

<h1>🐰 RabbitStock Ultimate</h1>
<div class="sub">실시간 주가 · 캔들 · 공매도 · 희석 · 워런트 · SEC · 뉴스</div>

<div class="search">
<input id="symbol" value="BRNX" placeholder="티커 입력">
<button onclick="load()">분석</button>
</div>

<div id="app">
 <div class="loading">분석 데이터를 불러오는 중...</div>
</div>

</div>

<script>
const API="https://rabbitstock-final.keoss.workers.dev";

let history=[];
let canvas,ctx;
let chartData=[];
let dpr=window.devicePixelRatio||1;

function esc(v){
 return String(v??"데이터 없음")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;");
}

function num(v){
 if(v===null||v===undefined||v===""||isNaN(Number(v)))
   return null;
 return Number(v);
}

function money(v){
 let n=num(v);
 if(n===null)return "데이터 없음";
 return "$"+n.toLocaleString(undefined,{
   minimumFractionDigits:2,
   maximumFractionDigits:4
 });
}

function integer(v){
 let n=num(v);
 if(n===null)return "데이터 없음";
 return n.toLocaleString();
}

function pct(v){
 let n=num(v);
 if(n===null)return "데이터 없음";
 return (n>=0?"+":"")+n.toFixed(2)+"%";
}

function calcMA(data,n){
 return data.map((x,i)=>{
   if(i<n-1)return null;
   let a=data.slice(i-n+1,i+1)
     .map(z=>num(z.close))
     .filter(z=>z!==null);
   if(a.length<n)return null;
   return a.reduce((p,c)=>p+c,0)/n;
 });
}

function calcVWAP(data){
 let pv=0,v=0;
 return data.map(x=>{
   let c=num(x.close);
   let vol=num(x.volume);
   if(c===null||vol===null)return null;
   pv+=c*vol;
   v+=vol;
   return v?pv/v:null;
 });
}

function fmtDate(v){
 if(!v)return "데이터 없음";
 return String(v).slice(0,10);
}

function getClose(x){
 return num(x.close ?? x.price);
}

function prepareHistory(raw){
 if(!Array.isArray(raw))return [];

 return raw.map(x=>({
   date:x.date||x.datetime||x.time,
   open:num(x.open),
   high:num(x.high),
   low:num(x.low),
   close:getClose(x),
   volume:num(x.volume)
 })).filter(x=>
   x.date &&
   x.open!==null &&
   x.high!==null &&
   x.low!==null &&
   x.close!==null
 );
}

function createChart(data){

 canvas=document.getElementById("candleCanvas");
 if(!canvas)return;

 ctx=canvas.getContext("2d");

 const rect=canvas.getBoundingClientRect();

 canvas.width=rect.width*dpr;
 canvas.height=rect.height*dpr;

 ctx.setTransform(dpr,0,0,dpr,0,0);

 chartData=data;

 drawChart();

 canvas.ontouchstart=e=>{
   const t=e.touches[0];
   showPoint(t.clientX,t.clientY);
 };

 canvas.ontouchmove=e=>{
   const t=e.touches[0];
   showPoint(t.clientX,t.clientY);
 };

 canvas.onclick=e=>{
   showPoint(e.clientX,e.clientY);
 };
}

function drawChart(){

 const W=canvas.clientWidth;
 const H=canvas.clientHeight;

 ctx.clearRect(0,0,W,H);

 if(!chartData.length)return;

 const pad={
   l:42,
   r:10,
   t:15,
   b:42
 };

 const priceH=H*0.70;
 const volTop=priceH+10;
 const volH=H-volTop-pad.b;

 let highs=chartData.map(x=>x.high);
 let lows=chartData.map(x=>x.low);

 let max=Math.max(...highs);
 let min=Math.min(...lows);

 let range=max-min||1;

 max+=range*.05;
 min-=range*.05;

 const visible=chartData.slice(-80);

 const step=(W-pad.l-pad.r)/visible.length;
 const body=Math.max(3,step*.58);

 function py(p){
   return pad.t+(max-p)/(max-min)*(priceH-pad.t);
 }

 // 배경 가로선
 ctx.strokeStyle="#182238";
 ctx.lineWidth=1;

 for(let i=0;i<5;i++){
   let y=pad.t+(priceH-pad.t)*(i/4);
   ctx.beginPath();
   ctx.moveTo(pad.l,y);
   ctx.lineTo(W-pad.r,y);
   ctx.stroke();

   let p=max-(max-min)*(i/4);
   ctx.fillStyle="#64718a";
   ctx.font="10px sans-serif";
   ctx.textAlign="right";
   ctx.fillText(p.toFixed(2),pad.l-5,y+3);
 }

 // 거래량
 let vmax=Math.max(...visible.map(x=>x.volume||0),1);

 visible.forEach((x,i)=>{

   let xx=pad.l+i*step+step/2;

   let vh=((x.volume||0)/vmax)*volH;

   ctx.fillStyle="#293852";
   ctx.fillRect(
     xx-body/2,
     volTop+volH-vh,
     body,
     vh
   );
 });

 // 캔들
 visible.forEach((x,i)=>{

   let xx=pad.l+i*step+step/2;

   let o=py(x.open);
   let h=py(x.high);
   let l=py(x.low);
   let c=py(x.close);

   const rising=x.close>=x.open;

   ctx.strokeStyle=rising?"#ff5964":"#4aa3ff";
   ctx.fillStyle=rising?"#ff5964":"#4aa3ff";

   // 꼬리
   ctx.lineWidth=1;
   ctx.beginPath();
   ctx.moveTo(xx,h);
   ctx.lineTo(xx,l);
   ctx.stroke();

   // 몸통
   let top=Math.min(o,c);
   let bottom=Math.max(o,c);
   let bh=Math.max(1,bottom-top);

   ctx.fillRect(
     xx-body/2,
     top,
     body,
     bh
   );
 });

 // 날짜
 ctx.fillStyle="#65728b";
 ctx.font="10px sans-serif";
 ctx.textAlign="center";

 let indexes=[
   0,
   Math.floor(visible.length/2),
   visible.length-1
 ];

 indexes.forEach(i=>{
   if(visible[i])
     ctx.fillText(
       fmtDate(visible[i].date),
       pad.l+i*step+step/2,
       H-14
     );
 });

 // 구분선
 ctx.strokeStyle="#27334a";
 ctx.beginPath();
 ctx.moveTo(pad.l,volTop);
 ctx.lineTo(W-pad.r,volTop);
 ctx.stroke();
}

function showPoint(clientX,clientY){

 if(!canvas)return;

 const rect=canvas.getBoundingClientRect();

 let x=clientX-rect.left;

 const padL=42;
 const padR=10;

 const visible=chartData.slice(-80);

 const step=(canvas.clientWidth-padL-padR)/visible.length;

 let idx=Math.round((x-padL-step/2)/step);

 if(idx<0)idx=0;
 if(idx>=visible.length)idx=visible.length-1;

 const item=visible[idx];

 if(!item)return;

 let tip=document.getElementById("tooltip");

 tip.style.display="block";

 let left=Math.min(
   Math.max(5,x+8),
   canvas.clientWidth-190
 );

 let top=Math.min(
   Math.max(5,clientY-rect.top-70),
   canvas.clientHeight-130
 );

 tip.style.left=left+"px";
 tip.style.top=top+"px";

 let prev=visible[idx-1];

 let daily=null;

 if(prev&&prev.close){
   daily=(item.close/prev.close-1)*100;
 }

 tip.innerHTML=`
 <b>${esc(fmtDate(item.date))}</b><br>
 시가 ${money(item.open)}<br>
 고가 ${money(item.high)}<br>
 저가 ${money(item.low)}<br>
 종가 <b>${money(item.close)}</b><br>
 거래량 ${integer(item.volume)}<br>
 거래대금 ${
   item.volume!==null&&item.close!==null
   ? money(item.close*item.volume)
   :"데이터 없음"
 }<br>
 등락률 ${pct(daily)}
 `;
}

function metric(title,value,desc){
 return `
 <div class="metric">
   <span>${esc(title)}</span>
   <b>${value}</b>
   <span>${esc(desc)}</span>
 </div>`;
}

function find(obj,...keys){
 for(const k of keys){
   if(obj && obj[k]!==undefined && obj[k]!==null)
     return obj[k];
 }
 return null;
}

function getObj(d,...keys){
 for(const k of keys){
   if(d && typeof d[k]==="object" && d[k])
     return d[k];
 }
 return {};
}

function buildReasons(d){

 let r=[];

 let q=getObj(d,"quote");
 let tech=getObj(d,"technical","technicals");

 let price=num(find(q,"price","close", "current"));

 let ma20=num(find(tech,"ma20","MA20"));
 let ma50=num(find(tech,"ma50","MA50"));

 if(price!==null&&ma20!==null){
   r.push(
    price>=ma20
    ?"주가가 MA20 위에 있어 단기 추세는 상대적으로 강합니다."
    :"주가가 MA20 아래라 단기 추세는 약합니다."
   );
 }

 if(price!==null&&ma50!==null){
   r.push(
    price>=ma50
    ?"주가가 MA50 위에 있어 중기 추세가 유지되고 있습니다."
    :"주가가 MA50 아래라 중기 추세 회복이 필요합니다."
   );
 }

 let short=getObj(d,"short","finra");
 let si=find(short,"shortInterest","short_interest");

 if(si!==null){
   r.push("공매도 데이터가 확인되어 수급 판단에 반영했습니다.");
 }else{
   r.push("공매도 실제 수치가 없어 해당 부분은 보수적으로 판단했습니다.");
 }

 let dilution=getObj(d,"dilution");

 if(dilution && Object.keys(dilution).length){
   r.push("SEC 공시에서 희석 가능성을 확인해 실제 발행주식수와 함께 판단해야 합니다.");
 }

 if(!r.length)
   r.push("현재 확보된 데이터만으로 판단하며 데이터가 없는 항목은 점수에 과도하게 반영하지 않습니다.");

 return r;
}

async function load(){

 const symbol=document.getElementById("symbol")
   .value.trim().toUpperCase();

 if(!symbol)return;

 const app=document.getElementById("app");

 app.innerHTML=`<div class="loading">${symbol} 분석 중...</div>`;

 try{

   const res=await fetch(
     API+"/all?symbol="+encodeURIComponent(symbol)
   );

   if(!res.ok)
     throw new Error("API 오류 "+res.status);

   const d=await res.json();

   render(symbol,d);

 }catch(e){

   app.innerHTML=`
   <div class="card error">
   데이터를 불러오지 못했습니다.<br><br>
   ${esc(e.message)}<br><br>
   Worker 주소 또는 API 연결 상태를 확인하세요.
   </div>`;
 }
}

function render(symbol,d){

 const q=getObj(d,"quote");

 const price=num(find(q,"price","close","current"));
 const change=num(find(q,"change_percent","percent_change","changePercent"));

 const technical=getObj(d,"technical","technicals");
 const ma20=num(find(technical,"ma20","MA20"));
 const ma50=num(find(technical,"ma50","MA50"));
 const rsi=num(find(technical,"rsi","RSI"));
 const vwap=num(find(technical,"vwap","VWAP"));
 const obv=find(technical,"obv","OBV");

 history=prepareHistory(
   find(d,"history","prices","timeSeries") || []
 );

 let ma20arr=calcMA(history,20);
 let ma50arr=calcMA(history,50);
 let vwaparr=calcVWAP(history);

 history=history.map((x,i)=>({
   ...x,
   ma20:ma20arr[i],
   ma50:ma50arr[i],
   vwap:vwaparr[i]
 }));

 let score=num(find(d,"score","totalScore","overallScore"));

 if(score===null){
   score=50;
 }

 let judge=
   score>=75?"강한 긍정"
   :score>=60?"긍정"
   :score>=45?"중립"
   :score>=30?"주의"
   :"부정";

 let reasons=buildReasons(d);

 let news=find(d,"news");
 if(!Array.isArray(news))news=[];

 let sec=find(d,"sec","filings");
 if(!Array.isArray(sec))sec=[];

 let short=getObj(d,"short","finra");
 let dilution=getObj(d,"dilution");
 let warrants=getObj(d,"warrants","warrant");

 document.getElementById("app").innerHTML=`

 <div class="card">

   <div class="muted">${esc(symbol)} · RabbitStock</div>

   <div class="price">
     ${money(price)}
   </div>

   <div class="change ${change!==null&&change>=0?"up":"down"}">
     ${pct(change)}
   </div>

   <div class="grid" style="margin-top:13px">

    ${metric(
      "거래량",
      integer(find(q,"volume")),
      "현재 거래량"
    )}

    ${metric(
      "MA20",
      money(ma20),
      "최근 20거래일 평균"
    )}

    ${metric(
      "MA50",
      money(ma50),
      "최근 50거래일 평균"
    )}

    ${metric(
      "RSI",
      rsi===null?"데이터 없음":rsi.toFixed(1),
      "상승·하락 강도 0~100"
    )}

   </div>
 </div>


 <div class="card">
   <div class="muted">종합 판단</div>

   <div class="judge">${judge}</div>

   <div class="score">
     ${score.toFixed(0)}<span style="font-size:16px"> / 100</span>
   </div>

   <div style="margin-top:12px">

   ${reasons.map(x=>`
     <div class="reason">${esc(x)}</div>
   `).join("")}

   </div>
 </div>


 <div class="card chartbox">

   <div style="font-weight:800;margin-bottom:10px">
     📊 주가 캔들차트
   </div>

   <div class="small">
     실제 시가·고가·저가·종가 기준 · 캔들 터치하면 상세정보
   </div>

   <div class="chart" style="margin-top:10px">

     <canvas id="candleCanvas"></canvas>

     <div id="tooltip" class="tooltip"></div>

   </div>

   <div class="legend">
     <span style="color:#ff5964">상승</span>
     <span style="color:#4aa3ff">하락</span>
     <span>아래 = 거래량</span>
   </div>

 </div>


 <div class="card">

 <div class="grid">

 ${metric(
   "VWAP",
   money(vwap),
   "거래량 가중 평균가격"
 )}

 ${metric(
   "OBV",
   obv===null?"데이터 없음":integer(obv),
   "거래량 기반 수급 참고"
 )}

 </div>

 </div>


 <details>
 <summary>🔥 공매도 / Short Interest</summary>
 <div class="detail">
 ${renderObject(short)}
 </div>
 </details>


 <details>
 <summary>🚨 Threshold / Reg SHO</summary>
 <div class="detail">
 ${renderObject(
   getObj(d,"threshold","regsho")
 )}
 </div>
 </details>


 <details>
 <summary>💵 희석 / 실제 주식수</summary>
 <div class="detail">
 ${renderObject(dilution)}
 </div>
 </details>


 <details>
 <summary>🎫 워런트 / 전환</summary>
 <div class="detail">
 ${renderObject(warrants)}
 </div>
 </details>


 <details>
 <summary>📑 SEC 공시 · 최근 ${sec.length}건</summary>
 <div class="detail">

 ${
 sec.length
 ?sec.slice(0,60).map(x=>`
   <div class="reason">

   <b>${esc(
     x.form||x.title||"SEC Filing"
   )}</b><br>

   <span class="small">
   ${esc(x.date||x.filingDate||"날짜 없음")}
   </span><br>

   ${esc(
     x.description||
     x.summary||
     x.title||
     "공시 내용 확인 필요"
   )}

   ${
     x.url||x.link
     ?`<br><br>
       <a href="${esc(x.url||x.link)}"
       target="_blank"
       style="color:#6ea8ff">
       원문 읽기 ↗
       </a>`
     :""
   }

   </div>
 `).join("")
 :`<div class="small">SEC 공시 데이터 없음</div>`
 }

 </div>
 </details>


 <details>
 <summary>📰 뉴스 · 최근 ${news.length}건</summary>

 <div class="detail">

 ${
 news.length
 ?news.slice(0,30).map(x=>`

   <div class="reason">

   <b>
   ${esc(
     x.title||
     x.headline||
     "뉴스"
   )}
   </b>

   <br>

   <span class="small">
   ${esc(
     x.date||
     x.datetime||
     x.published||
     ""
   )}
   </span>

   <br><br>

   ${esc(
     x.summary||
     x.description||
     x.ai_summary||
     ""
   )}

   ${
     x.url||x.link
     ?`<br><br>
       <a href="${esc(x.url||x.link)}"
       target="_blank"
       style="color:#6ea8ff">
       원문 읽기 ↗
       </a>`
     :""
   }

   </div>

 `).join("")
 :`<div class="small">뉴스 데이터 없음</div>`
 }

 </div>
 </details>


 <details>
 <summary>📅 최근 ${Math.min(history.length,20)}거래일</summary>

 <div class="detail" style="overflow-x:auto">

 ${
 history.length
 ?`
 <table>

 <thead>
 <tr>
 <th>날짜</th>
 <th>시가</th>
 <th>고가</th>
 <th>저가</th>
 <th>종가</th>
 <th>거래량</th>
 <th>등락</th>
 </tr>
 </thead>

 <tbody>

 ${
 history.slice(-20).reverse().map((x,i,arr)=>{

   let prev=history[
     history.length-1-i-1
   ];

   let ch=prev&&prev.close
     ?(x.close/prev.close-1)*100
     :null;

   return `
   <tr>

   <td>${esc(fmtDate(x.date))}</td>
   <td>${money(x.open)}</td>
   <td>${money(x.high)}</td>
   <td>${money(x.low)}</td>
   <td><b>${money(x.close)}</b></td>
   <td>${integer(x.volume)}</td>

   <td class="${ch!==null&&ch>=0?"pos":"neg"}">
   ${pct(ch)}
   </td>

   </tr>
   `

 }).join("")
 }

 </tbody>
 </table>
 `
 :`<div class="small">주가 데이터 없음</div>`
 }

 </div>
 </details>

 `;

 setTimeout(()=>{

   if(history.length)
     createChart(history);

 },50);
}

function renderObject(obj){

 if(!obj || !Object.keys(obj).length)
   return `<div class="small">데이터 없음</div>`;

 return Object.entries(obj)
 .filter(([k,v])=>
   typeof v!=="object" &&
   v!==null &&
   v!==undefined &&
   v!==""
 )
 .map(([k,v])=>`

 <div class="reason">

   <span class="muted">
   ${esc(k)}
   </span>

   <br>

   <b>
   ${esc(
     typeof v==="number"
     ?v.toLocaleString()
     :v
   )}
   </b>

 </div>

 `).join("");
}

window.addEventListener("resize",()=>{
 if(history.length)
   setTimeout(()=>createChart(history),100);
});

load();
</script>

</body>
</html>
