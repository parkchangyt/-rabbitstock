<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐰 RabbitStock</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#0b0f14;
  color:#f4f7fa;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
.container{
  width:100%;

  padding:16px;

.header{

.logo{

.search{

}
button{

  border-radius:12px;

}
.card{
  background:#111720;

  padding:16px;

}
.title{

.symbol{

.price{

.change{

}

}

}

  border:1px solid #65232d;
  color:#ff9aaa;

}
.small{
  color:#7f8a96;
  font-size:11px;
  line-height:1.5;
}
.news{
  padding:10px 0;
  border-bottom:1px solid #202832;
}
.news:last-child{border-bottom:0}

  color:#e9eef3;

  display:inline-block;

  padding:5px 8px;

canvas{
  width:100%;
  height:220px;
  display:block;
  background:#0d131a;
  border-radius:12px;
}
.footer{
  text-align:center;
  color:#66717d;
  font-size:11px;
  padding:15px 0 30px;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">🐰 RABBITSTOCK</div>
    <div class="sub">주가 · 공매도 · 희석 · SEC · 뉴스 종합분석</div>
  </div>

  <div class="search">
    <input id="symbol" value="BRNX" placeholder="티커 입력">
    <button onclick="analyze()">조회</button>
  </div>

  <div id="app">
    <div class="loading">데이터를 불러오는 중...</div>
  </div>

  <div class="footer">
    RabbitStock · 실제 확인 가능한 데이터만 표시 · 투자 참고용
  </div>

</div>

<script>

const API="https://rabbitstock-final.keoss.workers.dev";

const $=id=>document.getElementById(id);

function esc(v){
  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

function num(v,d=2){
  if(v===null || v===undefined || v==="" || Number.isNaN(Number(v)))
    return "N/A";
  return Number(v).toLocaleString("en-US",{
    maximumFractionDigits:d
  });
}

function pct(v){
  if(v===null || v===undefined || Number.isNaN(Number(v)))
    return "N/A";
  return Number(v).toFixed(2)+"%";
}

async function get(path){
  const r=await fetch(API+path+"&_="+Date.now(),{
    cache:"no-store"
  });
  if(!r.ok) throw new Error("HTTP "+r.status);
  return await r.json();
}

/* -----------------------------
   데이터
----------------------------- */

async function loadAll(symbol){

  const results=await Promise.allSettled([
    get("/quote?symbol="+encodeURIComponent(symbol)),
    get("/sec?symbol="+encodeURIComponent(symbol)),
    get("/news?symbol="+encodeURIComponent(symbol))
  ]);

  const quote=
    results[0].status==="fulfilled"
      ? results[0].value
      : {ok:false};

  const sec=
    results[1].status==="fulfilled"
      ? results[1].value
      : {ok:false};

  const news=
    results[2].status==="fulfilled"
      ? results[2].value
      : {ok:false};

  return {quote,sec,news};
}

/* -----------------------------
   기술 점수
----------------------------- */

function momentumScore(q){

  const p=Number(q.percentChange);

  if(Number.isNaN(p)) return null;

  if(p>=10) return 95;
  if(p>=5) return 85;
  if(p>=2) return 75;
  if(p>0) return 62;

  if(p<=-10) return 10;
  if(p<=-5) return 20;
  if(p<=-2) return 35;

  return 45;
}

function volumeScore(q){

  const v=Number(q.volume);

  if(!v) return null;

  if(v>=10000000) return 90;
  if(v>=5000000) return 80;
  if(v>=1000000) return 70;
  if(v>=500000) return 60;

  return 50;
}

function dilutionRisk(sec){

  if(!sec || !sec.ok) return null;

  if(sec.riskScore!==undefined)
    return Number(sec.riskScore);

  let r=0;

  if(sec.offering) r+=25;
  if(sec.dilution) r+=25;
  if(sec.warrant) r+=20;
  if(sec.atm) r+=20;
  if(sec.convertible) r+=20;

  return Math.min(r,100);
}

function finalScore(q,sec){

  const m=momentumScore(q);
  const v=volumeScore(q);
  const d=dilutionRisk(sec);

  const values=[];
  const weights=[];

  if(m!==null){
    values.push(m);
    weights.push(0.45);
  }

  if(v!==null){
    values.push(v);
    weights.push(0.20);
  }

  if(d!==null){
    values.push(100-d);
    weights.push(0.35);
  }

  if(!values.length) return null;

  let total=0;
  let weight=0;

  for(let i=0;i<values.length;i++){
    total+=values[i]*weights[i];
    weight+=weights[i];
  }

  return Math.round(total/weight);
}

function verdict(s){

  if(s===null) return ["N/A","na"];

  if(s>=75) return ["강한 상승 우세","good"];
  if(s>=60) return ["상승 우세","good"];
  if(s>=40) return ["중립","warn"];
  if(s>=25) return ["하락 주의","warn"];

  return ["하락 위험","bad"];
}

/* -----------------------------
   차트
----------------------------- */

function drawChart(q){

  const canvas=document.getElementById("chart");

  if(!canvas) return;

  const ctx=canvas.getContext("2d");

  const w=canvas.width=canvas.clientWidth*2;
  const h=canvas.height=canvas.clientHeight*2;

  ctx.clearRect(0,0,w,h);

  const price=Number(q.price);
  const high=Number(q.high);
  const low=Number(q.low);

  if(!Number.isFinite(price) ||
     !Number.isFinite(high) ||
     !Number.isFinite(low)){

    ctx.fillStyle="#718096";
    ctx.font="28px sans-serif";
    ctx.fillText("차트 데이터 없음",30,70);
    return;
  }

  const max=Math.max(high,price);
  const min=Math.min(low,price);

  const pad=25;

  const y=v=>{
    if(max===min) return h/2;
    return pad+(max-v)/(max-min)*(h-pad*2);
  };

  ctx.strokeStyle="#26313d";
  ctx.lineWidth=2;

  for(let i=0;i<5;i++){
    const yy=pad+i*(h-pad*2)/4;
    ctx.beginPath();
    ctx.moveTo(0,yy);
    ctx.lineTo(w,yy);
    ctx.stroke();
  }

  ctx.beginPath();
  ctx.moveTo(0,y(price));
  ctx.lineTo(w,y(price));

  ctx.strokeStyle=
    Number(q.percentChange)>=0
      ? "#22c55e"
      : "#fb7185";

  ctx.lineWidth=6;
  ctx.stroke();
}

/* -----------------------------
   뉴스
----------------------------- */

function newsHTML(news){

  if(!news || !news.news || !news.news.length){

    return `
      <div class="na">
        현재 확인 가능한 뉴스가 없습니다.
      </div>
      <div class="small">
        뉴스 공급원에서 데이터를 반환하지 않은 상태입니다.
        뉴스가 없다는 의미와는 다릅니다.
      </div>
    `;
  }

  return news.news.slice(0,10).map(n=>{

    const title=esc(n.headline || n.title || "제목 없음");
    const url=n.url || "#";
    const date=n.datetime
      ? new Date(
          Number(n.datetime)>10000000000
          ? Number(n.datetime)
          : Number(n.datetime)*1000
        ).toLocaleString("ko-KR")
      : "";

    return `
      <div class="news">
        <a href="${esc(url)}" target="_blank">
          ${title}
        </a>
        <div class="small">${esc(date)}</div>
      </div>
    `;

  }).join("");
}

/* -----------------------------
   SEC
----------------------------- */

function secHTML(sec){

  if(!sec || !sec.ok){

    return `
      <div class="na">
        SEC 데이터를 가져오지 못했습니다.
      </div>
    `;
  }

  const tags=[];

  if(sec.offering)
    tags.push(`<span class="tag bad">증권등록</span>`);

  if(sec.dilution)
    tags.push(`<span class="tag bad">희석</span>`);

  if(sec.warrant)
    tags.push(`<span class="tag warn">워런트</span>`);

  if(sec.atm)
    tags.push(`<span class="tag warn">ATM</span>`);

  if(sec.convertible)
    tags.push(`<span class="tag warn">전환증권</span>`);

  if(!tags.length)
    tags.push(`<span class="tag good">주요 희석 신호 없음</span>`);

  return `
    <div style="margin-bottom:10px">
      ${tags.join("")}
    </div>

    <div class="row">
      <span>희석 위험도</span>
      <strong>${sec.riskScore!==undefined ? esc(sec.riskScore)+"/100":"N/A"}</strong>
    </div>

    <div class="row">
      <span>최근 공시</span>
      <strong>${sec.filings ? sec.filings.length : "N/A"}건</strong>
    </div>

    <div class="small">
      SEC 공시를 기준으로 희석 가능성을 판단합니다.
    </div>
  `;
}

/* -----------------------------
   분석
----------------------------- */

function analysisText(q,sec,score){

  const p=Number(q.percentChange);
  const d=dilutionRisk(sec);

  const lines=[];

  if(Number.isFinite(p)){

    if(p>=5)
      lines.push("현재 주가 모멘텀이 강하게 상승하고 있습니다.");

    else if(p>0)
      lines.push("현재 주가는 상승 흐름을 보이고 있습니다.");

    else if(p<=-5)
      lines.push("현재 주가가 크게 하락해 단기 매도 압력이 강한 상태입니다.");

    else
      lines.push("현재 주가 흐름은 약세 또는 보합권입니다.");
  }

  if(Number.isFinite(Number(q.volume)) &&
     Number(q.volume)>=1000000){

    lines.push(
      "거래량이 100만주 이상으로 단기 수급 변화를 확인할 필요가 있습니다."
    );
  }

  if(d!==null){

    if(d>=70)
      lines.push(
        "SEC 기준 희석 관련 위험이 높아 신규 주식 발행 여부를 주의해야 합니다."
      );

    else if(d>=30)
      lines.push(
        "SEC 공시에서 일부 희석 가능성이 확인되어 추가 발행 여부를 확인해야 합니다."
      );

    else
      lines.push(
        "현재 확인된 SEC 자료 기준 희석 위험은 상대적으로 낮습니다."
      );
  }

  if(score!==null){

    if(score>=75)
      lines.push(
        "현재 확인 가능한 데이터를 종합하면 단기 상승 쪽으로 기울어 있습니다."
      );

    else if(score>=60)
      lines.push(
        "상승 요인이 존재하지만 위험 요인도 함께 확인해야 합니다."
      );

    else if(score>=40)
      lines.push(
        "상승과 하락 요인이 혼재해 방향성이 명확하지 않습니다."
      );

    else
      lines.push(
        "현재 데이터에서는 하락 위험이 상승 요인보다 크게 나타납니다."
      );
  }

  return lines.join("<br><br>");
}

/* -----------------------------
   메인
----------------------------- */

async function analyze(){

  const symbol=$("symbol").value.trim().toUpperCase();

  if(!symbol){
    $("app").innerHTML=
      `<div class="error">티커를 입력해주세요.</div>`;
    return;
  }

  $("app").innerHTML=
    `<div class="loading">🐰 ${esc(symbol)} 분석 중...</div>`;

  try{

    const {quote,sec,news}=await loadAll(symbol);

    if(!quote.ok){

      throw new Error(
        quote.error || "주가 데이터를 가져오지 못했습니다."
      );
    }

    const score=finalScore(quote,sec);

    const [verdictText,verdictClass]=verdict(score);

    const m=momentumScore(quote);
    const v=volumeScore(quote);
    const d=dilutionRisk(sec);

    const price=quote.price;

    $("app").innerHTML=`

      <!-- 주가 -->
      <div class="card">

        <div class="title">
          📈 실시간 주가
        </div>

        <div class="symbol">
          ${esc(quote.symbol)} · ${esc(quote.name || "")}
        </div>

        <div class="price">
          $${num(price)}
        </div>

        <div class="change ${Number(quote.percentChange)>=0?"good":"bad"}">
          ${num(quote.change)} (${pct(quote.percentChange)})
        </div>

        <div style="margin-top:15px">
          <canvas id="chart"></canvas>
        </div>

      </div>


      <!-- 시장 데이터 -->
      <div class="card">

        <div class="title">📊 시장 데이터</div>

        <div class="grid">

          <div class="item">
            <div class="label">시가</div>
            <div class="value">$${num(quote.open)}</div>
          </div>

          <div class="item">
            <div class="label">전일 종가</div>
            <div class="value">$${num(quote.previousClose)}</div>
          </div>

          <div class="item">
            <div class="label">고가</div>
            <div class="value">$${num(quote.high)}</div>
          </div>

          <div class="item">
            <div class="label">저가</div>
            <div class="value">$${num(quote.low)}</div>
          </div>

          <div class="item">
            <div class="label">거래량</div>
            <div class="value">${num(quote.volume,0)}</div>
          </div>

          <div class="item">
            <div class="label">데이터 출처</div>
            <div class="value">${esc(quote.source || "N/A")}</div>
          </div>

        </div>

      </div>


      <!-- 종합점수 -->
      <div class="card">

        <div class="title">🚀 RABBIT SCORE</div>

        <div class="scorebox">

          <div class="score">
            ${score===null?"N/A":score}
          </div>

          <div class="verdict ${verdictClass}">
            ${verdictText}
          </div>

          <div class="bar">
            <div
              class="barin"
              style="width:${score===null?0:score}%">
            </div>
          </div>

        </div>

      </div>


      <!-- 세부 점수 -->
      <div class="card">

        <div class="title">🎯 세부 분석 점수</div>

        <div class="row">
          <span>가격 모멘텀</span>
          <strong>${m===null?"N/A":m+"/100"}</strong>
        </div>

        <div class="row">
          <span>거래량/수급</span>
          <strong>${v===null?"N/A":v+"/100"}</strong>
        </div>

        <div class="row">
          <span>희석 위험</span>
          <strong>${d===null?"N/A":d+"/100"}</strong>
        </div>

        <div class="small">
          실제 데이터가 없는 공매도·내부자·다크풀 항목은
          임의 점수를 넣지 않습니다.
        </div>

      </div>


      <!-- 공매도 -->
      <div class="card">

        <div class="title">🐻 공매도 분석</div>

        <div class="row">
          <span>Short Interest</span>
          <strong class="na">N/A</strong>
        </div>

        <div class="row">
          <span>Short % of Float</span>
          <strong class="na">N/A</strong>
        </div>

        <div class="row">
          <span>Days to Cover</span>
          <strong class="na">N/A</strong>
        </div>

        <div class="row">
          <span>Borrow Fee</span>
          <strong class="na">N/A</strong>
        </div>

        <div class="row">
          <span>Short Sale Volume</span>
          <strong class="na">N/A</strong>
        </div>

        <div class="badge na">
          실제 공매도 공급원 미연결
        </div>

        <div class="small" style="margin-top:10px">
          확인되지 않은 공매도 수치를 임의로 표시하지 않습니다.
        </div>

      </div>


      <!-- 숏스퀴즈 -->
      <div class="card">

        <div class="title">💥 숏스퀴즈 분석</div>

        <div class="row">
          <span>스퀴즈 점수</span>
          <strong class="na">N/A</strong>
        </div>

        <div class="row">
          <span>공매도 잔고</span>
          <strong class="na">N/A</strong>
        </div>

        <div class="row">
          <span>대차수수료</span>
          <strong class="na">N/A</strong>
        </div>

        <div class="row">
          <span>FTD</span>
          <strong class="na">N/A</strong>
        </div>

        <div class="small">
          실제 공매도 데이터가 연결되면 자동 계산하도록 설계됩니다.
        </div>

      </div>


      <!-- 희석 -->
      <div class="card">

        <div class="title">🧾 희석 · 증자 분석</div>

        ${secHTML(sec)}

      </div>


      <!-- SEC -->
      <div class="card">

        <div class="title">📑 SEC 공시</div>

        ${
          sec && sec.filings && sec.filings.length
          ? sec.filings.slice(0,8).map(f=>`

            <div class="row">

              <span>
                ${esc(f.form || "")}
                <br>
                <span class="small">
                  ${esc(f.filingDate || "")}
                </span>
              </span>

              ${
                f.url
                ? `<a href="${esc(f.url)}"
                     target="_blank"
                     class="badge">
                     SEC 보기
                   </a>`
                : `<span class="badge">확인</span>`
              }

            </div>

          `).join("")
          : `<div class="na">SEC 공시 정보 없음</div>`
        }

      </div>


      <!-- 내부자 -->
      <div class="card">

        <div class="title">🏦 내부자 거래</div>

        <div class="row">
          <span>내부자 매수</span>
          <strong class="na">N/A</strong>
        </div>

        <div class="row">
          <span>내부자 매도</span>
          <strong class="na">N/A</strong>
        </div>

        <div class="badge na">
          내부자 데이터 미연결
        </div>

      </div>


      <!-- 수급 -->
      <div class="card">

        <div class="title">💰 수급 분석</div>

        <div class="row">
          <span>거래량</span>
          <strong>${num(quote.volume,0)}</strong>
        </div>

        <div class="row">
          <span>가격 변화</span>
          <strong>${pct(quote.percentChange)}</strong>
        </div>

        <div class="row">
          <span>거래량 신호</span>
          <strong>
            ${
              v===null
              ?"N/A"
              :v>=70
                ?"활발"
                :v>=55
                  ?"보통"
                  :"낮음"
            }
          </strong>
        </div>

      </div>


      <!-- 뉴스 -->
      <div class="card">

        <div class="title">📰 뉴스</div>

        ${newsHTML(news)}

      </div>


      <!-- 위험 -->
      <div class="card">

        <div class="title">🚨 위험요소</div>

        ${
          d!==null && d>=50
          ? `<div class="row">
               <span>희석 위험</span>
               <strong class="bad">주의</strong>
             </div>`
          : `<div class="row">
               <span>희석 위험</span>
               <strong class="good">낮음/보통</strong>
             </div>`
        }

        ${
          Number(quote.percentChange)<=-5
          ? `<div class="row">
               <span>급락 위험</span>
               <strong class="bad">높음</strong>
             </div>`
          : `<div class="row">
               <span>급락 위험</span>
               <strong class="na">특이사항 없음</strong>
             </div>`
        }

        <div class="row">
          <span>공매도 데이터</span>
          <strong class="na">N/A</strong>
        </div>

      </div>


      <!-- 시나리오 -->
      <div class="card">

        <div class="title">🎯 시나리오 분석</div>

        <div class="row">
          <span>🟢 상승 시나리오</span>
          <strong>
            ${
              Number(quote.percentChange)>0
              ? "현재 모멘텀 유지"
              : "거래량 증가 필요"
            }
          </strong>
        </div>

        <div class="analysis">
          상승 시에는 거래량 증가와 가격 회복이 동시에 나타나는지 확인해야 합니다.
          공매도 데이터가 추가되면 숏커버 가능성도 함께 판단합니다.
        </div>

        <br>

        <div class="row">
          <span>🟡 중립 시나리오</span>
          <strong>횡보 가능성</strong>
        </div>

        <div class="analysis">
          거래량이 감소하고 새로운 재료가 없다면 현재 가격대에서 방향성을 탐색할 수 있습니다.
        </div>

        <br>

        <div class="row">
          <span>🔴 하락 시나리오</span>
          <strong>주의</strong>
        </div>

        <div class="analysis">
          저가 이탈과 거래량 증가가 동시에 나타나면 추가 하락 압력을 주의해야 합니다.
        </div>

      </div>


      <!-- 최종 분석 -->
      <div class="card">

        <div class="title">🐰 최종 AI 분석</div>

        <div class="analysis">
          ${analysisText(quote,sec,score)}
        </div>

        <div style="margin-top:15px">

          <div class="badge ${verdictClass}">
            최종판정: ${verdictText}
          </div>

        </div>

      </div>

    `;

    drawChart(quote);

  }catch(e){

    $("app").innerHTML=`
      <div class="error">
        ❌ 데이터 조회 실패<br><br>
        ${esc(e.message)}
      </div>
    `;
  }
}


/* 엔터키 */

$("symbol").addEventListener("keydown",e=>{
  if(e.key==="Enter") analyze();
});


/* 시작 */

analyze();

</script>

</body>
</html>
