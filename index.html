<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RabbitStock Ultimate 10.0</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#070b13;
 color:#edf2f7;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.wrap{
 max-width:760px;
 margin:auto;
 padding:14px;
}

.top{
 padding:10px 2px 8px;
}

.brand{
 font-size:24px;
 font-weight:900;
}

.sub{
 color:#7f8ba0;
 font-size:12px;
 margin-top:4px;
}

.search{
 display:flex;
 gap:8px;
 margin:12px 0;
}

.search input{
 flex:1;
 min-width:0;
 background:#111827;
 border:1px solid #273246;
 color:#fff;
 border-radius:13px;
 padding:14px;
 font-size:17px;
 font-weight:800;
 text-transform:uppercase;
 outline:none;
}

.search button{
 border:0;
 border-radius:13px;
 padding:0 18px;
 background:#f2f5f8;
 color:#07101c;
 font-weight:900;
 font-size:15px;
}

.card{
 background:linear-gradient(145deg,#111827,#0b111c);
 border:1px solid #1d293b;
 border-radius:20px;
 padding:17px;
 margin:10px 0;
 box-shadow:0 8px 28px #0005;
}

.hero{
 display:grid;
 grid-template-columns:1fr auto;
 gap:10px;
}

.ticker{
 font-size:27px;
 font-weight:900;
}

.name{
 margin-top:3px;
 font-size:13px;
 color:#9aa7b9;
}

.price{
 font-size:34px;
 font-weight:900;
 text-align:right;
 white-space:nowrap;
}

.change{
 text-align:right;
 font-weight:800;
 margin-top:3px;
}

.up{color:#4ade80}
.down{color:#fb7185}

.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:9px;
 margin-top:13px;
}

.mini{
 background:#0a101b;
 border:1px solid #1b2638;
 border-radius:13px;
 padding:11px;
}

.mini span{
 display:block;
 color:#8290a5;
 font-size:11px;
 margin-bottom:4px;
}

.mini b{
 display:block;
 font-size:15px;
}

.title{
 font-weight:900;
 font-size:16px;
 margin-bottom:12px;
}

.score{
 font-size:54px;
 font-weight:950;
 line-height:1;
}

.score small{
 font-size:17px;
 color:#8290a5;
 margin-left:4px;
}

.grade{
 font-size:18px;
 font-weight:900;
 margin-top:6px;
}

.bar{
 height:9px;
 background:#202b3c;
 border-radius:99px;
 overflow:hidden;
 margin-top:7px;
}

.bar i{
 display:block;
 height:100%;
 border-radius:99px;
 background:#63e6be;
}

.reason{
 color:#b6c1d0;
 font-size:13px;
 margin:5px 0;
}

.chartbox{
 height:300px;
 position:relative;
}

.chartbox svg{
 width:100%;
 height:100%;
 overflow:visible;
}

.axis{
 fill:#6f7c91;
 font-size:10px;
}

.gridline{
 stroke:#1b2636;
 stroke-width:1;
}

.line{
 fill:none;
 stroke:#63e6be;
 stroke-width:2.5;
}

.area{
 fill:#63e6be;
 opacity:.08;
}

.dot{
 fill:#63e6be;
}

.chart-price{
 fill:#dce7f3;
 font-size:11px;
}

.tip{
 font-size:11px;
 color:#8290a5;
 margin-top:4px;
}

details{
 margin:8px 0;
 background:#0d1420;
 border:1px solid #1c2839;
 border-radius:15px;
 padding:13px;
}

summary{
 font-weight:900;
 cursor:pointer;
 list-style:none;
}

summary::-webkit-details-marker{
 display:none;
}

summary:after{
 content:"＋";
 float:right;
 color:#718096;
}

details[open] summary:after{
 content:"－";
}

.rows{
 max-height:380px;
 overflow:auto;
 margin-top:10px;
}

.row{
 display:grid;
 grid-template-columns:78px 1fr 75px;
 gap:7px;
 padding:10px 0;
 border-bottom:1px solid #182334;
 font-size:12px;
 line-height:1.4;
}

.row:last-child{
 border-bottom:0;
}

.tag{
 display:inline-block;
 border:1px solid #2b3a51;
 border-radius:7px;
 padding:2px 5px;
 margin-right:3px;
 font-size:10px;
 color:#b8c3d1;
}

.muted{
 color:#8290a5;
}

.warn{
 color:#fbbf24;
}

.good{
 color:#4ade80;
}

.bad{
 color:#fb7185;
}

.loading{
 text-align:center;
 color:#8290a5;
 padding:28px;
}

.source{
 margin-top:12px;
 padding-top:10px;
 border-top:1px solid #1b2636;
 color:#657389;
 font-size:10px;
}

a{
 color:#9dd8ff;
 text-decoration:none;
}

@media(max-width:430px){

 .wrap{
  padding:10px;
 }

 .price{
  font-size:28px;
 }

 .chartbox{
  height:260px;
 }

 .row{
  grid-template-columns:68px 1fr 68px;
 }

}
</style>
</head>

<body>

<main class="wrap">

<header class="top">

 <div class="brand">
  🐇 RabbitStock Ultimate
 </div>

 <div class="sub">
  10.0 · 티커 자동분석 · 공식 데이터 우선
 </div>

</header>


<div class="search">

 <input
  id="sym"
  value="BRNX"
  autocomplete="off"
  autocapitalize="characters"
  spellcheck="false"
 >

 <button onclick="loadStock()">
  분석
 </button>

</div>


<div id="app">

 <div class="loading">
  🐇 BRNX 데이터 불러오는 중…
 </div>

</div>

</main>


<script>

const API =
 "https://rabbitstock-final.keoss.workers.dev";


const $ =
 id => document.getElementById(id);


function esc(v){

 return String(v ?? "")
  .replace(/[&<>"']/g,m=>({

   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#39;"

  }[m]));

}


function money(v,c="USD"){

 if(v==null)
  return "데이터 없음";

 const x =
  Number(v).toLocaleString(
   undefined,
   {
    maximumFractionDigits:4
   }
  );

 return c==="USD"
  ? "$"+x
  : x+" "+c;

}


function number(v){

 if(v==null)
  return "데이터 없음";

 return Number(v)
  .toLocaleString(
   undefined,
   {
    maximumFractionDigits:2
   }
  );

}


function percent(v){

 if(v==null)
  return "데이터 없음";

 return (
  v>0?"+":""
 )+
 Number(v).toFixed(2)+
 "%";

}


/* =========================
   DATE
========================= */

function shortDate(v){

 if(!v)
  return "-";

 return String(v)
  .slice(5,10)
  .replace("-","/");

}


/* =========================
   CHART
========================= */

function makeChart(rows){

 const a =
  (rows||[])
   .filter(
    x =>
     x.close!=null &&
     x.datetime
   )
   .slice(-90);


 if(!a.length){

  return `
   <div class="loading">
    차트 데이터 없음
   </div>
  `;

 }


 const W = 700;
 const H = 250;

 const L = 38;
 const R = 12;
 const T = 15;
 const B = 30;

 const values =
  a.map(x=>Number(x.close));

 const min =
  Math.min(...values);

 const max =
  Math.max(...values);

 const range =
  max-min || 1;


 function X(i){

  return L+
   i*
   (W-L-R)/
   Math.max(
    1,
    a.length-1
   );

 }


 function Y(v){

  return H-B-
   (
    (v-min)/range
   )*
   (H-T-B);

 }


 const points =
  a.map(
   (x,i)=>
    [X(i),Y(x.close)]
  );


 const line =
  points
   .map(
    (p,i)=>
     (i?"L":"M")+
     p[0].toFixed(2)+
     " "+
     p[1].toFixed(2)
   )
   .join(" ");


 const area =
  line+
  ` L ${X(a.length-1)}
       ${H-B}
    L ${X(0)}
       ${H-B} Z`;


 const y1=Y(max);
 const y2=Y((max+min)/2);
 const y3=Y(min);


 const indexes=[
  0,
  Math.floor((a.length-1)/2),
  a.length-1
 ];


 const labels =
  indexes.map(i=>`

   <text
    class="axis"
    x="${X(i)}"
    y="${H-8}"
    text-anchor="middle"
   >
    ${esc(shortDate(a[i].datetime))}
   </text>

  `).join("");


 const last =
  a[a.length-1];


 return `

 <svg
  viewBox="0 0 ${W} ${H}"
  preserveAspectRatio="none"
 >

  <line
   class="gridline"
   x1="${L}"
   y1="${y1}"
   x2="${W-R}"
   y2="${y1}"
  />

  <line
   class="gridline"
   x1="${L}"
   y1="${y2}"
   x2="${W-R}"
   y2="${y2}"
  />

  <line
   class="gridline"
   x1="${L}"
   y1="${y3}"
   x2="${W-R}"
   y2="${y3}"
  />

  <text
   class="chart-price"
   x="2"
   y="${y1+4}"
  >
   ${money(max)}
  </text>

  <text
   class="chart-price"
   x="2"
   y="${y2+4}"
  >
   ${money((max+min)/2)}
  </text>

  <text
   class="chart-price"
   x="2"
   y="${y3+4}"
  >
   ${money(min)}
  </text>

  <path
   class="area"
   d="${area}"
  />

  <path
   class="line"
   d="${line}"
  />

  <circle
   class="dot"
   cx="${X(a.length-1)}"
   cy="${Y(last.close)}"
   r="4"
  />

  ${labels}

 </svg>

 <div class="tip">
  최근 ${a.length}거래일 ·
  ${esc(last.datetime)} ·
  종가 ${money(last.close)}
 </div>
 `;

}


/* =========================
   FILINGS
========================= */

function filingRows(list){

 if(!list?.length){

  return `
   <div class="muted">
    최근 공시 없음
   </div>
  `;

 }


 return `

 <div class="rows">

 ${
  list.map(x=>`

   <div class="row">

    <div>
     ${esc(
      x.filing_date ||
      "-"
     )}
    </div>

    <div>

     <span class="tag">
      ${esc(x.form)}
     </span>

     ${esc(
      x.description ||
      ""
     )}

    </div>

    <div>

     ${
      x.url
       ?`
        <a
         href="${esc(x.url)}"
         target="_blank"
         rel="noopener"
        >
         SEC
        </a>
       `
       :""
     }

    </div>

   </div>

  `).join("")
 }

 </div>

 `;

}


/* =========================
   NEWS
========================= */

function newsRows(list){

 if(!list?.length){

  return `
   <div class="muted">
    최근 뉴스 없음
   </div>
  `;

 }


 return `

 <div class="rows">

 ${
  list.map(x=>`

   <div class="row">

    <div>
     ${esc(
      x.datetime
       ? x.datetime.slice(0,10)
       : "-"
     )}
    </div>

    <div>

     <b>
      ${esc(
       x.headline
      )}
     </b>

     <br>

     <span class="muted">
      ${esc(
       x.source
      )}
     </span>

    </div>

    <div>

     ${
      x.url
       ?`
        <a
         href="${esc(x.url)}"
         target="_blank"
         rel="noopener"
        >
         원문
        </a>
       `
       :""
     }

    </div>

   </div>

  `).join("")
 }

 </div>

 `;

}


/* =========================
   PRICE TABLE
========================= */

function priceRows(rows){

 const a =
  (rows||[])
   .slice(-20)
   .reverse();


 if(!a.length){

  return `
   <div class="muted">
    주가 데이터 없음
   </div>
  `;

 }


 return `

 <div class="rows">

 ${
  a.map(x=>`

   <div class="row">

    <div>
     ${esc(
      x.datetime
       ?.slice(0,10) ||
      "-"
     )}
    </div>

    <div>

     시 ${money(x.open)}
     <br>

     고 ${money(x.high)}
     ·

     저 ${money(x.low)}

    </div>

    <div>

     종 ${money(x.close)}
     <br>

     거래 ${number(x.volume)}

    </div>

   </div>

  `).join("")
 }

 </div>

 `;

}


/* =========================
   LOAD
========================= */

async function loadStock(){

 const symbol =
  $("sym")
   .value
   .trim()
   .toUpperCase();


 if(!symbol)
  return;


 $("sym").value =
  symbol;


 $("app").innerHTML = `

  <div class="card">

   <div class="loading">
    🐇 ${esc(symbol)}
    데이터 수집 중…
   </div>

  </div>

 `;


 try{

  const response =
   await fetch(
    `${API}/all?symbol=${
     encodeURIComponent(symbol)
    }`
   );


  const data =
   await response.json();


  if(!data.ok)
   throw new Error(
    data.error ||
    "조회 실패"
   );


  render(data);


 }catch(e){

  $("app").innerHTML = `

   <div class="card">

    <div class="title">
     조회 실패
    </div>

    <p class="warn">
     ${esc(e.message)}
    </p>

    <p class="muted">
     티커를 확인하고
     다시 분석해주세요.
    </p>

   </div>

  `;

 }

}


/* =========================
   RENDER
========================= */

function render(d){

 const q =
  d.quote || {};

 const a =
  d.analysis || {};

 const f =
  d.final || {};

 const sec =
  d.sec || {};

 const si =
  d.short_interest || {};

 const sv =
  d.short_volume || {};

 const th =
  d.threshold || {};


 const price =
  q.price;


 const change =
  q.percent_change;


 const changeClass =
  change==null
   ? ""
   : change>=0
     ? "up"
     : "down";


 $("app").innerHTML = `

 <!-- HERO -->

 <section class="card hero">

  <div>

   <div class="ticker">
    ${esc(d.symbol)}
   </div>

   <div class="name">
    ${esc(q.name || "")}
    ${q.exchange
      ? " · "+esc(q.exchange)
      : ""}
   </div>

   <div class="muted"
        style="margin-top:8px">

    거래량
    ${number(q.volume)}

    ·

    52주
    ${money(q.week52_low)}
    ~
    ${money(q.week52_high)}

   </div>

  </div>


  <div>

   <div class="price">
    ${money(
     price,
     q.currency
    )}
   </div>

   <div class="change ${changeClass}">
    ${percent(change)}
   </div>

  </div>

 </section>


 <!-- FINAL -->

 <section class="card">

  <div class="title">
   🎯 종합 판단
  </div>

  <div class="score">
   ${number(f.score)}
   <small>/100</small>
  </div>

  <div class="grade">
   ${esc(
    f.grade ||
    "데이터 없음"
   )}
  </div>


  <div class="grid">

   <div class="mini">

    <span>
     매집 점수
    </span>

    <b>
     ${number(
      a.accumulation_score
     )}
    </b>

    <div class="bar">
     <i style="
      width:${
       a.accumulation_score ||
       0
      }%
     "></i>
    </div>

   </div>


   <div class="mini">

    <span>
     매도 점수
    </span>

    <b>
     ${number(
      a.sell_score
     )}
    </b>

    <div class="bar">
     <i style="
      width:${
       a.sell_score ||
       0
      }%
     "></i>
    </div>

   </div>

  </div>


  <div style="margin-top:12px">

   ${
    (f.reasons||[])
     .map(
      x=>`
       <div class="reason">
        • ${esc(x)}
       </div>
      `
     )
     .join("")
   }

  </div>

 </section>


 <!-- CHART -->

 <section class="card">

  <div class="title">
   📈 주가 차트 · 날짜
  </div>

  <div class="chartbox">

   ${makeChart(
    d.history
   )}

  </div>

 </section>


 <!-- TECHNICAL -->

 <section class="card">

  <div class="title">
   📊 핵심 지표
  </div>

  <div class="grid">


   <div class="mini">

    <span>
     MA20 · 최근 20일 평균
    </span>

    <b>
     ${money(a.ma20)}
    </b>

   </div>


   <div class="mini">

    <span>
     MA50 · 최근 50일 평균
    </span>

    <b>
     ${money(a.ma50)}
    </b>

   </div>


   <div class="mini">

    <span>
     RSI · 상승/하락 강도
    </span>

    <b>
     ${number(a.rsi)}
    </b>

   </div>


   <div class="mini">

    <span>
     VWAP · 거래량 가중 평균
    </span>

    <b>
     ${money(a.vwap)}
    </b>

   </div>


   <div class="mini">

    <span>
     거래량 / 20일 평균
    </span>

    <b>
     ${
      a.volume_ratio==null
       ? "데이터 없음"
       : a.volume_ratio
          .toFixed(2)
          +"배"
     }
    </b>

   </div>


   <div class="mini">

    <span>
     추세
    </span>

    <b>
     ${esc(
      a.trend ||
      "데이터 없음"
     )}
    </b>

   </div>


  </div>

 </section>


 <!-- SHORT -->

 <details>

  <summary>
   🔥 공매도 / Short Interest
  </summary>


  <div class="grid">


   <div class="mini">

    <span>
     Short Interest
    </span>

    <b>
     ${
      si.latest?.short_interest
       == null
       ? "데이터 없음"
       : number(
          si.latest.short_interest
         )
     }
    </b>

   </div>


   <div class="mini">

    <span>
     Days to Cover
    </span>

    <b>
     ${
      si.latest?.days_to_cover
       == null
       ? "데이터 없음"
       : number(
          si.latest.days_to_cover
         )
     }
    </b>

   </div>


   <div class="mini">

    <span>
     Short Sale Volume
    </span>

    <b>
     ${
      sv.short_ratio == null
       ? "데이터 없음"
       : sv.short_ratio
          .toFixed(2)
          +"%"
     }
    </b>

   </div>


   <div class="mini">

    <span>
     기준일
    </span>

    <b>
     ${esc(
      si.latest?.settlement_date ||
      sv.latest?.date ||
      "데이터 없음"
     )}
    </b>

   </div>

  </div>


  <p class="muted">

   Short Interest와
   Short Sale Volume은
   서로 다른 데이터입니다.

  </p>

 </details>


 <!-- THRESHOLD -->

 <details>

  <summary>
   🚨 Threshold
  </summary>

  <p class="${
   th.rows?.length
    ? "warn"
    : "good"
  }">

   ${esc(
    th.status ||
    "데이터 없음"
   )}

  </p>

  ${
   th.rows?.length
    ? `
     <div class="rows">
      ${
       th.rows
        .slice(-20)
        .map(
         x=>`
          <div class="reason">
           ${esc(
            JSON.stringify(x)
           )}
          </div>
         `
        )
        .join("")
      }
     </div>
    `
    : ""
  }

 </details>


 <!-- DILUTION -->

 <details>

  <summary>
   💵 희석 / 실제 주식수
  </summary>


  <p>

   ${esc(
    d.dilution?.status ||
    "데이터 없음"
   )}

  </p>


  ${filingRows(
   d.dilution?.filings ||
   []
  )}


  <div class="title"
       style="margin-top:15px">

   최근 보고 주식수

  </div>


  ${
   d.shares_outstanding
    ?.rows?.length

    ?

    d.shares_outstanding.rows
     .slice()
     .reverse()
     .map(
      x=>`
       <div class="reason">

        • ${esc(x.end)}

        · ${number(x.val)}주

        · ${esc(
         x.form || ""
        )}

       </div>
      `
     )
     .join("")

    :

    `<div class="muted">
      데이터 없음
     </div>`
  }

 </details>


 <!-- WARRANT -->

 <details>

  <summary>
   🎫 워런트 / 전환
  </summary>


  <p>

   ${esc(
    d.warrants?.status ||
    "데이터 없음"
   )}

  </p>


  ${filingRows(
   d.warrants?.filings ||
   []
  )}

 </details>


 <!-- SEC -->

 <details>

  <summary>
