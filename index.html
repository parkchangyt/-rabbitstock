<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>RabbitStock Ultimate</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#09101e;
 color:#eef3ff;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
.wrap{
 max-width:900px;
 margin:auto;
 padding:14px
}
h1{
 margin:5px 0;
 font-size:25px
}
.sub{
 color:#8290a8;
 font-size:12px;
 margin-bottom:16px
}
.search{
 display:flex;
 gap:8px;
 margin-bottom:10px
}
input{
 flex:1;
 min-width:0;
 padding:14px;
 border-radius:12px;
 border:1px solid #293750;
 background:#111b2e;
 color:white;
 font-size:17px;
 outline:none
}
button{
 border:0;
 border-radius:12px;
 background:#2d7cff;
 color:white;
 font-weight:800;
 padding:0 17px;
 font-size:15px
}
.status{
 display:none;
 padding:11px;
 margin:10px 0;
 border:1px solid #293750;
 border-radius:10px;
 background:#101a2b;
 color:#b9c7dd;
 font-size:13px
}
.card{
 background:#101827;
 border:1px solid #202d43;
 border-radius:16px;
 padding:15px;
 margin:12px 0
}
.title{
 font-size:16px;
 font-weight:800;
 margin-bottom:12px
}
.price{
 font-size:32px;
 font-weight:900
}
.green{color:#35d48b}
.red{color:#ff6577}
.yellow{color:#ffd166}
.gray{color:#8491a7}
.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:8px
}
.metric{
 background:#0b1322;
 border-radius:11px;
 padding:10px
}
.label{
 color:#8290a8;
 font-size:11px;
 margin-bottom:5px
}
.value{
 font-size:15px;
 font-weight:800
}
.tabs{
 display:flex;
 gap:6px;
 margin-bottom:9px
}
.tabs button{
 flex:1;
 padding:8px 3px;
 background:#19253a;
 color:#aab8ce
}
.tabs button.active{
 background:#2d7cff;
 color:#fff
}
canvas{
 width:100%;
 height:230px;
 display:block;
 background:#0a1220;
 border-radius:12px
}
.bar{
 height:9px;
 background:#202d40;
 border-radius:20px;
 overflow:hidden;
 margin-top:9px
}
.bar span{
 display:block;
 height:100%
}
.score{
 text-align:center;
 font-size:44px;
 font-weight:900
}
.badge{
 display:inline-block;
 padding:5px 10px;
 border-radius:20px;
 background:#1b2940;
 font-size:12px
}
.big{
 font-size:18px;
 font-weight:800;
 line-height:1.5
}
.row{
 display:flex;
 justify-content:space-between;
 gap:10px;
 padding:9px 0;
 border-bottom:1px solid #1c283b;
 font-size:13px
}
.row:last-child{border-bottom:0}
.small{
 font-size:11px;
 color:#718098
}
.empty{
 color:#718098;
 font-size:13px
}
a{
 color:#68a4ff;
 text-decoration:none
}
ul{
 margin:8px 0;
 padding-left:19px
}
li{
 margin:6px 0;
 color:#c3cede;
 font-size:13px
}
@media(max-width:520px){
 .wrap{padding:11px}
 .price{font-size:29px}
}
</style>
</head>

<body>

<div class="wrap">

<h1>🐇 RabbitStock Ultimate</h1>
<div class="sub">
주가 · 기술지표 · 공매도 · Reg SHO · 희석 · 워런트 · SEC · 뉴스
</div>

<div class="search">
<input
 id="symbol"
 type="text"
 placeholder="티커 입력 예: BRNX"
 autocomplete="off"
 autocapitalize="characters"
>
<button id="analyzeBtn">분석</button>
</div>

<div id="status" class="status"></div>

<div id="app">

<div class="card">
<div class="title">💰 주가</div>
<div class="empty">티커를 입력하세요.</div>
</div>

</div>

</div>

<script>

const API =
"https://rabbitstock-final.keoss.workers.dev";

let DATA = null;
let chartRange = "1D";

function $(id){
 return document.getElementById(id);
}

function esc(v){
 return String(v ?? "")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");
}

function n(v,d=2){
 if(v===null || v===undefined || v==="" ||
    !Number.isFinite(Number(v))) return "-";

 return Number(v).toLocaleString("en-US",{
   minimumFractionDigits:d,
   maximumFractionDigits:d
 });
}

function i(v){
 if(v===null || v===undefined || v==="" ||
    !Number.isFinite(Number(v))) return "-";

 return Number(v).toLocaleString("en-US",{
   maximumFractionDigits:0
 });
}

function p(v,d=2){
 if(v===null || v===undefined || v==="" ||
    !Number.isFinite(Number(v))) return "-";

 return Number(v).toFixed(d)+"%";
}

function usd(v){
 if(v===null || v===undefined || v==="" ||
    !Number.isFinite(Number(v))) return "-";

 return "$"+Number(v).toLocaleString("en-US",{
   minimumFractionDigits:2,
   maximumFractionDigits:4
 });
}

function sign(v,d=2){
 if(v===null || v===undefined || v==="" ||
    !Number.isFinite(Number(v))) return "-";

 const x=Number(v);

 return (x>=0?"+":"")+x.toFixed(d);
}

function color(v){
 return Number(v)>=0 ? "green" : "red";
}

function arr(v){
 return Array.isArray(v) ? v : [];
}

function status(text,on=true){
 const el=$("status");

 if(!el)return;

 el.style.display=on?"block":"none";
 el.textContent=text||"";
}

function metric(label,value,cls=""){
 return `
 <div class="metric">
   <div class="label">${esc(label)}</div>
   <div class="value ${cls}">${value}</div>
 </div>`;
}

async function analyze(){

 let symbol=$("symbol").value
   .trim()
   .toUpperCase();

 if(!symbol){
   status("티커를 입력하세요.");
   return;
 }

 $("symbol").value=symbol;

 status(symbol+" 데이터 불러오는 중...",true);

 $("app").innerHTML=`
 <div class="card">
   <div class="title">⏳ 분석 중</div>
   <div class="empty">
     Twelve Data · FINRA · SEC 데이터를 확인하고 있습니다.
   </div>
 </div>`;

 try{

   const response=await fetch(
     API+"/all?symbol="+encodeURIComponent(symbol),
     {
       method:"GET",
       cache:"no-store"
     }
   );

   if(!response.ok){
     throw new Error("HTTP "+response.status);
   }

   const data=await response.json();

   if(!data){
     throw new Error("응답 데이터 없음");
   }

   if(data.ok===false){
     throw new Error(data.error || "API 오류");
   }

   DATA=data;

   render(data);

   status("분석 완료",true);

   setTimeout(function(){
     status("",false);
   },1500);

 }catch(error){

   console.error(error);

   status(
     "데이터 오류: "+(error.message || "알 수 없는 오류"),
     true
   );

   $("app").innerHTML=`
   <div class="card">
     <div class="title">⚠️ 데이터 불러오기 실패</div>
     <div class="empty">
       ${esc(error.message || "알 수 없는 오류")}
     </div>
   </div>`;
 }
}

function render(d){

 const q=d.quote || {};
 const t=d.technicals || {};
 const f=d.flow || {};
 const s=d.short || {};
 const r=d.regsho || {};
 const th=d.threshold || {};
 const di=d.dilution || {};
 const w=d.warrants || {};
 const tr=d.trend || {};
 const sec=d.sec || {};
 const news=arr(d.news);
 const score=d.score || {};
 const quality=d.dataQuality || {};

 $("app").innerHTML=`

 <div class="card">

   <div class="title">
     💰 주가 · ${esc(q.symbol || d.symbol || "")}
   </div>

   <div class="price">
     ${usd(q.price)}
   </div>

   <div class="${color(q.changePercent)}"
        style="font-size:17px;font-weight:800;margin-top:4px">

     ${sign(q.change)}
     (${sign(q.changePercent)}%)

   </div>

   <div class="grid" style="margin-top:13px">

     ${metric("거래량",i(q.volume))}
     ${metric("평균 거래량",i(q.averageVolume))}
     ${metric(
       "거래량 급증",
       q.volumeSurge != null
       ? p((Number(q.volumeSurge)-1)*100)
       : "-"
     )}

     ${metric("52주 고가",usd(q.high52))}
     ${metric("52주 저가",usd(q.low52))}
     ${metric("52주 위치",p(q.position52))}

   </div>

 </div>


 <div class="card">

   <div class="title">📈 주가 차트</div>

   <div class="tabs">

     <button class="chartTab active" data-range="1D">
       1D
     </button>

     <button class="chartTab" data-range="5D">
       5D
     </button>

     <button class="chartTab" data-range="1M">
       1M
     </button>

     <button class="chartTab" data-range="3M">
       3M
     </button>

   </div>

   <canvas id="chart"></canvas>

 </div>


 <div class="card">

   <div class="title">🎯 종합 분석</div>

   <div class="score">
     ${n(score.value,0)}
   </div>

   <div style="text-align:center;margin-bottom:10px">
     <span class="badge">
       ${esc(score.judgment || "분석 완료")}
     </span>
   </div>

   <ul>
     ${arr(score.reasons)
       .map(x=>`<li>${esc(x)}</li>`)
       .join("")}
   </ul>

 </div>


 <div class="card">

   <div class="title">🔥 공매도</div>

   <div class="grid">

     ${metric(
       "공매도 잔고",
       s.shortInterest != null ? i(s.shortInterest) : "-"
     )}

     ${metric(
       "공매도 비율",
       s.shortPercent != null ? p(s.shortPercent) : "-"
     )}

     ${metric(
       "Days To Cover",
       s.daysToCover != null ? n(s.daysToCover) : "-"
     )}

     ${metric(
       "최근 날짜",
       esc(s.date || "-")
     )}

   </div>

 </div>


 <div class="card">

   <div class="title">📊 Reg SHO</div>

   <div class="grid">

     ${metric(
       "Reg SHO",
       r.value != null ? esc(r.value) : "-"
     )}

     ${metric(
       "날짜",
       esc(r.date || "-")
     )}

     ${metric(
       "Threshold",
       th.value != null ? esc(th.value) : "-"
     )}

     ${metric(
       "Threshold 날짜",
       esc(th.date || "-")
     )}

   </div>

 </div>


 <div class="card">

   <div class="title">💵 희석</div>

   <div class="grid">

     ${metric(
       "희석 신호",
       di.signal ? esc(di.signal) : "-"
     )}

     ${metric(
       "등록 가능성",
       di.registration ? "있음" : "없음"
     )}

     ${metric(
       "최근 등록",
       di.latestRegistration
       ? esc(di.latestRegistration)
       : "-"
     )}

     ${metric(
       "희석 위험",
       di.risk != null ? esc(di.risk) : "-"
     )}

   </div>

   ${
     di.reason
     ? `<div class="small" style="margin-top:9px">
          ${esc(di.reason)}
        </div>`
     : ""
   }

 </div>


 <div class="card">

   <div class="title">🎫 워런트</div>

   <div class="grid">

     ${metric(
       "워런트 신호",
       w.signal ? esc(w.signal) : "-"
     )}

     ${metric(
       "워런트 수",
       w.count != null ? i(w.count) : "-"
     )}

     ${metric(
       "행사가",
       w.strike != null ? usd(w.strike) : "-"
     )}

     ${metric(
       "최근 확인",
       w.latest ? esc(w.latest) : "-"
     )}

   </div>

   ${
     w.reason
     ? `<div class="small" style="margin-top:9px">
          ${esc(w.reason)}
        </div>`
     : ""
   }

 </div>


 <div class="card">

   <div class="title">📦 매집 / 분산</div>

   <div class="grid">

     ${metric(
       "매수 추정",
       f.buyPercent != null ? p(f.buyPercent) : "-",
       "green"
     )}

     ${metric(
       "매도 추정",
       f.sellPercent != null ? p(f.sellPercent) : "-",
       "red"
     )}

     ${metric(
       "VWAP",
       f.vwap != null ? usd(f.vwap) : "-"
     )}

     ${metric(
       "OBV",
       f.obv != null ? i(f.obv) : "-"
     )}

   </div>

   <div class="bar">
     <span style="
       width:${Math.max(
         0,
         Math.min(100,Number(f.buyPercent)||0)
       )}%;
       background:#35d48b">
     </span>
   </div>

 </div>


 <div class="card">

   <div class="title">📈 추세</div>

   <div class="grid">

     ${metric("SMA 5",usd(t.sma5))}
     ${metric("SMA 20",usd(t.sma20))}
     ${metric("SMA 50",usd(t.sma50))}
     ${metric("SMA 200",usd(t.sma200))}

     ${metric("RSI 14",n(t.rsi14))}
     ${metric("MACD",n(t.macd))}
     ${metric("MACD Signal",n(t.macdSignal))}
     ${metric("ATR 14",usd(t.atr14))}

     ${metric("5일 모멘텀",p(t.momentum5))}
     ${metric("20일 모멘텀",p(t.momentum20))}

   </div>

 </div>


 <div class="card">

   <div class="title">📑 SEC 공시</div>

   ${filings(sec)}

 </div>


 <div class="card">

   <div class="title">📰 뉴스</div>

   ${newsList(news)}

 </div>


 <div class="card">

   <div class="title">🐇 최종 결론</div>

   <div class="big">
     ${esc(finalText(d))}
   </div>

   <div class="small" style="margin-top:10px">
     자동 분석 결과이며 투자 판단 참고용입니다.
   </div>

 </div>


 <div class="card">

   <div class="title">🔎 데이터 상태</div>

   <div class="row">
     <span>주가</span>
     <span>${quality.quote ? "✅" : "❌"}</span>
   </div>

   <div class="row">
     <span>기술지표</span>
     <span>${quality.technicals ? "✅" : "❌"}</span>
   </div>

   <div class="row">
     <span>FINRA</span>
     <span>${quality.finra ? "✅" : "⚠️"}</span>
   </div>

   <div class="row">
     <span>SEC</span>
     <span>${quality.sec ? "✅" : "⚠️"}</span>
   </div>

 </div>
 `;

 bindTabs();
 drawChart();
}

function filings(sec){

 const list=arr(sec.filings || sec.recent);

 if(!list.length){
   return `<div class="empty">
     최근 SEC 공시 데이터가 없습니다.
   </div>`;
 }

 return list.slice(0,12).map(f=>{

   const form=f.form || "-";
   const date=f.filingDate || f.date || "-";
   const doc=f.primaryDocument || f.description || "";
   const url=f.url || f.link || "";

   return `
   <div class="row">

     <div>
       <b>${esc(form)}</b>
       <div class="small">${esc(date)}</div>
     </div>

     <div>
       ${
         url
         ? `<a href="${esc(url)}" target="_blank">
              보기
            </a>`
         : `<span class="gray">
              ${esc(doc)}
            </span>`
       }
     </div>

   </div>`;
 }).join("");
}

function newsList(news){

 if(!news.length){
   return `<div class="empty">
     뉴스 데이터가 없습니다.
   </div>`;
 }

 return news.slice(0,10).map(x=>{

   const title=x.title || x.headline || "뉴스";
   const source=x.source || x.publisher || "";
   const date=x.date || x.published || "";
   const url=x.url || x.link || "";

   return `
   <div class="row">

     <div>

       ${
         url
         ? `<a href="${esc(url)}" target="_blank">
              ${esc(title)}
            </a>`
         : `<span>${esc(title)}</span>`
       }

       <div class="small">
         ${esc(source)}
         ${date ? " · "+esc(date) : ""}
       </div>

     </div>

   </div>`;
 }).join("");
}

function finalText(d){

 const score=d.score || {};
 const flow=d.flow || {};
 const tech=d.technicals || {};
 const dilution=d.dilution || {};

 let text="";

 const sv=Number(score.value);

 if(sv>=75){
   text="상승 모멘텀이 강한 구간입니다.";
 }else if(sv>=55){
   text="상승 가능성과 위험요인이 혼재한 구간입니다.";
 }else if(sv>=35){
   text="중립적인 구간으로 추가 확인이 필요합니다.";
 }else{
   text="현재는 위험 신호가 상대적으로 많은 구간입니다.";
 }

 if(Number(flow.sellPercent)>60){
   text+=" 매도 압력이 강하게 나타납니다.";
 }

 if(Number(flow.buyPercent)>60){
   text+=" 매수 우위 흐름이 나타납니다.";
 }

 if(Number(tech.rsi14)>70){
   text+=" RSI 과열 여부를 확인해야 합니다.";
 }

 if(Number(tech.rsi14)<30){
   text+=" RSI 과매도 구간 여부를 확인해야 합니다.";
 }

 if(dilution.registration){
   text+=" SEC 등록 및 희석 가능성을 반드시 확인해야 합니다.";
 }

 return text;
}

function bindTabs(){

 document.querySelectorAll(".chartTab")
 .forEach(btn=>{

   btn.addEventListener("click",function(){

     document.querySelectorAll(".chartTab")
     .forEach(x=>x.classList.remove("active"));

     btn.classList.add("active");

     chartRange=btn.dataset.range;

     drawChart();
   });

 });
}

function chartRows(){

 if(!DATA)return [];

 const sources=[
   DATA.chart,
   DATA.timeSeries,
   DATA.timeseries,
   DATA.history,
   DATA.priceHistory,
   DATA.prices
 ];

 let rows=[];

 for(const x of sources){

   if(Array.isArray(x) && x.length){
     rows=x;
     break;
   }

 }

 if(!rows.length)return [];

 const counts={
   "1D":1,
   "5D":5,
   "1M":22,
   "3M":66
 };

 return rows.slice(-(counts[chartRange]||1));
}

function drawChart(){

 const canvas=$("chart");

 if(!canvas)return;

 const ctx=canvas.getContext("2d");

 const rect=canvas.getBoundingClientRect();

 const dpr=window.devicePixelRatio || 1;

 canvas.width=Math.max(1,rect.width*dpr);
 canvas.height=230*dpr;

 ctx.setTransform(dpr,0,0,dpr,0,0);

 const width=rect.width;
 const height=230;

 ctx.clearRect(0,0,width,height);

 const rows=chartRows();

 if(!rows.length){

   ctx.fillStyle="#718098";
   ctx.font="13px sans-serif";
   ctx.textAlign="center";

   ctx.fillText(
     "차트 데이터가 없습니다.",
     width/2,
     height/2
   );

   return;
 }

 const values=rows
 .map(x=>Number(
   x.close ??
   x.price ??
   x.value ??
   x.last
 ))
 .filter(Number.isFinite);

 if(!values.length){

   ctx.fillStyle="#718098";
   ctx.font="13px sans-serif";
   ctx.textAlign="center";

   ctx.fillText(
     "차트 가격 데이터가 없습니다.",
     width/2,
     height/2
   );

   return;
 }

 let min=Math.min(...values);
 let max=Math.max(...values);

 if(min===max){
   min-=1;
   max+=1;
 }

 const left=42;
 const right=12;
 const top=15;
 const bottom=24;

 const plotW=width-left-right;
 const plotH=height-top-bottom;

 ctx.strokeStyle="#1b2940";
 ctx.lineWidth=1;

 for(let j=0;j<5;j++){

   const y=top+(plotH*j/4);

   ctx.beginPath();
   ctx.moveTo(left,y);
   ctx.lineTo(width-right,y);
   ctx.stroke();

   const val=max-(max-min)*(j/4);

   ctx.fillStyle="#718098";
   ctx.font="10px sans-serif";
   ctx.textAlign="right";

   ctx.fillText(
     val.toFixed(2),
     left-5,
     y+3
   );
 }

 ctx.beginPath();

 values.forEach((v,index)=>{

   const x=
     left+
     (
       values.length===1
       ? plotW/2
       : plotW*index/(values.length-1)
     );

   const y=
     top+
     (max-v)/(max-min)*plotH;

   if(index===0){
     ctx.moveTo(x,y);
   }else{
     ctx.lineTo(x,y);
   }

 });

 ctx.strokeStyle="#4d94ff";
 ctx.lineWidth=2.5;
 ctx.stroke();

 const last=values[values.length-1];

 const lx=
   left+
   (
     values.length===1
     ? plotW/2
     : plotW
   );

 const ly=
   top+
   (max-last)/(max-min)*plotH;

 ctx.fillStyle="#4d94ff";

 ctx.beginPath();
 ctx.arc(lx,ly,4,0,Math.PI*2);
 ctx.fill();
}

$("analyzeBtn").addEventListener(
 "click",
 analyze
);

$("symbol").addEventListener(
 "keydown",
 function(e){
   if(e.key==="Enter"){
     analyze();
   }
 }
);

window.addEventListener(
 "resize",
 function(){
   if(DATA)drawChart();
 }
);

</script>
