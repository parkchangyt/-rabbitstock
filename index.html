<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1">

<title>RabbitStock Ultimate</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:#070b14;
  color:#eef3ff;
  font-family:-apple-system,BlinkMacSystemFont,
              "Apple SD Gothic Neo","Noto Sans KR",
              sans-serif;
}

body{
  min-height:100vh;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:14px;
}

/* =========================
   HEADER
========================= */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
}

.logo{
  font-size:21px;
  font-weight:900;
  letter-spacing:-.8px;
}

.logo span{
  color:#69a7ff;
}

.status{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:11px;
  color:#8491aa;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#555;
}

.dot.ok{
  background:#40d98b;
  box-shadow:0 0 8px #40d98b;
}

.dot.bad{
  background:#ff5964;
}

/* =========================
   SEARCH
========================= */

.search{
  display:flex;
  gap:8px;
  margin-bottom:14px;
}

.search input{
  flex:1;
  min-width:0;
  border:1px solid #202a3e;
  background:#0d1422;
  color:#fff;
  border-radius:13px;
  padding:13px 14px;
  outline:none;
  font-size:16px;
  font-weight:700;
  text-transform:uppercase;
}

.search input:focus{
  border-color:#4e7dcc;
}

.search button{
  border:0;
  border-radius:13px;
  padding:0 18px;
  background:#4d83e6;
  color:white;
  font-weight:900;
}

/* =========================
   PRICE
========================= */

.price-card{
  background:
    linear-gradient(
      145deg,
      #101a2b,
      #0b111e
    );
  border:1px solid #202c42;
  border-radius:20px;
  padding:18px;
  margin-bottom:12px;
  box-shadow:0 12px 35px rgba(0,0,0,.25);
}

.price-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
}

.ticker{
  font-size:25px;
  font-weight:950;
  letter-spacing:-1px;
}

.company{
  margin-top:3px;
  color:#8794ac;
  font-size:12px;
}

.price{
  margin-top:12px;
  font-size:38px;
  line-height:1;
  font-weight:950;
  letter-spacing:-1.5px;
}

.change{
  margin-top:7px;
  font-size:15px;
  font-weight:850;
}

.up{
  color:#3fdb91;
}

.down{
  color:#ff6873;
}

.neutral{
  color:#a8b2c4;
}

.quote-meta{
  margin-top:17px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.meta-box{
  background:#0b1220;
  border:1px solid #1b2639;
  border-radius:12px;
  padding:10px;
}

.meta-title{
  color:#718099;
  font-size:10px;
}

.meta-value{
  margin-top:4px;
  font-size:13px;
  font-weight:800;
}

/* =========================
   JUDGMENT
========================= */

.judgment{
  border-radius:20px;
  padding:18px;
  margin-bottom:12px;
  background:
    linear-gradient(
      145deg,
      #111c30,
      #0c1320
    );
  border:1px solid #263650;
}

.judgment-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.j-title{
  font-size:13px;
  color:#8592aa;
}

.j-score{
  font-size:38px;
  font-weight:950;
}

.judgment-name{
  margin-top:3px;
  font-size:22px;
  font-weight:950;
}

.score-bar{
  height:8px;
  background:#1b2638;
  border-radius:99px;
  overflow:hidden;
  margin-top:15px;
}

.score-fill{
  height:100%;
  width:0%;
  background:#5e91ee;
  transition:.5s;
}

.reasons{
  margin-top:15px;
  display:grid;
  gap:7px;
}

.reason{
  background:#0b1220;
  border:1px solid #1b2638;
  border-radius:11px;
  padding:10px 11px;
  color:#c1cadd;
  font-size:12px;
  line-height:1.5;
}

/* =========================
   CHART
========================= */

.section{
  background:#0c1320;
  border:1px solid #1d293d;
  border-radius:19px;
  margin-bottom:12px;
  overflow:hidden;
}

.section-title{
  padding:15px;
  font-size:14px;
  font-weight:900;
}

.chart-wrap{
  height:320px;
  padding:0 10px 12px;
  position:relative;
}

canvas{
  width:100%;
  height:100%;
  display:block;
}

/* =========================
   TECHNICAL
========================= */

.tech-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  padding:0 12px 12px;
}

.tech{
  background:#0a111d;
  border:1px solid #1a2639;
  border-radius:13px;
  padding:12px;
}

.tech-name{
  color:#77859d;
  font-size:10px;
}

.tech-value{
  margin-top:5px;
  font-size:17px;
  font-weight:900;
}

.tech-desc{
  margin-top:5px;
  color:#69778f;
  font-size:10px;
  line-height:1.4;
}

/* =========================
   DETAILS
========================= */

details{
  border-top:1px solid #1a2638;
}

details:first-of-type{
  border-top:0;
}

summary{
  list-style:none;
  cursor:pointer;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:850;
  font-size:13px;
}

summary::-webkit-details-marker{
  display:none;
}

summary::after{
  content:"＋";
  color:#718099;
  font-size:18px;
}

details[open] summary::after{
  content:"−";
}

.detail-body{
  padding:0 12px 14px;
}

.info-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.info{
  background:#0a111d;
  border:1px solid #1a2639;
  border-radius:12px;
  padding:11px;
}

.info-label{
  color:#6f7d94;
  font-size:10px;
}

.info-value{
  margin-top:4px;
  font-size:13px;
  font-weight:800;
  word-break:break-word;
}

.note{
  color:#7e8ba2;
  font-size:11px;
  line-height:1.5;
  padding:10px 2px;
}

/* =========================
   TABLE
========================= */

.table-scroll{
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
}

table{
  width:100%;
  min-width:760px;
  border-collapse:collapse;
  font-size:10px;
}

th{
  color:#69778e;
  font-weight:700;
  text-align:right;
  padding:8px;
  border-bottom:1px solid #1c283b;
  white-space:nowrap;
}

th:first-child,
td:first-child{
  text-align:left;
}

td{
  padding:9px 8px;
  border-bottom:1px solid #141f31;
  text-align:right;
  white-space:nowrap;
}

a{
  color:#71a5ff;
  text-decoration:none;
  font-weight:800;
}

/* =========================
   SOURCE STATUS
========================= */

.source{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:9px 10px;
  background:#0a111d;
  border:1px solid #19253a;
  border-radius:10px;
  margin-bottom:7px;
  font-size:11px;
}

.source-name{
  font-weight:800;
}

.source-state{
  color:#738199;
  text-align:right;
}

.source-state.ok{
  color:#40d98b;
}

.source-state.bad{
  color:#ff6873;
}

/* =========================
   NEWS
========================= */

.news{
  padding:9px 0;
  border-bottom:1px solid #182337;
}

.news:last-child{
  border-bottom:0;
}

.news-title{
  font-size:12px;
  line-height:1.45;
  font-weight:850;
}

.news-meta{
  margin-top:5px;
  color:#6f7c92;
  font-size:10px;
}

/* =========================
   LOADING
========================= */

.loading{
  text-align:center;
  padding:40px 10px;
  color:#75839b;
  font-size:13px;
}

.error{
  padding:14px;
  background:#241217;
  border:1px solid #5b2630;
  border-radius:13px;
  color:#ff7d87;
  font-size:12px;
  line-height:1.5;
}

/* =========================
   MOBILE
========================= */

@media(max-width:520px){

  .app{
    padding:10px;
  }

  .price{
    font-size:34px;
  }

  .quote-meta{
    grid-template-columns:repeat(3,1fr);
  }

  .meta-value{
    font-size:11px;
  }

  .chart-wrap{
    height:280px;
  }

}

</style>
</head>

<body>

<div class="app">

  <div class="header">

    <div class="logo">
      🐇 Rabbit<span>Stock</span>
    </div>

    <div class="status">
      <span id="statusDot" class="dot"></span>
      <span id="statusText">연결 확인 중</span>
    </div>

  </div>


  <div class="search">

    <input
      id="symbolInput"
      value="BRNX"
      maxlength="12"
      autocapitalize="characters"
      spellcheck="false"
      placeholder="티커 입력">

    <button onclick="loadStock()">
      분석
    </button>

  </div>


  <div id="appContent">

    <div class="loading">
      데이터를 불러오는 중…
    </div>

  </div>

</div>


<script>

/* =========================================================
   RabbitStock HTML
   Worker 15.0 연결
========================================================= */

const API_BASE =
  "https://rabbitstock-final.keoss.workers.dev";


let CURRENT_SYMBOL = "BRNX";
let CURRENT_DATA = null;


/* =========================================================
   Utility
========================================================= */

function esc(v){

  if(v === null ||
     v === undefined)
    return "";

  return String(v)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function fmt(v,d=2){

  if(v === null ||
     v === undefined ||
     v === "" ||
     !Number.isFinite(Number(v)))
    return "데이터 없음";

  return Number(v).toLocaleString(
    "en-US",
    {
      minimumFractionDigits:d,
      maximumFractionDigits:d
    }
  );

}


function fmtInt(v){

  if(v === null ||
     v === undefined ||
     !Number.isFinite(Number(v)))
    return "데이터 없음";

  return Number(v).toLocaleString(
    "en-US"
  );

}


function fmtMoney(v){

  if(v === null ||
     v === undefined ||
     !Number.isFinite(Number(v)))
    return "데이터 없음";

  return "$" + fmt(v,2);

}


function fmtPercent(v){

  if(v === null ||
     v === undefined ||
     !Number.isFinite(Number(v)))
    return "데이터 없음";

  const n = Number(v);

  return (
    n >= 0 ? "+" : ""
  ) + fmt(n,2) + "%";

}


function safeArray(v){

  return Array.isArray(v)
    ? v
    : [];

}


function sourceState(s){

  if(!s)
    return {
      cls:"bad",
      text:"데이터 없음"
    };

  if(s.ok)
    return {
      cls:"ok",
      text:
        s.count !== null &&
        s.count !== undefined
          ? `정상 · ${s.count}건`
          : "정상"
    };

  return {
    cls:"bad",
    text:
      s.message ||
      "데이터 없음"
  };

}


/* =========================================================
   API
========================================================= */

async function api(path){

  const url =
    API_BASE +
    path;

  const r =
    await fetch(
      url,
      {
        method:"GET",
        cache:"no-store"
      }
    );

  const text =
    await r.text();

  let data;

  try{
    data =
      JSON.parse(text);
  }catch{
    throw new Error(
      "서버가 JSON 데이터를 반환하지 않았습니다."
    );
  }

  if(!r.ok){

    throw new Error(
      data?.error ||
      `HTTP ${r.status}`
    );

  }

  return data;

}


/* =========================================================
   LOAD
========================================================= */

async function loadStock(){

  const input =
    document.getElementById(
      "symbolInput"
    );

  const symbol =
    String(input.value || "")
      .trim()
      .toUpperCase()
      .replace(
        /[^A-Z0-9.\-]/g,
        ""
      );

  if(!symbol){

    input.focus();
    return;

  }

  CURRENT_SYMBOL =
    symbol;

  setStatus(
    "연결 중",
    false
  );

  document.getElementById(
    "appContent"
  ).innerHTML =
    `<div class="loading">
       ${esc(symbol)} 데이터를 불러오는 중…
     </div>`;

  try{

    const data =
      await api(
        `/all?symbol=${encodeURIComponent(symbol)}`
      );

    CURRENT_DATA =
      data;

    render(data);

    setStatus(
      "API 연결됨",
      true
    );

  }catch(e){

    console.error(e);

    setStatus(
      "API 오류",
      false
    );

    document.getElementById(
      "appContent"
    ).innerHTML =
      `<div class="error">
        <b>데이터를 불러오지 못했습니다.</b><br><br>
        ${esc(e.message)}
       </div>`;

  }

}


/* =========================================================
   STATUS
========================================================= */

function setStatus(
  text,
  ok
){

  document.getElementById(
    "statusText"
  ).textContent =
    text;

  const dot =
    document.getElementById(
      "statusDot"
    );

  dot.className =
    "dot " +
    (ok ? "ok" : "bad");

}


/* =========================================================
   RENDER
========================================================= */

function render(d){

  const q =
    d.quote || {};

  const technical =
    d.technical ||
    d.technicals ||
    {};

  const score =
    Number.isFinite(
      Number(
        d.overallScore ??
        d.totalScore ??
        d.score
      )
    )
      ? Number(
          d.overallScore ??
          d.totalScore ??
          d.score
        )
      : null;


  const price =
    q.price ??
    d.price ??
    null;

  const change =
    q.changePercent ??
    d.changePercent ??
    null;


  const history =
    safeArray(
      d.prices ||
      d.history
    );


  document.getElementById(
    "appContent"
  ).innerHTML = `

    ${renderPrice(
      d,
      q,
      price,
      change
    )}

    ${renderJudgment(
      d,
      score
    )}

    ${renderChartSection(
      history
    )}

    ${renderTechnical(
      technical,
      price
    )}

    ${renderDetails(
      d
    )}

  `;


  drawChart(
    history
  );

}


/* =========================================================
   PRICE
========================================================= */

function renderPrice(
  d,
  q,
  price,
  change
){

  let changeClass =
    "neutral";

  if(
    Number.isFinite(
      Number(change)
    )
  ){

    changeClass =
      Number(change) > 0
        ? "up"
        : Number(change) < 0
          ? "down"
          : "neutral";

  }


  return `

  <div class="price-card">

    <div class="price-top">

      <div>

        <div class="ticker">
          ${esc(
            q.symbol ||
            d.symbol ||
            CURRENT_SYMBOL
          )}
        </div>

        <div class="company">
          ${esc(
            q.name ||
            d.sec?.company ||
            ""
          )}
        </div>

      </div>

      <div class="company">
        ${esc(
          q.exchange ||
          ""
        )}
      </div>

    </div>


    <div class="price">
      ${price === null
        ? "데이터 없음"
        : fmtMoney(price)}
    </div>


    <div class="change ${changeClass}">
      ${fmtPercent(change)}
    </div>


    <div class="quote-meta">

      <div class="meta-box">

        <div class="meta-title">
          거래량
        </div>

        <div class="meta-value">
          ${fmtInt(q.volume)}
        </div>

      </div>


      <div class="meta-box">

        <div class="meta-title">
          전일 종가
        </div>

        <div class="meta-value">
          ${fmtMoney(
            q.previousClose
          )}
        </div>

      </div>


      <div class="meta-box">

        <div class="meta-title">
          통화
        </div>

        <div class="meta-value">
          ${esc(
            q.currency ||
            "USD"
          )}
        </div>

      </div>

    </div>

  </div>

  `;

}


/* =========================================================
   JUDGMENT
========================================================= */

function renderJudgment(
  d,
  score
){

  const judgment =
    d.judgment ||
    "데이터 없음";


  const reasons =
    safeArray(
      d.reasons ||
      d.analysis
    );


  const width =
    score === null
      ? 0
      : Math.max(
          0,
          Math.min(
            100,
            score
          )
        );


  return `

  <div class="judgment">

    <div class="judgment-head">

      <div class="j-title">
        종합 판단
      </div>

      <div class="j-score">
        ${score === null
          ? "—"
          : fmt(score,0)}
      </div>

    </div>


    <div class="judgment-name">
      ${esc(judgment)}
    </div>


    <div class="score-bar">
      <div
        class="score-fill"
        style="width:${width}%">
      </div>
    </div>


    <div class="reasons">

      ${
        reasons.length
          ? reasons.map(
              x =>
                `<div class="reason">
                   ${esc(x)}
                 </div>`
            ).join("")
          : `<div class="reason">
               분석 근거 데이터 없음
             </div>`
      }

    </div>

  </div>

  `;

}


/* =========================================================
   CHART
========================================================= */

function renderChartSection(){

  return `

  <div class="section">

    <div class="section-title">
      📈 주가 차트
    </div>

    <div class="chart-wrap">

      <canvas id="priceChart"></canvas>

    </div>

  </div>

  `;

}


/* =========================================================
   TECHNICAL
========================================================= */

function renderTechnical(
  t,
  price
){

  return `

  <div class="section">

    <div class="section-title">
      📊 핵심 기술지표
    </div>

    <div class="tech-grid">

      ${techBox(
        "MA20",
        t.ma20,
        "최근 20거래일 평균가격 · 단기 추세"
      )}

      ${techBox(
        "MA50",
        t.ma50,
        "최근 50거래일 평균가격 · 중기 추세"
      )}

      ${techBox(
        "RSI",
        t.rsi,
        "0~100 상승·하락 강도 · 70↑ 과열 / 30↓ 침체 참고"
      )}

      ${techBox(
        "VWAP",
        t.vwap,
        "거래량을 반영한 평균가격"
      )}

      ${techBox(
        "OBV",
        t.obv,
        "거래량 기반 수급 흐름 참고"
      )}

      ${techBox(
        "현재가",
        price,
        "Twelve Data 실제 가격"
      )}

    </div>

  </div>

  `;

}


function techBox(
  name,
  value,
  desc
){

  let val =
    "데이터 없음";

  if(
    value !== null &&
    value !== undefined &&
    Number.isFinite(
      Number(value)
    )
  ){

    val =
      name === "RSI"
        ? fmt(value,1)
        : name === "OBV"
          ? fmtInt(value)
          : fmtMoney(value);

  }

  return `

  <div class="tech">

    <div class="tech-name">
      ${name}
    </div>

    <div class="tech-value">
      ${val}
    </div>

    <div class="tech-desc">
      ${desc}
    </div>

  </div>

  `;

}


/* =========================================================
   DETAILS
========================================================= */

function renderDetails(d){

  const shortRows =
    safeArray(d.short);

  const regsho =
    safeArray(d.regsho);

  const threshold =
    safeArray(d.threshold);

  const dark =
    safeArray(
      d.darkpool ||
      d.darkPool
    );

  const sec =
    safeArray(
      d.sec?.filings ||
      d.filings
    );

  const news =
    safeArray(
      d.news
    );

  const st =
    safeArray(
      d.stocktitan?.items ||
      d.stockTitan?.items
    );

  const priceRows =
    safeArray(
      d.priceTable
    );


  return `

  <div class="section">

    ${renderSourceDetails(d)}


    <details>

      <summary>
        🔥 공매도 / Short Interest
      </summary>

      <div class="detail-body">

        ${renderShort(
          shortRows
        )}

      </div>

    </details>


    <details>

      <summary>
        🚨 Reg SHO
      </summary>

      <div class="detail-body">

        ${renderRegSho(
          regsho
        )}

      </div>

    </details>

/* =========================================================
   CHART
========================================================= */

function drawChart(rows){

  const canvas =
    document.getElementById(
      "priceChart"
    );

  if(!canvas)
    return;


  const ctx =
    canvas.getContext(
      "2d"
    );


  const rect =
    canvas.getBoundingClientRect();


  const dpr =
    window.devicePixelRatio ||
    1;


  canvas.width =
    rect.width * dpr;

  canvas.height =
    rect.height * dpr;

  ctx.scale(
    dpr,
    dpr
  );


  const W =
    rect.width;

  const H =
    rect.height;


  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  const data =
    rows
      .filter(
        x =>
          Number.isFinite(
            Number(x.close)
          )
      )
      .slice(-60);


  if(!data.length){

    ctx.fillStyle =
      "#65738a";

    ctx.font =
      "13px -apple-system";

    ctx.textAlign =
      "center";

    ctx.fillText(
      "차트 데이터 없음",
      W / 2,
      H / 2
    );

    return;

  }


  const values =
    data.map(
      x =>
        Number(x.close)
    );


  let min =
    Math.min(...values);

  let max =
    Math.max(...values);


  if(min === max){

    min -= 1;
    max += 1;

  }


  const padLeft =
    8;

  const padRight =
    8;

  const padTop =
    15;

  const padBottom =
    20;


  const cw =
    W -
    padLeft -
    padRight;

  const ch =
    H -
    padTop -
    padBottom;


  // grid

  ctx.strokeStyle =
    "#172235";

  ctx.lineWidth =
    1;


  for(
    let i=0;
    i<4;
    i++
  ){

    const y =
      padTop +
      ch *
      i /
      3;

    ctx.beginPath();

    ctx.moveTo(
      padLeft,
      y
    );

    ctx.lineTo(
      W-padRight,
      y
    );

    ctx.stroke();

  }


  // line

  ctx.beginPath();


  data.forEach(
    (r,i) => {

      const x =
        padLeft +
        cw *
        (
          i /
          Math.max(
            1,
            data.length-1
          )
        );


      const y =
        padTop +
        ch *
        (
          1 -
          (
            (
              Number(r.close) -
              min
            ) /
            (
              max -
              min
            )
          )
        );


      if(i===0)
        ctx.moveTo(
          x,
          y
        );
      else
        ctx.lineTo(
          x,
          y
        );

    }
  );


  ctx.strokeStyle =
    "#6c9cf0";

  ctx.lineWidth =
    2;

  ctx.stroke();


  // last dot

  const last =
    data[data.length-1];

  const lastX =
    padLeft +
    cw;

  const lastY =
    padTop +
    ch *
    (
      1 -
      (
        (
          Number(last.close) -
          min
        ) /
        (
          max -
          min
        )
      )
    );


  ctx.beginPath();

  ctx.arc(
    lastX,
    lastY,
    4,
    0,
    Math.PI*2
  );

  ctx.fillStyle =
    "#8ab4ff";

  ctx.fill();


  // labels

  ctx.font =
    "10px -apple-system";

  ctx.fillStyle =
    "#65738a";

  ctx.textAlign =
    "left";

  ctx.fillText(
    fmtMoney(max),
    padLeft,
    11
  );


  ctx.textAlign =
    "right";

  ctx.fillText(
    fmtMoney(min),
    W-padRight,
    H-4
  );

}
