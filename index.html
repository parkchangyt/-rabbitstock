<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>RabbitStock Ultimate</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;
 padding:0;
 background:#09101e;
 color:#eef3ff;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
 Arial,sans-serif;
}
body{padding-bottom:40px}
.wrap{
 width:min(1100px,100%);
 margin:auto;
 padding:14px;
}
header{
 display:flex;
 gap:10px;
 align-items:center;
 justify-content:space-between;
 margin-bottom:14px;
}
.logo{
 font-size:23px;
 font-weight:900;
 letter-spacing:-1px;
}
.badge{
 padding:5px 9px;
 border-radius:999px;
 background:#14213a;
 color:#91a9d8;
 font-size:11px;
}
.search{
 display:flex;
 gap:8px;
 margin-bottom:14px;
}
input{
 flex:1;
 min-width:0;
 height:46px;
 border:1px solid #263657;
 background:#0d1729;
 color:#fff;
 border-radius:12px;
 padding:0 14px;
 font-size:17px;
 font-weight:700;
 outline:none;
 text-transform:uppercase;
}
button{
 border:0;
 border-radius:12px;
 background:#2f7cff;
 color:#fff;
 padding:0 18px;
 font-size:15px;
 font-weight:800;
}
button:active{transform:scale(.98)}
.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:12px;
}
.card{
 background:#0d1729;
 border:1px solid #1d2a43;
 border-radius:16px;
 padding:15px;
 margin-bottom:12px;
 overflow:hidden;
}
.full{grid-column:1/-1}
.title{
 font-size:14px;
 font-weight:900;
 margin-bottom:12px;
 color:#b9c8e7;
 display:flex;
 align-items:center;
 justify-content:space-between;
}
.price{
 font-size:42px;
 line-height:1;
 font-weight:950;
 letter-spacing:-2px;
}
.sub{
 color:#8190ad;
 font-size:12px;
 margin-top:8px;
}
.judge{
 margin-top:13px;
 border-radius:12px;
 padding:12px;
 background:#111e34;
}
.judge strong{
 display:block;
 font-size:20px;
 margin-bottom:5px;
}
.up{color:#44dc91}
.down{color:#ff687c}
.neutral{color:#ffc75d}
.kpi{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:8px;
}
.kpiBox{
 background:#111e34;
 border-radius:11px;
 padding:11px;
 min-width:0;
}
.kpiBox span{
 display:block;
 color:#71819f;
 font-size:10px;
 margin-bottom:5px;
}
.kpiBox b{
 font-size:15px;
 word-break:break-word;
}
table{
 width:100%;
 border-collapse:collapse;
 font-size:12px;
}
th,td{
 padding:9px 6px;
 border-bottom:1px solid #1c2940;
 text-align:left;
 white-space:nowrap;
}
th{color:#71819f;font-weight:700}
td{color:#dce5f7}
.scroll{overflow-x:auto}
.status{
 font-size:11px;
 padding:4px 7px;
 border-radius:7px;
 background:#17243a;
 color:#92a4c6;
}
.ok{color:#4ee59a}
.err{color:#ff687c}
.empty{color:#ffc75d}
.news{
 border-bottom:1px solid #1c2940;
 padding:12px 0;
}
.news:last-child{border-bottom:0}
.newsTitle{
 color:#edf3ff;
 font-weight:800;
 line-height:1.4;
}
.newsMeta{
 color:#7383a0;
 font-size:10px;
 margin:5px 0;
}
.newsSummary{
 color:#aab7cf;
 font-size:12px;
 line-height:1.55;
}
a{
 color:#70a7ff;
 text-decoration:none;
}
.note{
 color:#71819f;
 font-size:11px;
 line-height:1.5;
}
.loading{
 padding:30px;
 text-align:center;
 color:#8291ae;
}
.errorBox{
 background:#321621;
 color:#ff9aaa;
 border:1px solid #633044;
 border-radius:12px;
 padding:12px;
 font-size:13px;
 line-height:1.5;
}

.chartWrap{
 position:relative;
 width:100%;
 height:340px;
 background:#091321;
 border-radius:12px;
 overflow:hidden;
 border:1px solid #18263e;
}
canvas{
 display:block;
 width:100%;
 height:100%;
 touch-action:none;
}
.chartInfo{
 margin-top:8px;
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:6px;
}
.chartInfo div{
 background:#111e34;
 border-radius:8px;
 padding:7px;
}
.chartInfo span{
 display:block;
 color:#687997;
 font-size:9px;
}
.chartInfo b{
 font-size:11px;
}

@media(max-width:700px){
 .grid{grid-template-columns:1fr}
 .full{grid-column:auto}
 .price{font-size:38px}
 .chartWrap{height:290px}
 .kpi{grid-template-columns:repeat(2,1fr)}
 .chartInfo{
  grid-template-columns:repeat(2,1fr);
 }
}
</style>
</head>

<body>
<div class="wrap">

<header>
 <div class="logo">🐇 RabbitStock Ultimate</div>
 <div class="badge" id="apiStatus">API 연결 확인중</div>
</header>

<div class="search">
 <input id="symbol" value="BRNX" placeholder="티커 입력">
 <button onclick="loadStock()">분석</button>
</div>

<div id="app">
 <div class="loading">데이터를 불러오는 중...</div>
</div>

</div>

<script>

const API="https://rabbitstock-final.keoss.workers.dev";

let CURRENT=null;
let chartState={
 rows:[],
 selected:0
};

function $(id){
 return document.getElementById(id);
}

function esc(v){
 return String(v ?? "")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;");
}

function money(v){
 if(v===null || v===undefined || v==="") return "-";
 const n=Number(v);
 if(!Number.isFinite(n)) return esc(v);
 return "$"+n.toLocaleString("en-US",{
  minimumFractionDigits:n<10?2:2,
  maximumFractionDigits:4
 });
}

function num(v){
 if(v===null || v===undefined || v==="") return null;
 const n=Number(String(v).replace(/,/g,""));
 return Number.isFinite(n)?n:null;
}

function fmt(v,d=2){
 const n=num(v);
 return n===null?"-":n.toLocaleString("en-US",{
  minimumFractionDigits:d,
  maximumFractionDigits:d
 });
}

function pct(v){
 const n=num(v);
 return n===null?"-":(n>0?"+":"")+n.toFixed(2)+"%";
}

function dateText(v){
 if(!v) return "-";
 try{
  return new Date(v).toLocaleDateString("ko-KR");
 }catch(e){
  return String(v).slice(0,10);
 }
}

async function api(path){
 const r=await fetch(API+path,{
  method:"GET",
  cache:"no-store"
 });

 if(!r.ok){
  throw new Error("HTTP "+r.status);
 }

 return await r.json();
}

async function loadStock(){

 const symbol=$("symbol").value.trim().toUpperCase();

 if(!symbol){
  alert("티커를 입력하세요.");
  return;
 }

 $("symbol").value=symbol;

 $("app").innerHTML=
 `<div class="loading">🐇 ${esc(symbol)} 분석중...<br><br>가격 / 차트 / 공매도 / SEC / 뉴스 데이터를 가져오는 중입니다.</div>`;

 try{

  const data=await api("/all?symbol="+encodeURIComponent(symbol));

  CURRENT=data;

  $("apiStatus").textContent="API ONLINE";
  $("apiStatus").className="badge ok";

  renderAll(data);

 }catch(e){

  $("apiStatus").textContent="API ERROR";
  $("apiStatus").className="badge err";

  $("app").innerHTML=
  `<div class="errorBox">
   데이터 연결 실패<br><br>
   ${esc(e.message)}
   <br><br>
   Worker 주소를 확인하세요.
  </div>`;

 }
}

function renderAll(data){

 const q=data.quote || {};
 const tech=data.technicals || data.technicalData || {};
 const price=num(q.close ?? q.price ?? q.current);
 const change=num(q.percent_change ?? q.change_percent ?? q.changePct);

 let cls="neutral";
 let judgment="관망";

 if(change>2) {
  cls="up";
  judgment="상승 우세";
 }
 else if(change<-2){
  cls="down";
  judgment="하락 주의";
 }

 const score=
   num(data.score?.score) ??
   num(data.analysis?.score) ??
   0;

 $("app").innerHTML=`

 <div class="grid">

  <section class="card full">
   <div class="title">
    <span>${esc(data.symbol || $("symbol").value)}</span>
    <span class="status ok">LIVE DATA</span>
   </div>

   <div class="price ${cls}">
    ${money(price)}
   </div>

   <div class="sub">
    변동 ${pct(change)}
    · ${dateText(q.datetime || q.timestamp || new Date())}
   </div>

   <div class="judge">
    <strong class="${cls}">${judgment}</strong>
    <span class="note">
     종합점수 ${fmt(score,0)} / 100
     · 가격/기술/공매/희석/뉴스 데이터를 종합
    </span>
   </div>
  </section>

  <section class="card full">
   <div class="title">📈 캔들 차트 <span class="status">터치하면 날짜 조회</span></div>

   <div class="chartWrap">
    <canvas id="chart"></canvas>
   </div>

   <div class="chartInfo" id="chartInfo"></div>
  </section>

  <section class="card">
   <div class="title">📊 기술적 분석</div>
   ${renderTechnicals(tech)}
  </section>

  <section class="card">
   <div class="title">🎯 종합 판단</div>
   ${renderScore(data)}
  </section>

  <section class="card full">
   <div class="title">🩳 FINRA 공매도</div>
   ${renderShort(data)}
  </section>

  <section class="card full">
   <div class="title">🚨 Reg SHO / Threshold</div>
   ${renderThreshold(data)}
  </section>

  <section class="card">
   <div class="title">💧 희석 / Dilution</div>
   ${renderDilution(data)}
  </section>

  <section class="card">
   <div class="title">🎫 Warrant</div>
   ${renderWarrant(data)}
  </section>

  <section class="card full">
   <div class="title">🏛 SEC 최근 공시</div>
   ${renderSEC(data)}
  </section>

  <section class="card full">
   <div class="title">📰 Finnhub 뉴스</div>
   ${renderFinnhub(data)}
  </section>

  <section class="card full">
   <div class="title">📰 StockTitan 뉴스</div>
   ${renderStockTitan(data)}
  </section>

  <section class="card full">
   <div class="title">🌑 DarkFina / Dark Pool</div>
   ${renderDarkFina(data)}
  </section>

  <section class="card full">
   <div class="title">📅 최근 가격 기록</div>
   ${renderHistory(data)}
  </section>

  <section class="card full">
   <div class="title">🔗 데이터 출처</div>
   ${renderSources(data)}
  </section>

 </div>
 `;

 prepareChart(data);
}

function renderTechnicals(t){

 if(!t) return `<div class="note">기술 데이터 없음</div>`;

 return `
 <div class="kpi">

  <div class="kpiBox">
   <span>MA20</span>
   <b>${money(t.ma20)}</b>
  </div>

  <div class="kpiBox">
   <span>MA50</span>
   <b>${money(t.ma50)}</b>
  </div>

  <div class="kpiBox">
   <span>RSI</span>
   <b>${fmt(t.rsi,2)}</b>
  </div>

  <div class="kpiBox">
   <span>MACD</span>
   <b>${fmt(t.macd,4)}</b>
  </div>

  <div class="kpiBox">
   <span>Signal</span>
   <b>${fmt(t.signal,4)}</b>
  </div>

  <div class="kpiBox">
   <span>Trend</span>
   <b>${esc(t.trend || "-")}</b>
  </div>

 </div>
 `;
}

function renderScore(data){

 const s=data.score || data.analysis || {};

 return `
 <div class="kpi">

  <div class="kpiBox">
   <span>종합점수</span>
   <b>${fmt(s.score,0)}/100</b>
  </div>

  <div class="kpiBox">
   <span>기술</span>
   <b>${fmt(s.technical,0)}</b>
  </div>

  <div class="kpiBox">
   <span>공매</span>
   <b>${fmt(s.short,0)}</b>
  </div>

  <div class="kpiBox">
   <span>뉴스</span>
   <b>${fmt(s.news,0)}</b>
  </div>

 </div>

 <div class="judge">
  <strong>${esc(s.judgment || s.verdict || "데이터 분석중")}</strong>
  <div class="note">${esc(s.reason || s.comment || "")}</div>
 </div>
 `;
}

function renderShort(data){

 const s=data.finra || data.short || {};

 if(s.status==="error"){
  return `<div class="errorBox">${esc(s.message || "FINRA 데이터 오류")}</div>`;
 }

 const rows=[
  ["Short Interest",s.shortInterest ?? s.short_interest],
  ["Settlement Date",s.settlementDate ?? s.settlement_date],
  ["Short % Float",s.shortPercentFloat ?? s.short_percent_float],
  ["Days To Cover",s.daysToCover ?? s.days_to_cover],
  ["Avg Daily Volume",s.avgDailyVolume ?? s.avg_daily_volume]
 ];

 return `
 <div class="scroll">
 <table>
 <thead><tr><th>항목</th><th>값</th></tr></thead>
 <tbody>
 ${rows.map(x=>`
  <tr>
   <td>${esc(x[0])}</td>
   <td>${x[0].includes("%")?pct(x[1]):fmt(x[1],2)}</td>
  </tr>
 `).join("")}
 </tbody>
 </table>
 </div>
 `;
}

function renderThreshold(data){

 const t=data.threshold || data.regSho || {};

 return `
 <div class="kpi">

  <div class="kpiBox">
   <span>상태</span>
   <b>${esc(t.status || "-")}</b>
  </div>

  <div class="kpiBox">
   <span>등재 여부</span>
   <b>${esc(t.threshold || t.isThreshold || "-")}</b>
  </div>

  <div class="kpiBox">
   <span>연속일</span>
   <b>${fmt(t.days ?? t.consecutiveDays,0)}</b>
  </div>

 </div>

 <div class="note" style="margin-top:10px">
 ${esc(t.message || t.reason || "")}
 </div>
 `;
}

function renderDilution(data){

 const d=data.dilution || {};

 return `
 <div class="kpi">

  <div class="kpiBox">
   <span>상태</span>
   <b>${esc(d.status || "-")}</b>
  </div>

  <div class="kpiBox">
   <span>발행주식</span>
   <b>${fmt(d.sharesOutstanding,0)}</b>
  </div>

  <div class="kpiBox">
   <span>잠재 희석</span>
   <b>${fmt(d.potentialDilution,0)}</b>
  </div>

 </div>

 <div class="note" style="margin-top:10px">
 ${esc(d.summary || d.message || "SEC 공시 기반 분석")}
 </div>
 `;
}

function renderWarrant(data){

 const w=data.warrant || {};

 return `
 <div class="kpi">

  <div class="kpiBox">
   <span>Warrant</span>
   <b>${esc(w.status || "-")}</b>
  </div>

  <div class="kpiBox">
   <span>수량</span>
   <b>${fmt(w.quantity,0)}</b>
  </div>

  <div class="kpiBox">
   <span>행사가</span>
   <b>${money(w.exercisePrice)}</b>
  </div>

 </div>

 <div class="note" style="margin-top:10px">
 ${esc(w.summary || w.message || "")}
 </div>
 `;
}

function renderSEC(data){

 const sec=data.sec || {};
 const filings=sec.filings || sec.recent || [];

 if(!Array.isArray(filings) || !filings.length){
  return `<div class="note">최근 SEC 공시 데이터가 없습니다.</div>`;
 }

 return `
 <div class="scroll">
 <table>
 <thead>
  <tr>
   <th>날짜</th>
   <th>Form</th>
   <th>내용</th>
  </tr>
 </thead>
 <tbody>
 ${filings.slice(0,20).map(f=>`
  <tr>
   <td>${esc(f.date || f.filingDate || "")}</td>
   <td>${esc(f.form || "")}</td>
   <td>
    ${f.url
      ? `<a href="${esc(f.url)}" target="_blank">${esc(f.description || f.primaryDocument || "-")}</a>`
      : esc(f.description || f.primaryDocument || "-")}
   </td>
  </tr>
 `).join("")}
 </tbody>
 </table>
 </div>
 `;
}

function renderFinnhub(data){

 const news=data.news || data.finnhubNews || [];

 if(!Array.isArray(news) || !news.length){
  return `<div class="note">Finnhub 뉴스가 없습니다.</div>`;
 }

 return news.slice(0,15).map(n=>`

 <div class="news">

  <div class="newsTitle">
   ${n.url
    ? `<a href="${esc(n.url)}" target="_blank">${esc(n.headline || n.title || "-")}</a>`
    : esc(n.headline || n.title || "-")}
  </div>

  <div class="newsMeta">
   ${esc(n.source || "Finnhub")}
   · ${dateText(n.datetime || n.date)}
  </div>

  <div class="newsSummary">
   ${esc(n.summary || "")}
  </div>

 </div>

 `).join("");
}

function renderStockTitan(data){

 const st=data.stockTitan || {};
 const overview=st.overview || {};
 const news=st.news || [];

 let html="";

 if(st.status==="error"){
  html+=`
  <div class="errorBox">
   StockTitan 자동 데이터 연결 실패<br><br>
   ${esc(st.message || "")}
  </div>`;
 }

 if(Object.keys(overview).length){

  html+=`
  <div class="kpi">

   <div class="kpiBox">
    <span>Impact</span>
    <b>${esc(overview.impact || "-")}</b>
   </div>

   <div class="kpiBox">
    <span>Sentiment</span>
    <b>${esc(overview.sentiment || "-")}</b>
   </div>

   <div class="kpiBox">
    <span>End Of Day</span>
    <b>${esc(overview.endOfDay || "-")}</b>
   </div>

  </div>
  `;
 }

 if(Array.isArray(news) && news.length){

  html+=news.slice(0,15).map(n=>`

   <div class="news">

    <div class="newsTitle">
     ${n.url
      ? `<a href="${esc(n.url)}" target="_blank">${esc(n.title || "-")}</a>`
      : esc(n.title || "-")}
    </div>

    <div class="newsMeta">
     ${esc(n.date || "")}
     ${n.impact ? " · Impact "+esc(n.impact):""}
     ${n.sentiment ? " · "+esc(n.sentiment):""}
     ${n.endOfDay ? " · EOD "+esc(n.endOfDay):""}
    </div>

    <div class="newsSummary">
     ${esc(n.summary || "")}
    </div>

   </div>

  `).join("");

 }else{

  html+=`
   <div class="note">
    StockTitan 뉴스 자동수집 결과가 없습니다.
   </div>
  `;
 }

 const symbol=data.symbol || $("symbol").value.toUpperCase();

 html+=`
 <div style="margin-top:12px">
  <a href="https://www.stocktitan.net/news/${encodeURIComponent(symbol)}/"
     target="_blank">
   ▶ StockTitan ${esc(symbol)} 공식 뉴스 페이지 열기
  </a>
 </div>
 `;

 return html;
}

function renderDarkFina(data){

 const d=data.darkFina || data.darkpool || {};

 return `
 <div class="kpi">

  <div class="kpiBox">
   <span>상태</span>
   <b>${esc(d.status || "-")}</b>
  </div>

  <div class="kpiBox">
   <span>Dark Pool</span>
   <b>${fmt(d.darkPoolVolume ?? d.volume,0)}</b>
  </div>

  <div class="kpiBox">
   <span>비중</span>
   <b>${pct(d.darkPoolPercent ?? d.percent)}</b>
  </div>

 </div>

 <div class="note" style="margin-top:10px">
 ${esc(d.message || d.summary || "")}
 </div>
 `;
}

function renderHistory(data){

 const tech=data.technicals || data.technicalData || {};
 const rows=Array.isArray(tech.recent)
  ? tech.recent
  : Array.isArray(data.history?.history)
   ? data.history.history
   : [];

 if(!rows.length){
  return `<div class="note">가격 기록이 없습니다.</div>`;
 }

 return `
 <div class="scroll">
 <table>
 <thead>
  <tr>
   <th>날짜</th>
   <th>시가</th>
   <th>고가</th>
   <th>저가</th>
   <th>종가</th>
   <th>거래량</th>
  </tr>
 </thead>

 <tbody>

 ${rows.slice(-30).reverse().map(r=>`
  <tr>
   <td>${esc(r.datetime || r.date || "")}</td>
   <td>${money(r.open)}</td>
   <td>${money(r.high)}</td>
   <td>${money(r.low)}</td>
   <td>${money(r.close)}</td>
   <td>${fmt(r.volume,0)}</td>
  </tr>
 `).join("")}

 </tbody>
 </table>
 </div>
 `;
}

function renderSources(data){

 const list=[
  ["Twelve Data",data.quote || data.history],
  ["Finnhub",data.news],
  ["SEC EDGAR",data.sec],
  ["FINRA",data.finra],
  ["StockTitan",data.stockTitan],
  ["DarkFina",data.darkFina]
 ];

 return `
 <div class="kpi">

 ${list.map(x=>{

  let cls="empty";
  let text="EMPTY";

  if(x[1]?.status==="error"){
   cls="err";
   text="ERROR";
  }
  else if(x[1]){
   cls="ok";
   text="OK";
  }

  return `
   <div class="kpiBox">
    <span>${esc(x[0])}</span>
    <b class="${cls}">${text}</b>
   </div>
  `;

 }).join("")}

 </div>
 `;
}


/* =========================
   INTERACTIVE CANDLE CHART
========================= */

function prepareChart(data){

 let rows=
  (data.history && data.history.history) ||
  data.history ||
  [];

 if(!Array.isArray(rows)) rows=[];

 rows=rows
  .map(r=>({
   date:r.datetime || r.date || r.time || "",
   open:num(r.open),
   high:num(r.high),
   low:num(r.low),
   close:num(r.close),
   volume:num(r.volume)
  }))
  .filter(r=>
   r.date &&
   r.open!==null &&
   r.high!==null &&
   r.low!==null &&
   r.close!==null
  )
  .sort((a,b)=>
   new Date(a.date)-new Date(b.date)
  );

 chartState.rows=rows.slice(-100);

 if(chartState.selected>=chartState.rows.length){
  chartState.selected=chartState.rows.length-1;
 }

 drawChart();

 window.addEventListener("resize",drawChart);

 const canvas=$("chart");

 if(canvas){

  canvas.addEventListener("pointerdown",e=>{
   selectCandle(e);
  });

  canvas.addEventListener("pointermove",e=>{
   if(e.buttons) selectCandle(e);
  });

 }

 updateChartInfo();
}

function selectCandle(e){

 const canvas=$("chart");

 if(!canvas || !chartState.rows.length)return;

 const rect=canvas.getBoundingClientRect();

 const x=e.clientX-rect.left;

 const dpr=window.devicePixelRatio||1;

 const width=canvas.width/dpr;

 const padL=42;
 const padR=12;

 const usable=width-padL-padR;

 const n=chartState.rows.length;

 const step=usable/n;

 let idx=Math.floor((x-padL)/step);

 idx=Math.max(0,Math.min(n-1,idx));

 chartState.selected=idx;

 updateChartInfo();
 drawChart();
}

function updateChartInfo(){

 const box=$("chartInfo");

 if(!box)return;

 const r=chartState.rows[chartState.selected];

 if(!r){

  box.innerHTML=`
   <div><span>날짜</span><b>-</b></div>
   <div><span>OHLC</span><b>-</b></div>
   <div><span>거래량</span><b>-</b></div>
   <div><span>변동</span><b>-</b></div>
  `;

  return;
 }

 const previous=
  chartState.rows[chartState.selected-1];

 let change=null;

 if(previous && previous.close){
  change=(r.close/previous.close-1)*100;
 }

 box.innerHTML=`

 <div>
  <span>날짜</span>
  <b>${esc(r.date)}</b>
 </div>

 <div>
  <span>시/고/저/종</span>
  <b>
   ${fmt(r.open,3)}
   /
   ${fmt(r.high,3)}
   /
   ${fmt(r.low,3)}
   /
   ${fmt(r.close,3)}
  </b>
 </div>

 <div>
  <span>거래량</span>
  <b>${fmt(r.volume,0)}</b>
 </div>

 <div>
  <span>변동</span>
  <b class="${change>0?"up":change<0?"down":"neutral"}">
   ${pct(change)}
  </b>
 </div>

 `;
}

function drawChart(){

 const canvas=$("chart");

 if(!canvas)return;

 const rows=chartState.rows;

 const rect=canvas.getBoundingClientRect();

 const dpr=window.devicePixelRatio||1;

 const W=Math.max(300,rect.width);

 const H=Math.max(250,rect.height);

 canvas.width=W*dpr;
 canvas.height=H*dpr;

 const ctx=canvas.getContext("2d");

 ctx.setTransform(dpr,0,0,dpr,0,0);

 ctx.clearRect(0,0,W,H);

 ctx.fillStyle="#091321";
 ctx.fillRect(0,0,W,H);

 if(!rows.length){

  ctx.fillStyle="#71819f";
  ctx.font="13px sans-serif";
  ctx.fillText("캔들 데이터 없음",20,30);

  return;
 }

 const padL=42;
 const padR=12;
 const padT=18;
 const padB=30;

 const chartW=W-padL-padR;
 const chartH=H-padT-padB;

 let min=Infinity;
 let max=-Infinity;

 rows.forEach(r=>{
  min=Math.min(min,r.low);
  max=Math.max(max,r.high);
 });

 const range=max-min || 1;

 min-=range*.05;
 max+=range*.05;

 function y(v){
  return padT+
   (max-v)/(max-min)*chartH;
 }

 function x(i){
  return padL+
   (i+.5)/rows.length*chartW;
 }

 /* grid */

 ctx.strokeStyle="#17243a";
 ctx.lineWidth=1;

 for(let i=0;i<5;i++){

  const yy=padT+i*chartH/4;

  ctx.beginPath();
  ctx.moveTo(padL,yy);
  ctx.lineTo(W-padR,yy);
  ctx.stroke();

  const val=max-(max-min)*i/4;

  ctx.fillStyle="#60708d";
  ctx.font="9px sans-serif";
  ctx.fillText(
   val.toFixed(2),
   3,
   yy+3
  );
 }

 const step=chartW/rows.length;

 /* candles */

 rows.forEach((r,i)=>{

  const xx=x(i);

  const openY=y(r.open);
  const closeY=y(r.close);
  const highY=y(r.high);
  const lowY=y(r.low);

  const up=r.close>=r.open;

  /* wick */

  ctx.strokeStyle=up?"#48dd98":"#ff657b";
  ctx.lineWidth=1;

  ctx.beginPath();
  ctx.moveTo(xx,highY);
  ctx.lineTo(xx,lowY);
  ctx.stroke();

  /* body */

  const bw=Math.max(2,step*.55);

  ctx.fillStyle=up?"#48dd98":"#ff657b";

  const top=Math.min(openY,closeY);

  const bh=Math.max(
   1,
   Math.abs(closeY-openY)
  );

  ctx.fillRect(
   xx-bw/2,
   top,
   bw,
   bh
  );

 });

 /* selected candle */

 const s=rows[chartState.selected];

 if(s){

  const xx=x(chartState.selected);

  ctx.strokeStyle="#ffc75d";
  ctx.lineWidth=1;

  ctx.beginPath();
  ctx.moveTo(xx,padT);
  ctx.lineTo(xx,H-padB);
  ctx.stroke();

  ctx.fillStyle="#ffc75d";
  ctx.beginPath();
  ctx.arc(xx,y(s.close),3,0,Math.PI*2);
  ctx.fill();
 }

 /* MA20 */

 drawMA(ctx,rows,20,"#63a4ff",x,y);

 /* date labels */

 ctx.fillStyle="#60708d";
 ctx.font="9px sans-serif";

 const labelCount=Math.min(6,rows.length);

 for(let i=0;i<labelCount;i++){

  const idx=Math.floor(
   i*(rows.length-1)/(labelCount-1 || 1)
  );

  const xx=x(idx);

  const d=String(rows[idx].date).slice(5,10);

  ctx.fillText(
   d,
   Math.max(
    padL,
    Math.min(W-32,xx-14)
   ),
   H-10
  );
 }

 /* last price */

 const last=rows[rows.length-1];

 ctx.fillStyle="#dbe6fa";
 ctx.font="bold 10px sans-serif";

 ctx.fillText(
  last.close.toFixed(3),
  W-padR-40,
  y(last.close)-4
 );
}

function drawMA(ctx,rows,period,color,x,y){

 if(rows.length<period)return;

 ctx.strokeStyle=color;
 ctx.lineWidth=1.3;

 ctx.beginPath();

 for(let i=period-1;i<rows.length;i++){

  let sum=0;

  for(let j=i-period+1;j<=i;j++){
   sum+=rows[j].close;
  }

  const ma=sum/period;

  const xx=x(i);
  const yy=y(ma);

  if(i===period-1)ctx.moveTo(xx,yy);
  else ctx.lineTo(xx,yy);
 }

 ctx.stroke();
}

 if(e.key==="Enter")loadStock();
});

loadStock();
