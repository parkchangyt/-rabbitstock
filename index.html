<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RabbitStock AI</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#0b1020;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
.wrap{
  max-width:720px;
  margin:auto;
  padding:18px;
}
h1{
  margin:5px 0 4px;
  font-size:30px;
}
.sub{
  color:#8f9bb3;
  margin-bottom:20px;
}
.card{
  background:#151c30;
  border:1px solid #27314d;
  border-radius:18px;
  padding:18px;
  margin-bottom:14px;
}
.row{
  display:flex;
  gap:10px;
}
input{
  flex:1;
  min-width:0;
  background:#0b1020;
  border:1px solid #34405e;
  color:#fff;
  border-radius:12px;
  padding:14px;
  font-size:17px;
  text-transform:uppercase;
}
button{
  border:0;
  border-radius:12px;
  padding:0 18px;
  background:#4f7cff;
  color:#fff;
  font-size:16px;
  font-weight:700;
}
.symbol{
  font-size:15px;
  color:#8f9bb3;
  margin-bottom:5px;
}
.price{
  font-size:42px;
  font-weight:800;
  margin:4px 0;
}
.change{
  font-size:18px;
  font-weight:700;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:18px;
}
.box{
  background:#0f1527;
  border-radius:12px;
  padding:13px;
}
.label{
  color:#8490aa;
  font-size:12px;
}
.value{
  font-size:17px;
  font-weight:700;
  margin-top:4px;
}
.status{
  color:#8f9bb3;
  font-size:13px;
  margin-top:12px;
}
.error{
  color:#ff7070;
  white-space:pre-wrap;
}
.score{
  font-size:30px;
  font-weight:800;
}
</style>
</head>

<body>

<div class="wrap">

  <h1>🐰 RabbitStock AI</h1>
  <div class="sub">실시간 주가 자동분석</div>

  <div class="card">
    <div class="row">
      <input id="symbol" value="BRNX" placeholder="티커 입력">
      <button onclick="loadStock()">조회</button>
    </div>
    <div id="status" class="status">BRNX 데이터 불러오는 중...</div>
  </div>

  <div class="card">

    <div class="symbol" id="stockSymbol">BRNX</div>

    <div class="price" id="price">-</div>

    <div class="change" id="change">-</div>

    <div class="grid">

      <div class="box">
        <div class="label">시가</div>
        <div class="value" id="open">-</div>
      </div>

      <div class="box">
        <div class="label">전일 종가</div>
        <div class="value" id="previousClose">-</div>
      </div>

      <div class="box">
        <div class="label">고가</div>
        <div class="value" id="high">-</div>
      </div>

      <div class="box">
        <div class="label">저가</div>
        <div class="value" id="low">-</div>
      </div>

      <div class="box">
        <div class="label">거래량</div>
        <div class="value" id="volume">-</div>
      </div>

      <div class="box">
        <div class="label">데이터 출처</div>
        <div class="value" id="source">-</div>
      </div>

    </div>
  </div>

  <div class="card">
    <div class="label">RabbitStock 상승 신호</div>
    <div class="score" id="score">분석 중...</div>
    <div class="status" id="analysis">
      주가 데이터를 기준으로 기본 신호를 계산합니다.
    </div>
  </div>

</div>

<script>

const API =
  "https://rabbitstock-final.keoss.workers.dev";

function money(v){
  if(v === undefined || v === null || v === "" || isNaN(v))
    return "-";

  return "$" + Number(v).toFixed(4);
}

function number(v){
  if(v === undefined || v === null || v === "" || isNaN(v))
    return "-";

  return Number(v).toLocaleString();
}

async function loadStock(){

  const input =
    document.getElementById("symbol");

  const symbol =
    input.value.trim().toUpperCase();

  if(!symbol){
    alert("티커를 입력하세요.");
    return;
  }

  document.getElementById("status").textContent =
    symbol + " 데이터 조회 중...";

  document.getElementById("stockSymbol").textContent =
    symbol;

  document.getElementById("price").textContent =
    "조회중...";

  try{

    const url =
      API + "/quote?symbol=" +
      encodeURIComponent(symbol);

    const res =
      await fetch(url, {
        cache:"no-store"
      });

    const data =
      await res.json();

    console.log(data);

    if(!data.ok){

      document.getElementById("price").textContent =
        "-";

      document.getElementById("status").innerHTML =
        '<span class="error">' +
        (data.error || "데이터 조회 실패") +
        "</span>";

      return;
    }

    document.getElementById("price").textContent =
      money(data.price);

    const change =
      Number(data.change || 0);

    const percent =
      Number(data.percentChange || 0);

    document.getElementById("change").textContent =
      (change >= 0 ? "▲ " : "▼ ") +
      money(Math.abs(change)) +
      " (" +
      (percent >= 0 ? "+" : "") +
      percent.toFixed(2) +
      "%)";

    document.getElementById("open").textContent =
      money(data.open);

    document.getElementById("previousClose").textContent =
      money(data.previousClose);

    document.getElementById("high").textContent =
      money(data.high);

    document.getElementById("low").textContent =
      money(data.low);

    document.getElementById("volume").textContent =
      number(data.volume);

    document.getElementById("source").textContent =
      data.source || "-";

    document.getElementById("status").textContent =
      "● 데이터 연결 정상";

    // 기본 상승 신호
    let score = 50;

    if(percent > 0) score += 20;
    if(percent > 3) score += 10;
    if(percent < 0) score -= 15;
    if(percent < -3) score -= 10;

    score =
      Math.max(0, Math.min(100, score));

    document.getElementById("score").textContent =
      score + " / 100";

    let text =
      "중립";

    if(score >= 70)
      text = "🟢 상승 가능성 강함";

    else if(score >= 55)
      text = "🟡 상승 우위";

    else if(score <= 30)
      text = "🔴 하락 위험";

    else if(score <= 45)
      text = "🟠 하락 우위";

    document.getElementById("analysis").textContent =
      text;

  }catch(error){

    console.error(error);

    document.getElementById("price").textContent =
      "-";

    document.getElementById("status").innerHTML =
      '<span class="error">API 연결 실패\n' +
      error.message +
      "</span>";
  }
}

document
  .getElementById("symbol")
  .addEventListener("keydown", function(e){

    if(e.key === "Enter"){
      loadStock();
    }

  });

loadStock();

</script>

</body>
</html>
