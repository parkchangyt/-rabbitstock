<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RabbitStock Ultimate</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#09101e;
  color:#eef3ff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

.app{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:12px;
}

.header{
  padding:7px 3px 15px;
}

.logo{
  font-size:24px;
  font-weight:950;
  letter-spacing:-.7px;
}

.subtitle{
  margin-top:4px;
  color:#71809a;
  font-size:11px;
}

.search{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}

.search input{
  flex:1;
  min-width:0;
  height:48px;
  padding:0 14px;
  border:1px solid #273752;
  border-radius:13px;
  background:#111b2c;
  color:#fff;
  outline:none;
  font-size:16px;
  font-weight:900;
  text-transform:uppercase;
}

.search button{
  height:48px;
  padding:0 18px;
  border:0;
  border-radius:13px;
  background:#edf3ff;
  color:#09101e;
  font-weight:950;
}

.card{
  background:linear-gradient(145deg,#101a2b,#0b1423);
  border:1px solid #1d2b43;
  border-radius:18px;
  padding:16px;
  margin-bottom:10px;
  box-shadow:0 8px 25px rgba(0,0,0,.16);
}

.hero{
  padding:18px;
}

.heroTop{
  display:flex;
  justify-content:space-between;
  gap:12px;
}

.ticker{
  font-size:30px;
  font-weight:950;
  letter-spacing:-1px;
}

.company{
  margin-top:3px;
  color:#7887a1;
  font-size:11px;
}

.price{
  text-align:right;
  font-size:30px;
  font-weight:950;
  letter-spacing:-1px;
}

.change{
  text-align:right;
  margin-top:3px;
  font-size:13px;
  font-weight:900;
}

.up{color:#43e399}
.down{color:#ff647d}
.neutral{color:#aeb9cc}

.sectionTitle{
  margin-bottom:12px;
  font-size:15px;
  font-weight:950;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.metric{
  padding:12px;
  background:#0c1525;
  border:1px solid #1a2940;
  border-radius:13px;
}

.label{
  color:#74839d;
  font-size:10px;
}

.value{
  margin-top:5px;
  font-size:16px;
  font-weight:900;
}

.judgement{
  margin:3px 0 14px;
  font-size:27px;
  font-weight:950;
}

.scoreRow{
  display:flex;
  justify-content:space-between;
  margin:8px 0 5px;
  color:#8796af;
  font-size:11px;
}

.bar{
  height:8px;
  background:#202c40;
  border-radius:99px;
  overflow:hidden;
}

.buyBar{
  height:100%;
  border-radius:99px;
  background:linear-gradient(90deg,#35d68c,#a4e979);
}

.sellBar{
  height:100%;
  border-radius:99px;
  background:linear-gradient(90deg,#ffad68,#ff5f7b);
}

.reasons{
  margin-top:13px;
  color:#bcc6d8;
  font-size:12px;
  line-height:1.75;
}

.chartBox{
  position:relative;
}

canvas{
  width:100%;
  height:285px;
  display:block;
  border-radius:13px;
  background:#09111f;
}

.chartLegend{
  display:flex;
  justify-content:space-between;
  margin-top:7px;
  color:#66758e;
  font-size:9px;
}

details{
  margin-bottom:9px;
  border:1px solid #1d2b43;
  border-radius:16px;
  background:#101a2b;
  overflow:hidden;
}

summary{
  padding:16px;
  cursor:pointer;
  list-style:none;
  font-size:14px;
  font-weight:950;
}

summary::-webkit-details-marker{
  display:none;
}

.content{
  padding:0 15px 15px;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:10px 0;
  border-bottom:1px solid #1b2940;
  font-size:11px;
}

.row:last-child{
  border-bottom:0;
}

.key{
  color:#7d8ba4;
}

.val{
  text-align:right;
  font-weight:850;
}

.source{
  margin-top:3px;
  color:#566680;
  font-size:9px;
  font-weight:500;
}

.note{
  color:#71809a;
  font-size:10px;
  line-height:1.7;
}

.badge{
  display:inline-block;
  padding:4px 7px;
  border-radius:7px;
  background:#18243a;
  color:#aebbd0;
  font-size:9px;
  font-weight:900;
}

.news{
  padding:12px 0;
  border-bottom:1px solid #1b2940;
}

.news:last-child{
  border-bottom:0;
}

.newsTitle{
  font-size:13px;
  line-height:1.55;
  font-weight:850;
}

.newsTitle a{
  color:#edf3ff;
  text-decoration:none;
}

.newsMeta{
  margin-top:5px;
  color:#6d7c96;
  font-size:9px;
}

.newsAction{
  margin-top:8px;
}

.newsAction a{
  display:inline-block;
  padding:6px 9px;
  border-radius:8px;
  background:#18243a;
  color:#a9caff;
  text-decoration:none;
  font-size:9px;
  font-weight:900;
}

.impact{
  display:inline-block;
  margin-left:5px;
  padding:3px 6px;
  border-radius:6px;
  font-size:8px;
  font-weight:900;
}

.impact.up{
  background:#123529;
}

.impact.down{
  background:#381923;
}

.impact.neutral{
  background:#202a3b;
}

.tableWrap{
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
}

table{
  width:100%;
  min-width:800px;
  border-collapse:collapse;
  font-size:9px;
}

th,td{
  padding:8px 5px;
  border-bottom:1px solid #1a2940;
  white-space:nowrap;
  text-align:right;
}

th:first-child,
td:first-child{
  text-align:left;
}

th{
  color:#71809a;
  font-weight:800;
}

td{
  color:#dce4f1;
}

td.money{
  font-weight:900;
}

.form{
  display:inline-block;
  padding:4px 6px;
  border-radius:6px;
  background:#19253a;
  color:#a9c8ff;
  font-size:9px;
  font-weight:900;
}

.filingImportant{
  border-left:2px solid #ff9f68;
  padding-left:8px;
}

.loading{
  padding:35px 10px;
  text-align:center;
  color:#7887a0;
  line-height:1.8;
}

.error{
  color:#ff6c82;
}

@media(min-width:650px){
  .grid{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:390px){
  .app{padding:9px}
  .ticker{font-size:27px}
  .price{font-size:26px}
  .search button{padding:0 14px}
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="logo">🐇 RabbitStock Ultimate</div>
    <div class="subtitle">
      주가 · 수급 · 공매도 · 다크풀 · 희석 · 워런트 · SEC · 뉴스
    </div>
  </div>

  <div class="search">
    <input
      id="symbol"
      value="BRNX"
      maxlength="12"
      autocomplete="off"
      autocapitalize="characters"
      placeholder="티커 입력"
    >
    <button onclick="analyze()">분석</button>
  </div>

  <div id="appBody">
    <div class="loading">🐇 데이터를 불러오는 중...</div>
  </div>

</div>

<script>

/* =========================================================
   API
========================================================= */

const API =
  "https://rabbitstock-final.keoss.workers.dev";


/* =========================================================
   HELPERS
========================================================= */

function $(id){
  return document.getElementById(id);
}

function esc(v){
  return String(v ?? "")
    .replace(/[&<>"']/g,m=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m]));
}

function num(v,d=2){

  if(
    v===null ||
    v===undefined ||
    v==="" ||
    !Number.isFinite(Number(v))
  ) return "데이터 없음";

  return Number(v).toLocaleString(
    "en-US",
    {
      maximumFractionDigits:d
    }
  );
}

function pct(v,d=2){

  if(
    v===null ||
    v===undefined ||
    v==="" ||
    !Number.isFinite(Number(v))
  ) return "데이터 없음";

  return Number(v).toFixed(d)+"%";
}

function val(o,...keys){

  for(const k of keys){

    if(
      o &&
      o[k]!==undefined &&
      o[k]!==null &&
      o[k]!==""
    ) return o[k];

  }

  return null;
}

function cls(v){

  const n=Number(v);

  if(n>0)return "up";
  if(n<0)return "down";

  return "neutral";
}

function money(v){

  if(
    v===null ||
    v===undefined ||
    !Number.isFinite(Number(v))
  ) return "데이터 없음";

  const n=Number(v);

  if(Math.abs(n)>=1000000000)
    return "$"+(n/1000000000).toFixed(2)+"B";

  if(Math.abs(n)>=1000000)
    return "$"+(n/1000000).toFixed(2)+"M";

  if(Math.abs(n)>=1000)
    return "$"+(n/1000).toFixed(1)+"K";

  return "$"+n.toFixed(2);
}


/* =========================================================
   API
========================================================= */

async function getData(symbol){

  const r=await fetch(
    API+
    "/all?symbol="+
    encodeURIComponent(symbol),
    {
      cache:"no-store"
    }
  );

  if(!r.ok)
    throw new Error(
      "API 오류 "+r.status
    );

  return await r.json();
}


/* =========================================================
   ANALYZE
========================================================= */

async function analyze(){

  const symbol=
    $("symbol")
      .value
      .trim()
      .toUpperCase()
      .replace(/[^A-Z0-9.\-]/g,"");

  if(!symbol)return;

  $("symbol").value=symbol;

  $("appBody").innerHTML=`

    <div class="card">

      <div class="loading">

        🐇 ${esc(symbol)} 분석 중...

        <br>

        주가 · 거래량 · SEC · 뉴스 · 다크풀 데이터를 확인하고 있습니다.

      </div>

    </div>

  `;

  try{

    const data=
      await getData(symbol);

    render(data);

  }catch(e){

    $("appBody").innerHTML=`

      <div class="card">

        <div class="sectionTitle">
          데이터 연결 실패
        </div>

        <div class="error">
          ${esc(e.message)}
        </div>

        <div class="note" style="margin-top:10px">
          Worker 주소 또는 API 설정을 확인하세요.
        </div>

      </div>

    `;

  }

}


/* =========================================================
   METRIC
========================================================= */

function metric(title,value){

  return `

    <div class="metric">

      <div class="label">
        ${esc(title)}
      </div>

      <div class="value">
        ${value===null || value===undefined
          ?"데이터 없음"
          :esc(value)}
      </div>

    </div>

  `;

}


/* =========================================================
   ROW
========================================================= */

function row(k,v,source=""){

  return `

    <div class="row">

      <div class="key">
        ${esc(k)}
      </div>

      <div class="val">

        ${v===null || v===undefined
          ?"데이터 없음"
          :esc(v)}

        ${
          source
          ?
          `<div class="source">${esc(source)}</div>`
          :
          ""
        }

      </div>

    </div>

  `;

}


/* =========================================================
   PRICE HISTORY
   날짜 + 금액 상세
========================================================= */

function priceTable(history){

  if(
    !Array.isArray(history) ||
    !history.length
  ){

    return `
      <div class="note">
        주가 데이터 없음
      </div>
    `;

  }

  const rows=
    history
      .slice(-20)
      .reverse();

  return `

    <div class="tableWrap">

      <table>

        <thead>

          <tr>
            <th>날짜</th>
            <th>시가</th>
            <th>고가</th>
            <th>저가</th>
            <th>종가</th>
            <th>등락</th>
            <th>거래량</th>
            <th>거래대금</th>
          </tr>

        </thead>

        <tbody>

          ${
            rows.map((x,i)=>{

              const close=
                Number(
                  val(x,"close")
                );

              const prev=
                i<rows.length-1
                ?
                Number(
                  val(
                    rows[i+1],
                    "close"
                  )
                )
                :
                NaN;

              const change=
                Number.isFinite(close) &&
                Number.isFinite(prev) &&
                prev!==0
                ?
                (close/prev-1)*100
                :
                null;

              const volume=
                Number(
                  val(x,"volume")
                );

              const amount=
                Number.isFinite(close) &&
                Number.isFinite(volume)
                ?
                close*volume
                :
                null;

              return `

                <tr>

                  <td>
                    ${esc(
                      val(
                        x,
                        "date",
                        "datetime"
                      ) || ""
                    )}
                  </td>

                  <td>
                    ${num(val(x,"open"),4)}
                  </td>

                  <td>
                    ${num(val(x,"high"),4)}
                  </td>

                  <td>
                    ${num(val(x,"low"),4)}
                  </td>

                  <td>
                    <b>${num(close,4)}</b>
                  </td>

                  <td class="${cls(change)}">

                    ${
                      change===null
                      ?
                      "데이터 없음"
                      :
                      (
                        change>0
                        ?
                        "+"
                        :
                        ""
                      )+
                      change.toFixed(2)+
                      "%"
                    }

                  </td>

                  <td>
                    ${num(volume,0)}
                  </td>

                  <td class="money">
                    ${money(amount)}
                  </td>

                </tr>

              `;

            }).join("")
          }

        </tbody>

      </table>

    </div>

    <div class="note" style="margin-top:10px">

      거래대금 = 종가 × 거래량으로 계산한 참고값입니다.
      실제 체결별 거래대금과는 차이가 있을 수 있습니다.

    </div>

  `;

}


/* =========================================================
   SEC LINK
========================================================= */

function secLink(filing,cik){

  if(
    !cik ||
    !filing?.accession ||
    !filing?.document
  ) return null;

  const acc=
    String(
      filing.accession
    ).replace(/-/g,"");

  return (
    "https://www.sec.gov/Archives/edgar/data/"+
    String(Number(cik))+
    "/"+
    acc+
    "/"+
    filing.document
  );

}


/* =========================================================
   SEC FILINGS
========================================================= */

function secHTML(sec){

  const filings=
    Array.isArray(sec?.filings)
    ?
    sec.filings.slice(0,60)
    :
    [];

  if(!filings.length){

    return `
      <div class="note">
        SEC 공시 데이터 없음
      </div>
    `;

  }

  return filings.map(f=>{

    const form=
      String(f.form||"");

    const description=
      f.description||
      "SEC 공시";

    const important=
      /S-1|S-3|F-1|F-3|424B|8-K|ATM|Warrant|Convertible|Preferred|Offering|Resale/i
      .test(
        form+" "+description
      );

    const link=
      secLink(
        f,
        sec.cik
      );

    return `

      <div
        class="news ${
          important
          ?
          "filingImportant"
          :
          ""
        }"
      >

        <div class="newsTitle">

          <span class="form">
            ${esc(form)}
          </span>

          ${important
            ? `<span class="impact down">중요</span>`
            : ""}

        </div>

        <div class="newsMeta">

          ${esc(f.filed||"날짜 없음")}

          ·

          ${esc(description)}

        </div>

        ${
          link
          ?
          `
            <div class="newsAction">

              <a
                href="${esc(link)}"
                target="_blank"
                rel="noopener"
              >
                📖 SEC 원문 읽기
              </a>

            </div>
          `
          :
          ""
        }

      </div>

    `;

  }).join("");

}


/* =========================================================
   SEC DILUTION
========================================================= */

function dilutionHTML(d){

  const arr=
    Array.isArray(d?.filings)
    ?
    d.filings
    :
    [];

  if(!arr.length){

    return `
      <div class="note">
        희석 관련 SEC 공시 없음
      </div>
    `;

  }

  return arr.slice(0,30).map(f=>{

    const link=
      secLink(
        f,
        d?.cik
      );

    return `

      <div class="news">

        <div class="newsTitle">

          <span class="form">
            ${esc(f.form||"SEC")}
          </span>

          ${esc(f.filed||"")}

        </div>

        <div class="newsMeta">

          ${esc(
            f.description||
            "희석 관련 공시"
          )}

        </div>

        ${
          link
          ?
          `
            <div class="newsAction">

              <a
                href="${esc(link)}"
                target="_blank"
                rel="noopener"
              >
                📖 공시 원문 읽기
              </a>

            </div>
          `
          :
          ""
        }

      </div>

    `;

  }).join("");

}


/* =========================================================
   WARRANT
========================================================= */

function warrantHTML(d){

  const arr=
    Array.isArray(d?.filings)
    ?
    d.filings
    :
    [];

  if(!arr.length){

    return `
      <div class="note">
        워런트 / 전환 관련 SEC 공시 없음
      </div>
    `;

  }

  return arr.slice(0,30).map(f=>{

    const link=
      secLink(
        f,
        d?.cik
      );

    return `

      <div class="news">

        <div class="newsTitle">

          <span class="form">
            ${esc(f.form||"SEC")}
          </span>

          ${esc(f.filed||"")}

        </div>

        <div class="newsMeta">

          ${esc(
            f.description||
            "워런트 / 전환 관련 공시"
          )}

        </div>

        ${
          link
          ?
          `
            <div class="newsAction">

              <a
                href="${esc(link)}"
                target="_blank"
                rel="noopener"
              >
                🎫 원문 읽기
              </a>

            </div>
          `
          :
          ""
        }

      </div>

    `;

  }).join("");

}


/* =========================================================
   NEWS
========================================================= */

function newsHTML(news){

  if(
    !Array.isArray(news) ||
    !news.length
  ){

    return `
      <div class="note">
        뉴스 데이터 없음
      </div>
    `;

  }

  return news.slice(0,30).map(n=>{

    const title=
      val(
        n,
        "headline",
        "title",
        "description"
      ) ||
      "제목 없음";

    const url=
      val(
        n,
        "url",
        "link"
      );

    const source=
      val(
        n,
        "source",
        "publisher"
      ) ||
      "";

    const date=
      val(
        n,
        "datetime",
        "date",
        "published_at",
        "publishedAt"
      ) ||
      "";

    const text=
      String(title);

    let signal="중립";

    if(
      /approval|approved|contract|order|partnership|acquisition|positive|upgrade|deal|revenue|profit|launch/i
      .test(text)
    ){
      signal="호재";
    }

    if(
      /offering|dilution|resale|warrant|convertible|investigation|loss|bankruptcy|warning|delisting|reverse split/i
      .test(text)
    ){
      signal="악재";
    }

    const signalClass=
      signal==="호재"
      ?
      "up"
      :
      signal==="악재"
      ?
      "down"
      :
      "neutral";

    return `

      <div class="news">

        <div class="newsTitle">

          ${esc(title)}

          <span class="impact ${signalClass}">
            ${signal}
          </span>

        </div>

        <div class="newsMeta">

          ${esc(date)}

          ${source
            ?
            " · "+esc(source)
            :
            ""}

        </div>

        ${
          url
          ?
          `
            <div class="newsAction">

              <a
                href="${esc(url)}"
                target="_blank"
                rel="noopener"
              >
                📰 뉴스 원문 읽기
              </a>

            </div>
          `
          :
          ""
        }

      </div>

    `;

  }).join("");

}


/* =========================================================
   STOCK TITAN
========================================================= */

function stockTitanHTML(st){

  const arr=
    Array.isArray(st?.items)
    ?
    st.items
    :
    [];

  if(!arr.length){

    return `
      <div class="note">
        StockTitan 데이터 없음
      </div>
    `;

  }

  return arr.slice(0,30).map(n=>{

    const title=
      val(
        n,
        "title",
        "headline"
      ) ||

/* =========================================================
   CHART
   기존 스타일 유지
========================================================= */

function drawChart(history){

  const canvas=
    document.getElementById("priceChart");

  if(
    !canvas ||
    !Array.isArray(history) ||
    !history.length
  ) return;

  const width=
    canvas.clientWidth ||
    350;

  const height=285;

  const dpr=
    window.devicePixelRatio||1;

  canvas.width=
    width*dpr;

  canvas.height=
    height*dpr;

  const ctx=
    canvas.getContext("2d");

  ctx.scale(dpr,dpr);

  const data=
    history
      .map(x=>({
        date:
          val(
            x,
            "date",
            "datetime"
          ),
        close:
          Number(
            val(
              x,
              "close"
            )
          )
      }))
      .filter(
        x=>Number.isFinite(x.close)
      )
      .slice(-90);

  if(!data.length)return;

  let min=
    Math.min(
      ...data.map(x=>x.close)
    );

  let max=
    Math.max(
      ...data.map(x=>x.close)
    );

  if(min===max){
    min-=1;
    max+=1;
  }

  const L=48;
  const R=12;
  const T=18;
  const B=31;

  const W=
    width-L-R;

  const H=
    height-T-B;

  ctx.clearRect(
    0,
    0,
    width,
    height
  );

  /* GRID */

  ctx.strokeStyle="#24334b";
  ctx.lineWidth=1;

  for(let i=0;i<4;i++){

    const y=
      T+
      H*i/3;

    ctx.beginPath();

    ctx.moveTo(
      L,
      y
    );

    ctx.lineTo(
      width-R,
      y
    );

    ctx.stroke();

  }

  /* LABEL */

  ctx.fillStyle="#73829b";
  ctx.font="10px sans-serif";

  ctx.fillText(
    num(max,4),
    4,
    T+4
  );

  ctx.fillText(
    num(min,4),
    4,
    T+H
  );

  /* LINE */

  ctx.strokeStyle="#63a8ff";
  ctx.lineWidth=2;
  ctx.beginPath();

  data.forEach((p,i)=>{

    const x=
      L+
      W*
      i/
      Math.max(
        1,
        data.length-1
      );

    const y=
      T+
      (
        (max-p.close)/
        (max-min)
      )*
      H;

    if(i===0)
      ctx.moveTo(x,y);
    else
      ctx.lineTo(x,y);

  });

  ctx.stroke();

  /* LAST POINT */

  const last=
    data[data.length-1];

  const lx=
    L+W;

  const ly=
    T+
    (
      (max-last.close)/
      (max-min)
    )*
    H;

  ctx.fillStyle="#eef3ff";

  ctx.beginPath();

  ctx.arc(
    lx,
    ly,
    3,
    0,
    Math.PI*2
  );

  ctx.fill();

}
