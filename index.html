a{color:#6ea8ff;text-decoration:none}

<body>
<div class="wrap">

<h1>🐰 RabbitStock Ultimate</h1>
<div class="sub">
실제 주가 · 캔들 · 공매도 · REG SHO · 희석 · 워런트 · SEC · StockTitan

<script>

const API="https://rabbitstock-final.keoss.workers.dev";

let history=[];
let canvas;
let ctx;
let visible=[];
const DPR=window.devicePixelRatio||1;

function n(v){
 if(v===null||v===undefined||v==="")return null;
 let x=Number(v);
 return Number.isFinite(x)?x:null;
}

function money(v){
 v=n(v);
 if(v===null)return "데이터 없음";
 return "$"+v.toLocaleString(undefined,{
  minimumFractionDigits:2,
  maximumFractionDigits:4
 });
}

function integer(v){
 v=n(v);
 if(v===null)return "데이터 없음";
 return v.toLocaleString();
}

function percent(v){
 v=n(v);
 if(v===null)return "데이터 없음";
 return (v>=0?"+":"")+v.toFixed(2)+"%";
}

function date(v){
 if(!v)return "데이터 없음";
 return String(v).slice(0,10);
}

function esc(v){
 return String(v??"데이터 없음")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;");
}

function obj(d,...keys){
 for(const k of keys){
  if(d && d[k] && typeof d[k]==="object")
   return d[k];
 }
 return {};
}

function val(d,...keys){
 for(const k of keys){
  if(d && d[k]!==undefined && d[k]!==null)
   return d[k];
 }
 return null;
}

function normalizeHistory(raw){

 if(!Array.isArray(raw))return [];

 return raw.map(x=>({
  date:x.date||x.datetime||x.time,
  open:n(x.open),
  high:n(x.high),
  low:n(x.low),
  close:n(x.close??x.price),
  volume:n(x.volume)
 })).filter(x=>
  x.date!==undefined &&
  x.open!==null &&
  x.high!==null &&
  x.low!==null &&
  x.close!==null
 );
}

function MA(data,len){

 return data.map((x,i)=>{

  if(i<len-1)return null;

  let a=data.slice(i-len+1,i+1)
   .map(x=>x.close)
   .filter(x=>x!==null);

  if(a.length<len)return null;

  return a.reduce((a,b)=>a+b,0)/a.length;
 });
}

function VWAP(data){

 let pv=0;
 let vol=0;

 return data.map(x=>{

  if(x.close===null||x.volume===null)return null;

  pv+=x.close*x.volume;
  vol+=x.volume;

  return vol?pv/vol:null;
 });
}

function metric(title,value,desc){

 return `
 <div class="metric">
  <span>${esc(title)}</span>
  <b>${value}</b>
  <span>${esc(desc)}</span>
 </div>
 `;
}

function renderKV(data){

 if(!data||typeof data!=="object")
  return `<div class="small">데이터 없음</div>`;

 let rows=[];

 for(const [k,v] of Object.entries(data)){

  if(v===null||v===undefined||v==="")continue;
  if(typeof v==="object")continue;

  rows.push(`
   <div class="reason">
    <span class="muted">${esc(k)}</span><br>
    <b>${esc(
      typeof v==="number"
      ?v.toLocaleString()
      :v
    )}</b>
   </div>
  `);
 }

 return rows.length
 ?rows.join("")
 :`<div class="small">데이터 없음</div>`;
}

function draw(){

 if(!canvas||!history.length)return;

 const W=canvas.clientWidth;
 const H=canvas.clientHeight;

 canvas.width=W*DPR;
 canvas.height=H*DPR;

 ctx=canvas.getContext("2d");
 ctx.setTransform(DPR,0,0,DPR,0,0);

 ctx.clearRect(0,0,W,H);

 visible=history.slice(-80);

 const L=43;
 const R=10;
 const T=15;
 const B=40;

 const volumeTop=H*0.73;
 const priceHeight=volumeTop-10;

 let hi=Math.max(...visible.map(x=>x.high));
 let lo=Math.min(...visible.map(x=>x.low));

 let range=hi-lo||1;

 hi+=range*.05;
 lo-=range*.05;

 const step=(W-L-R)/visible.length;
 const body=Math.max(3,step*.55);

 function y(p){
  return T+(hi-p)/(hi-lo)*(priceHeight-T);
 }

 ctx.strokeStyle="#172237";
 ctx.lineWidth=1;

 for(let i=0;i<5;i++){

  let yy=T+(priceHeight-T)*i/4;

  ctx.beginPath();
  ctx.moveTo(L,yy);
  ctx.lineTo(W-R,yy);
  ctx.stroke();

  let p=hi-(hi-lo)*i/4;

  ctx.fillStyle="#66738b";
  ctx.font="10px sans-serif";
  ctx.textAlign="right";
  ctx.fillText(p.toFixed(2),L-5,yy+3);
 }

 let vmax=Math.max(...visible.map(x=>x.volume||0),1);

 visible.forEach((x,i)=>{

  let xx=L+i*step+step/2;

  let vh=((x.volume||0)/vmax)*(H-volumeTop-B);

  ctx.fillStyle="#283750";

  ctx.fillRect(
   xx-body/2,
   H-B-vh,
   body,
   vh
  );
 });

 visible.forEach((x,i)=>{

  let xx=L+i*step+step/2;

  let yo=y(x.open);
  let yh=y(x.high);
  let yl=y(x.low);
  let yc=y(x.close);

  let rising=x.close>=x.open;

  ctx.strokeStyle=rising?"#ff5964":"#55a5ff";
  ctx.fillStyle=rising?"#ff5964":"#55a5ff";

  ctx.beginPath();
  ctx.moveTo(xx,yh);
  ctx.lineTo(xx,yl);
  ctx.stroke();

  let top=Math.min(yo,yc);
  let bottom=Math.max(yo,yc);

  ctx.fillRect(
   xx-body/2,
   top,
   body,
   Math.max(1,bottom-top)
  );
 });

 ctx.strokeStyle="#27344b";

 ctx.beginPath();
 ctx.moveTo(L,volumeTop);
 ctx.lineTo(W-R,volumeTop);
 ctx.stroke();

 ctx.fillStyle="#66738b";
 ctx.font="10px sans-serif";
 ctx.textAlign="center";

 [0,Math.floor(visible.length/2),visible.length-1]
 .forEach(i=>{
  if(visible[i])
   ctx.fillText(
    date(visible[i].date),
    L+i*step+step/2,
    H-14
   );
 });
}

function showTip(clientX,clientY){

 if(!canvas)return;

 let r=canvas.getBoundingClientRect();

 let x=clientX-r.left;

 const L=43;
 const R=10;

 const step=(canvas.clientWidth-L-R)/visible.length;

 let i=Math.round((x-L-step/2)/step);

 i=Math.max(0,Math.min(i,visible.length-1));

 let d=visible[i];

 if(!d)return;

 let previous=visible[i-1];

 let ch=previous
 ?(d.close/previous.close-1)*100
 :null;

 let tip=document.getElementById("tip");

 tip.style.display="block";

 tip.style.left=Math.min(
  Math.max(5,x+8),
  canvas.clientWidth-195
 )+"px";

 tip.style.top=Math.min(
  Math.max(5,clientY-r.top-70),
  canvas.clientHeight-145
 )+"px";

 tip.innerHTML=`
 <b>${esc(date(d.date))}</b><br>
 시가 ${money(d.open)}<br>
 고가 ${money(d.high)}<br>
 저가 ${money(d.low)}<br>
 종가 <b>${money(d.close)}</b><br>
 거래량 ${integer(d.volume)}<br>
 거래대금 ${
  d.volume!==null
  ?money(d.close*d.volume)
  :"데이터 없음"
 }<br>
 등락 ${percent(ch)}
 `;
}

function setupChart(){

 canvas=document.getElementById("chartCanvas");

 if(!canvas)return;

 draw();

 canvas.onclick=e=>{
  showTip(e.clientX,e.clientY);
 };

 canvas.ontouchstart=e=>{
  let t=e.touches[0];
  showTip(t.clientX,t.clientY);
 };

 canvas.ontouchmove=e=>{
  let t=e.touches[0];
  showTip(t.clientX,t.clientY);
 };
}

function analyze(d){

 const q=obj(d,"quote");

 const technical=obj(d,"technical","technicals");

 const price=n(
  val(q,"price","close","current")
 );

 const ma20=n(
  val(technical,"ma20","MA20")
 );

 const ma50=n(
  val(technical,"ma50","MA50")
 );

 const rsi=n(
  val(technical,"rsi","RSI")
 );

 let reasons=[];
 let plus=0;
 let minus=0;

 if(price!==null&&ma20!==null){

  if(price>=ma20){
   plus++;
   reasons.push("주가가 MA20 위 → 단기 추세 긍정");
  }else{
   minus++;
   reasons.push("주가가 MA20 아래 → 단기 추세 약세");
  }
 }

 if(price!==null&&ma50!==null){

  if(price>=ma50){
   plus++;
   reasons.push("주가가 MA50 위 → 중기 추세 긍정");
  }else{
   minus++;
   reasons.push("주가가 MA50 아래 → 중기 추세 약세");
  }
 }

 if(rsi!==null){

  if(rsi>=70){
   minus++;
   reasons.push("RSI 70 이상 → 단기 과열 가능성");
  }else if(rsi<=30){
   plus++;
   reasons.push("RSI 30 이하 → 과매도 반등 가능성");
  }
 }

 const short=obj(d,"short","finra");

 if(val(short,"shortInterest","short_interest")!==null)
  reasons.push("실제 Short Interest 데이터 반영");

 const dilution=obj(d,"dilution");

 if(Object.keys(dilution).length)
  reasons.push("SEC 희석 관련 데이터를 종합판단에 반영");

 const score=Math.max(
  0,
  Math.min(
   100,
   50+(plus-minus)*10
  )
 );

 let label=
  score>=75?"강한 긍정":
  score>=60?"긍정":
  score>=45?"중립":
  score>=30?"주의":"부정";

 return {score,label,reasons};
}

function render(symbol,d){

 const q=obj(d,"quote");

 const technical=obj(d,"technical","technicals");

 const price=n(val(q,"price","close","current"));
 const change=n(val(q,"change_percent","percent_change","changePercent"));

 history=normalizeHistory(
  val(d,"history","prices","timeSeries")||[]
 );

 const ma20=n(val(technical,"ma20","MA20"))
   ??MA(history,20).at(-1);

 const ma50=n(val(technical,"ma50","MA50"))
   ??MA(history,50).at(-1);

 const rsi=n(val(technical,"rsi","RSI"));

 const vwap=n(val(technical,"vwap","VWAP"))
   ??VWAP(history).at(-1);

 const short=obj(d,"short","finra");
 const reg=obj(d,"regsho","threshold");
 const dilution=obj(d,"dilution");
 const warrants=obj(d,"warrants","warrant");

 const sec=Array.isArray(val(d,"sec","filings"))
  ?val(d,"sec","filings")
  :[];

 const news=Array.isArray(val(d,"news"))
  ?val(d,"news")
  :[];

 const stocktitan=obj(d,"stocktitan","stockTitan");

 const stockTitanNews=
  Array.isArray(stocktitan.items)
  ?stocktitan.items
  :Array.isArray(stocktitan.news)
  ?stocktitan.news
  :[];

 const result=analyze(d);

 document.getElementById("app").innerHTML=`

 <div class="card">

  <div class="muted">${esc(symbol)}</div>

  <div class="price">${money(price)}</div>

  <div class="${change!==null&&change>=0?"up":"down"}">
   ${percent(change)}
  </div>

  <div class="grid">

   ${metric(
    "거래량",
    integer(val(q,"volume")),
    "실제 거래량"
   )}

   ${metric(
    "MA20",
    money(ma20),
    "20거래일 평균"
   )}

   ${metric(
    "MA50",
    money(ma50),
    "50거래일 평균"
   )}

   ${metric(
    "RSI",
    rsi===null?"데이터 없음":rsi.toFixed(1),
    "0~100 상승·하락 강도"
   )}

  </div>

 </div>


 <div class="card judgeBox">

  <div class="muted">🎯 종합판단</div>

  <div class="judge">${result.label}</div>

  <div class="score">
   ${result.score}
   <span style="font-size:16px">/100</span>
  </div>

  ${result.reasons.map(x=>`
   <div class="reason">${esc(x)}</div>
  `).join("")}

 </div>


 <div class="card">

  <b>🕯️ 실제 주가 캔들차트</b>

  <div class="small" style="margin:6px 0 10px">
   캔들을 터치하면 날짜·OHLC·거래량·거래대금 표시
  </div>

  <div class="chart">

   <canvas id="chartCanvas"></canvas>

   <div id="tip" class="tip"></div>

  </div>

  <div class="small" style="margin-top:8px">
   🔴 상승　🔵 하락　│ 아래쪽 = 거래량
  </div>

 </div>


 <div class="card">

  <div class="grid">

   ${metric(
    "VWAP",
    money(vwap),
    "거래량 가중 평균가격"
   )}

   ${metric(
    "거래대금",
    history.length
    ?money(
      history.at(-1).close*
      (history.at(-1).volume||0)
    )
    :"데이터 없음",
    "종가 × 거래량 참고값"
   )}

  </div>

 </div>


 <details>
 <summary>🔥 공매도 / Short Interest</summary>
 <div class="detail">

  <div class="reason">
   <b>Short Interest</b><br>
   <span class="small">
   공매도 잔고. 정해진 보고 시점의 공매도 포지션을 의미하며
   실시간 공매도 거래량과는 다름.
   </span>
  </div>

  ${renderKV(short)}

 </div>
 </details>


 <details>
 <summary>🚨 REG SHO / Threshold</summary>

 <div class="detail">

  <div class="reason">
   <b>Reg SHO</b><br>
   <span class="small">
   미국 SEC의 공매도 규정.
   Threshold 등재는 일정 수준의 FTD가 누적된 종목이라는 의미이며,
   그 자체가 불법 공매도나 상승 신호를 의미하지 않음.
   </span>
  </div>

  ${renderKV(reg)}

 </div>
 </details>


 <details>
 <summary>💵 희석 / 실제 주식수</summary>
 <div class="detail">

  ${renderKV(dilution)}

 </div>
 </details>


 <details>
 <summary>🎫 워런트 / 전환</summary>
 <div class="detail">

  ${renderKV(warrants)}

 </div>
 </details>


 <details>
 <summary>📑 SEC 공시 · ${sec.length}건</summary>

 <div class="detail">

 ${
 sec.length
 ?sec.slice(0,60).map(x=>`

  <div class="reason">

   <b>
   ${esc(
    x.form||
    x.title||
    "SEC Filing"
   )}
   </b>

   <br>

   <span class="small">
   ${esc(
    x.date||
    x.filingDate||
    ""
   )}
   </span>

   <br><br>

   ${esc(
    x.summary||
    x.description||
    x.title||
    "공시 내용 없음"
   )}

   ${
    x.url||x.link
    ?`
    <br><br>
    <a href="${esc(x.url||x.link)}"
       target="_blank">
       원문 읽기 ↗
    </a>
    `:""
   }

  </div>

 `).join("")
 :`<div class="small">SEC 공시 데이터 없음</div>`
 }

 </div>
 </details>


 <details>
 <summary>📰 StockTitan 뉴스 · ${stockTitanNews.length}건</summary>

 <div class="detail">

 ${
 stockTitanNews.length
 ?stockTitanNews.slice(0,30).map(x=>`

  <div class="reason">

   <b>
   ${esc(
    x.title||
    x.headline||
    "StockTitan 뉴스"
   )}
   </b>

   <br>

   <span class="small">
   ${esc(
    x.date||
    x.datetime||
    x.published||
    ""
   )}
   </span>

   <br><br>

   ${esc(
    x.summary||
    x.ai_summary||
    x.description||
    ""
   )}

   ${
    x.sentiment
    ?`
    <br>
    <span class="badge">
    ${esc(x.sentiment)}
    </span>
    `:""
   }

   ${
    x.impact
    ?`
    <span class="badge">
    영향도 ${esc(x.impact)}
    </span>
    `:""
   }

   ${
    x.url||x.link
    ?`
    <br><br>
    <a href="${esc(x.url||x.link)}"
       target="_blank">
       StockTitan 원문 읽기 ↗
    </a>
    `:""
   }

  </div>

 `).join("")
 :`
 <div class="small">
 StockTitan 데이터 없음
 </div>
 `
 }

 </div>
 </details>


 <details>
 <summary>📰 기타 뉴스 · ${news.length}건</summary>

 <div class="detail">

 ${
 news.length
 ?news.slice(0,30).map(x=>`

  <div class="reason">

   <b>
   ${esc(
    x.title||
    x.headline||
    "뉴스"
   )}
   </b>

   <br>

   <span class="small">
   ${esc(
    x.date||
    x.datetime||
    x.published||
    ""
   )}
   </span>

   <br><br>

   ${esc(
    x.summary||
    x.description||
    ""
   )}

   ${
    x.url||x.link
    ?`
    <br><br>
    <a href="${esc(x.url||x.link)}"
       target="_blank">
       원문 읽기 ↗
    </a>
    `:""
   }

  </div>

 `).join("")
 :`<div class="small">뉴스 데이터 없음</div>`
 }

 </div>
 </details>


 <details>
 <summary>📅 최근 ${Math.min(20,history.length)}거래일</summary>

 <div class="detail" style="overflow-x:auto">

 ${
 history.length
 ?`
 <table>

 <thead>
 <tr>
  <th>날짜</th>
  <th>시가</th>
  <th>고가</th>
  <th>저가</th>
  <th>종가</th>
  <th>거래량</th>
  <th>등락</th>
 </tr>
 </thead>

 <tbody>

 ${
 history.slice(-20).reverse().map((x,i,arr)=>{

  let prev=
   history[
    history.length-2-i
   ];

  let ch=prev
   ?(x.close/prev.close-1)*100
   :null;

  return `
  <tr>
   <td>${esc(date(x.date))}</td>
   <td>${money(x.open)}</td>
   <td>${money(x.high)}</td>
   <td>${money(x.low)}</td>
   <td><b>${money(x.close)}</b></td>
   <td>${integer(x.volume)}</td>
   <td class="${ch!==null&&ch>=0?"up":"down"}">
    ${percent(ch)}
   </td>
  </tr>
  `;

 }).join("")
 }

 </tbody>
 </table>
 `
 :`<div class="small">주가 데이터 없음</div>`
 }

 </div>
 </details>

 `;

 setTimeout(setupChart,50);
}

async function load(){

 let symbol=document
  .getElementById("symbol")
  .value
  .trim()
  .toUpperCase();

 if(!symbol)return;

 document.getElementById("app").innerHTML=
 `<div class="loading">${esc(symbol)} 분석 중...</div>`;

 try{

  const response=await fetch(
   API+
   "/all?symbol="+
   encodeURIComponent(symbol)
  );

  if(!response.ok)
   throw new Error(
    "API 오류: "+response.status
   );

  const data=await response.json();

  render(symbol,data);

 }catch(e){

  document.getElementById("app").innerHTML=`

   <div class="card error">

    데이터 연결 실패<br><br>

    ${esc(e.message)}<br><br>

    Worker:
    ${esc(API)}

   </div>

  `;
 }
}

window.addEventListener("resize",()=>{
 if(history.length)
  setTimeout(draw,100);
});

load();

</script>

</body>
</html>
