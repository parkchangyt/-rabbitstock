<div class="app">

  <div class="header">
    <div class="logo">🐇 RabbitStock Ultimate</div>

    <div class="subtitle">

  <div class="search">

    <input
      id="symbol"

      maxlength="12"

    >

    <button onclick="analyze()">
      분석

<script>

/* =========================================================
   RabbitStock API
========================================================= */

const API =
  "https://rabbitstock-final.keoss.workers.dev";


/* =========================================================
   기본 함수
========================================================= */

function $(id){
  return document.getElementById(id);
}


function esc(value){

  return String(value ?? "")
    .replace(/[&<>"']/g,function(m){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"

      }[m];

    });

}


function number(value,digits=2){

  if(
    value === null ||
    value === undefined ||
    value === "" ||
    !Number.isFinite(Number(value))
  ){

    return "데이터 없음";

  }

  return Number(value).toLocaleString(
    "en-US",
    {
      maximumFractionDigits:digits
    }
  );

}


function percent(value){

  if(
    value === null ||
    value === undefined ||
    value === "" ||
    !Number.isFinite(Number(value))
  ){

    return "데이터 없음";

  }

  return Number(value).toFixed(2)+"%";

}


function get(obj,...keys){

  for(const key of keys){

    if(
      obj &&
      obj[key] !== undefined &&
      obj[key] !== null &&
      obj[key] !== ""
    ){

      return obj[key];

    }

  }

  return null;

}


function display(value,digits=2){

  if(
    value === null ||
    value === undefined ||
    value === ""
  ){

    return "데이터 없음";

  }

  if(
    typeof value === "number"
  ){

    return number(value,digits);

  }

  return esc(value);

}


function changeClass(value){

  const n=Number(value);

  if(n>0)return "up";

  if(n<0)return "down";

  return "neutral";

}


/* =========================================================
   API
========================================================= */

async function api(path,symbol){

  const url =
    API +
    path +
    "?symbol=" +
    encodeURIComponent(symbol);

  const response =
    await fetch(
      url,
      {
        cache:"no-store"
      }
    );

  if(!response.ok){

    throw new Error(
      "API 오류 "+response.status
    );

  }

  return await response.json();

}


/* =========================================================
   분석
========================================================= */

async function analyze(){

  const symbol =
    $("symbol")
      .value
      .trim()
      .toUpperCase()
      .replace(/[^A-Z0-9.\-]/g,"");

  if(!symbol){

    return;

  }

  $("symbol").value=symbol;

  $("app").innerHTML=`

    <div class="card">
      <div class="status">
        🐇 ${esc(symbol)} 데이터 수집 중...
        <br><br>
        주가 · SEC · 뉴스 · 다크풀 데이터를 확인하고 있습니다.
      </div>
    </div>

  `;

  try{

    const data =
      await api(
        "/all",
        symbol
      );

    render(data);

  }catch(error){

    $("app").innerHTML=`

      <div class="card">

        <div class="sectionTitle">
          데이터 요청 실패
        </div>

        <div class="error">
          ${esc(error.message)}
        </div>

        <div class="note" style="margin-top:10px">
          Worker 주소와 API 키 설정을 확인하세요.
        </div>

      </div>

    `;

  }

}


/* =========================================================
   Metric
========================================================= */

function metric(title,value){

  return `

    <div class="metric">

      <div class="label">
        ${esc(title)}
      </div>

      <div class="value">
        ${display(value)}
      </div>

    </div>

  `;

}


/* =========================================================
   Row
========================================================= */

function row(key,value,source=""){

  return `

    <div class="row">

      <div class="key">
        ${esc(key)}
      </div>

      <div class="val">

        ${display(value)}

        ${
          source
          ?
          `<div class="source">
             ${esc(source)}
           </div>`
          :
          ""
        }

      </div>

    </div>

  `;

}


/* =========================================================
   뉴스
========================================================= */

function makeNews(news){

  if(!Array.isArray(news) || !news.length){

    return `
      <div class="note">
        뉴스 데이터 없음
      </div>
    `;

  }

  return news
    .slice(0,30)
    .map(function(item){

      const title =
        get(
          item,
          "headline",
          "title",
          "description"
        ) || "제목 없음";

      const date =
        get(
          item,
          "datetime",
          "date",
          "published_at",
          "publishedAt"
        ) || "";

      const source =
        get(
          item,
          "source",
          "publisher"
        ) || "";

      const url =
        get(
          item,
          "url",
          "link"
        );

      return `

        <div class="news">

          <div class="newsTitle">

            ${
              url
              ?
              `<a
                 href="${esc(url)}"
                 target="_blank"
                 rel="noopener"
               >
                 ${esc(title)}
               </a>`
              :
              esc(title)
            }

          </div>

          <div class="newsMeta">

            ${esc(date)}
            ${source?" · "+esc(source):""}

          </div>

        </div>

      `;

    })
    .join("");

}


/* =========================================================
   StockTitan
========================================================= */

function makeStockTitan(data){

  const items =
    data?.items ||
    data?.news ||
    [];

  if(!Array.isArray(items)||!items.length){

    return `
      <div class="note">
        StockTitan 뉴스 데이터 없음
      </div>
    `;

  }

  return items
    .slice(0,30)
    .map(function(item){

      const title =
        get(
          item,
          "title",
          "headline"
        ) || "제목 없음";

      const url =
        get(
          item,
          "url",
          "link"
        );

      return `

        <div class="news">

          <div class="newsTitle">

            ${
              url
              ?
              `<a
                 href="${esc(url)}"
                 target="_blank"
                 rel="noopener"
               >
                 ${esc(title)}
               </a>`
              :
              esc(title)
            }

          </div>

          <div class="newsMeta">
            StockTitan
          </div>

        </div>

      `;

    })
    .join("");

}


/* =========================================================
   SEC
========================================================= */

/* =========================================================
   주가 테이블
========================================================= */

function makePriceTable(history){

  if(!Array.isArray(history)||!history.length){

    return `
      <div class="note">
        주가 데이터 없음
      </div>
    `;

  }

  return `

          ${

              .map(function(x){

                      )}

/* =========================================================
   차트
========================================================= */

function drawChart(history){

  const canvas =
    document.getElementById("chart");

  if(
    !canvas ||
    !Array.isArray(history) ||
    !history.length
  ){

    return;

  }

  const rect =
    canvas.getBoundingClientRect();

  const width =
    Math.max(
      300,
      rect.width
    );

  const height=270;

  const dpr =
    window.devicePixelRatio || 1;

  canvas.width =
    width*dpr;

  canvas.height =
    height*dpr;

  const ctx =
    canvas.getContext("2d");

  ctx.scale(dpr,dpr);

  const data =
    history
      .slice(-90)
      .map(function(x){

        return {

          date:
            get(
              x,
              "date",
              "datetime"
            ),

          close:
            Number(
              get(
                x,
                "close"
              )
            )

        };

      })
      .filter(
        x=>Number.isFinite(x.close)
      );

  if(!data.length)return;

  const prices =
    data.map(
      x=>x.close
    );

  let min =
    Math.min(...prices);

  let max =
    Math.max(...prices);

  if(min===max){

    min-=1;
    max+=1;

  }

  const marginLeft=45;
  const marginRight=12;
  const marginTop=18;
  const marginBottom=30;

  const plotWidth =
    width-marginLeft-marginRight;

  const plotHeight =
    height-marginTop-marginBottom;

  ctx.clearRect(
    0,
    0,
    width,
    height
  );

  /*
    grid
  */

  ctx.strokeStyle="#24334b";
  ctx.lineWidth=1;

  for(let i=0;i<4;i++){

    const y =
      marginTop+
      plotHeight*i/3;

    ctx.beginPath();

    ctx.moveTo(
      marginLeft,
      y
    );

    ctx.lineTo(
      width-marginRight,
      y
    );

    ctx.stroke();

  }

  /*
    price labels
  */

  ctx.fillStyle="#73829b";
  ctx.font="10px sans-serif";

  ctx.fillText(
    number(max),
    4,
    marginTop+4
  );

  ctx.fillText(
    number(min),
    4,
    marginTop+plotHeight
  );

  /*
    line
  */

  ctx.strokeStyle="#63a8ff";
  ctx.lineWidth=2;

  ctx.beginPath();

  data.forEach(
    function(p,i){

      const x =
        marginLeft+
        plotWidth*
        i/
        Math.max(
          1,
          data.length-1
        );

      const y =
        marginTop+
        (
          (max-p.close)/
          (max-min)
        )*
        plotHeight;

      if(i===0){

        ctx.moveTo(x,y);

      }else{

        ctx.lineTo(x,y);

      }

    }
  );

  ctx.stroke();

  /*
    latest point
  */

  const last=data[data.length-1];

  const lx =
    marginLeft+
    plotWidth;

  const ly =
    marginTop+
    (
      (max-last.close)/
      (max-min)
    )*
    plotHeight;

  ctx.fillStyle="#eef3ff";

  ctx.beginPath();

  ctx.arc(
    lx,
    ly,
    3,
    0,
    Math.PI*2
  );

  ctx.fill();

  /*
    date
  */

  ctx.fillStyle="#73829b";

  ctx.fillText(
    String(last.date||""),
    Math.max(
      marginLeft,
      width-105
    ),
    height-8
  );

}


/* =========================================================
   전체 렌더링
========================================================= */

function render(d){

  const q =
    d.quote ||

  const fh =
    d.finnhubQuote ||
    {};

  const technical =
    d.technical ||
    {};

  const flow =
    d.flow ||
    {};

  const short =
    d.short ||
    {};

  const darkpool =
    d.darkpool ||
    {};

  const sec =
    d.sec ||
    {};

  const dilution =
    d.dilution ||
    {};

  const warrant =
    d.warrant ||
    {};

  const history =
    d.history ||
    [];

  const news =
    d.news ||
    [];

  const stocktitan =
    d.stocktitan ||
    {};

  const symbol =
    get(
      d,
      "symbol"
    ) ||
    $("symbol").value;

  const price =
    get(
      d,
      "price"
    );

  const change =
    get(
      d,
      "change"

          "현재 실제 주식수",
          get(

        ${row(
          "희석 관련 공시",
          Array.isArray(
            dilution.filings

          dilution.filings.length

          (

              sec.dilution

            ?
            sec.dilution.length
            :
            null

          "SEC EDGAR"
        )}

        ${
          Array.isArray(sec.dilution)
          ?
          sec.dilution
            .slice(0,15)

              f=>`

                <div class="news">

                  <div class="newsTitle">
                    ${esc(
                      f.form||
                      "SEC"

          history

    <div class="card">

      <div class="grid">

        <div class="metric">

            Finnhub
          </div>
          <div class="value">

        </div>

        <div class="metric">
