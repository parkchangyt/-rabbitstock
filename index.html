<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>RabbitStock Ultimate</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:#09101e;
  color:#eef3ff;
  font-family:-apple-system,BlinkMacSystemFont,
  "Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;
}

body{
  min-height:100vh;
}

.app{
  max-width:760px;
  margin:0 auto;
  padding:14px;
}

.header{
  padding:8px 4px 18px;
}

.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:-1px;
}

.sub{
  margin-top:5px;
  color:#8190aa;
  font-size:12px;
}

.search{
  display:flex;
  gap:8px;
  margin-bottom:14px;
}

.search input{
  flex:1;
  min-width:0;
  height:48px;
  border:1px solid #26334b;
  border-radius:13px;
  background:#111a2b;
  color:white;
  padding:0 15px;
  font-size:17px;
  font-weight:700;
  outline:none;
}

.search input:focus{
  border-color:#4b82ff;
}

.search button{
  width:90px;
  border:0;
  border-radius:13px;
  background:#377dff;
  color:white;
  font-size:15px;
  font-weight:900;
}

.search button:active{
  transform:scale(.97);
}

.status{
  display:none;
  margin-bottom:12px;
  padding:11px 13px;
  border-radius:11px;
  background:#111b2d;
  color:#9fb0cb;
  font-size:13px;
}

.status.show{
  display:block;
}

.card{
  background:#10192a;
  border:1px solid #1e2b43;
  border-radius:16px;
  padding:16px;
  margin-bottom:12px;
  box-shadow:0 6px 20px rgba(0,0,0,.14);
}

.title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
  font-size:17px;
  font-weight:900;
}

.company{
  color:#8fa0bb;
  font-size:12px;
  font-weight:500;
}

.price{
  font-size:35px;
  font-weight:950;
  letter-spacing:-1.5px;
}

.change{
  margin-top:5px;
  font-size:15px;
  font-weight:800;
}

.up{
  color:#43d68b;
}

.down{
  color:#ff637b;
}

.neutral{
  color:#aab6c9;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
}

.metric{
  background:#0c1423;
  border-radius:11px;
  padding:12px;
  min-height:65px;
}

.metric .label{
  color:#74849f;
  font-size:11px;
  margin-bottom:5px;
}

.metric .value{
  font-size:15px;
  font-weight:800;
  word-break:break-word;
}

.chart-tabs{
  display:flex;
  gap:6px;
  margin-bottom:10px;
}

.chart-tabs button{
  flex:1;
  height:34px;
  border:1px solid #26344d;
  background:#0c1423;
  color:#8e9db6;
  border-radius:9px;
  font-weight:800;
}

.chart-tabs button.active{
  background:#377dff;
  color:white;
  border-color:#377dff;
}

.chart-wrap{
  width:100%;
  overflow:hidden;
  border-radius:12px;
  background:#0a1220;
}

canvas{
  display:block;
  width:100%;
  height:260px;
}

.scorebox{
  display:grid;
  grid-template-columns:100px 1fr;
  gap:15px;
  align-items:center;
}

.score{
  width:92px;
  height:92px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:#0a1220;
  border:7px solid #334967;
}

.score strong{
  font-size:28px;
}

.score small{
  color:#74849f;
  font-size:10px;
}

.judgment{
  font-size:19px;
  font-weight:950;
}

.reason{
  margin-top:8px;
  padding:9px 10px;
  border-radius:9px;
  background:#0c1423;
  font-size:12px;
  color:#aab7ca;
}

.reason b{
  display:block;
  margin-bottom:5px;
  color:#dce5f4;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:9px 0;
  border-bottom:1px solid #1d293e;
}

.row:last-child{
  border-bottom:0;
}

.row .l{
  color:#7e8da6;
  font-size:12px;
}

.row .r{
  text-align:right;
  font-weight:800;
  font-size:13px;
}

.bar{
  height:9px;
  border-radius:99px;
  overflow:hidden;
  background:#202c41;
  display:flex;
  margin:9px 0;
}

.bar-buy{
  background:#35d98b;
}

.bar-sell{
  background:#ff5d76;
}

.notice{
  margin-top:10px;
  padding:10px;
  background:#0b1321;
  border-radius:9px;
  color:#73839e;
  font-size:11px;
  line-height:1.5;
}

.filing{
  padding:11px 0;
  border-bottom:1px solid #1d293e;
}

.filing:last-child{
  border-bottom:0;
}

.filing-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.filing-date{
  color:#8191aa;
  font-size:11px;
}

.badge{
  display:inline-block;
  padding:3px 7px;
  border-radius:6px;
  background:#263858;
  color:#d7e4ff;
  font-size:10px;
  font-weight:900;
}

.filing-title{
  margin-top:5px;
  font-size:13px;
  font-weight:800;
}

.filing a{
  display:inline-block;
  margin-top:6px;
  color:#5990ff;
  font-size:11px;
  text-decoration:none;
}

.news{
  padding:11px 0;
  border-bottom:1px solid #1d293e;
}

.news:last-child{
  border-bottom:0;
}

.news-date{
  color:#7d8da7;
  font-size:10px;
}

.news-title{
  margin-top:5px;
  font-size:13px;
  font-weight:800;
  line-height:1.45;
}

.final{
  border:1px solid #2b4770;
  background:linear-gradient(
    145deg,
    #111f35,
    #0d1727
  );
}

.final-main{
  font-size:22px;
  font-weight:950;
  margin-bottom:12px;
}

.final-item{
  margin-top:8px;
  padding:10px;
  background:#0a1321;
  border-radius:9px;
  font-size:12px;
  line-height:1.5;
}

.loading{
  text-align:center;
  padding:35px 10px;
  color:#7f90aa;
}

.empty{
  color:#71809a;
  font-size:12px;
  padding:10px 0;
}

.footer{
  text-align:center;
  color:#4e5d75;
  font-size:10px;
  padding:20px 0 35px;
}

@media(max-width:420px){

  .app{
    padding:10px;
  }

  .price{
    font-size:31px;
  }

  .scorebox{
    grid-template-columns:85px 1fr;
  }

  .score{
    width:82px;
    height:82px;
  }

  .score strong{
    font-size:24px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="logo">🐇 RabbitStock Ultimate</div>
    <div class="sub">
      실시간 데이터 기반 종합 주식 분석
    </div>
  </div>

  <div class="search">
    <input
      id="symbol"
      type="text"
      placeholder="티커 입력 예: AAPL / NVDA / BRNX"
      autocomplete="off"
      autocapitalize="characters"
      spellcheck="false">
    <button id="analyzeBtn">분석</button>
  </div>

  <div id="status" class="status"></div>

  <div id="content">

    <div class="card loading">
      티커를 입력하고 분석을 눌러주세요.
    </div>

  </div>

  <div class="footer">
    RabbitStock Ultimate · Twelve Data · FINRA · SEC EDGAR
  </div>

</div>


<script>

const API =
  "https://rabbitstock-final.keoss.workers.dev";


let DATA = null;
let currentRange = "1M";


const $ =
  id => document.getElementById(id);


function esc(value){

  if(value === null ||
     value === undefined){
    return "-";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function num(value,digits=2){

  if(
    value === null ||
    value === undefined ||
    !Number.isFinite(Number(value))
  ){
    return "-";
  }

  return Number(value)
    .toLocaleString(
      "en-US",
      {
        maximumFractionDigits:digits
      }
    );
}


function pct(value){

  if(
    value === null ||
    value === undefined ||
    !Number.isFinite(Number(value))
  ){
    return "-";
  }

  return Number(value).toFixed(2) + "%";
}


function money(value){

  if(
    value === null ||
    value === undefined ||
    !Number.isFinite(Number(value))
  ){
    return "-";
  }

  return "$" +
    Number(value).toFixed(2);
}


function signed(value){

  if(
    value === null ||
    value === undefined ||
    !Number.isFinite(Number(value))
  ){
    return "-";
  }

  const n = Number(value);

  return (
    n >= 0 ? "+" : ""
  ) +
  n.toFixed(2);
}


function changeClass(value){

  if(
    value === null ||
    value === undefined ||
    !Number.isFinite(Number(value))
  ){
    return "neutral";
  }

  if(Number(value) > 0)
    return "up";

  if(Number(value) < 0)
    return "down";

  return "neutral";
}


function showStatus(text){

  const box = $("status");

  box.textContent = text;

  box.classList.add("show");
}


function hideStatus(){

  $("status")
    .classList
    .remove("show");
}


function safeArray(x){

  return Array.isArray(x)
    ? x
    : [];
}


/* ================================
   분석
================================ */

async function analyze(){

  let symbol =
    $("symbol")
      .value
      .trim()
      .toUpperCase();

  if(!symbol){

    showStatus("티커를 입력하세요.");

    return;
  }


  $("symbol").value =
    symbol;


  showStatus(
    symbol +
    " 분석 중..."
  );


  $("content").innerHTML =
    `<div class="card loading">
      📡 ${esc(symbol)} 데이터를 불러오는 중...
    </div>`;


  try{

    const response =
      await fetch(
        API +
        "/all?symbol=" +
        encodeURIComponent(symbol),
        {
          method:"GET",
          cache:"no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        "API HTTP " +
        response.status
      );
    }


    const data =
      await response.json();


    if(!data.ok){

      throw new Error(
        data.error ||
        "분석 데이터 오류"
      );
    }


    DATA = data;

    currentRange = "1M";

    render(data);

    hideStatus();

  }catch(error){

    console.error(error);

    showStatus(
      "오류: " +
      error.message
    );


    $("content").innerHTML =
      `<div class="card">
        <div class="title">
          분석 실패
        </div>

        <div class="empty">
          ${esc(error.message)}
        </div>

        <div class="notice">
          Worker 주소와 API 상태를 확인해주세요.
        </div>
      </div>`;
  }
}


/* ================================
   전체 렌더
================================ */

function render(d){

  const q =
    d.quote || {};

  const t =
    d.technical || {};

  const f =
    d.flow || {};

  const s =
    d.score || {};

  const sh =
    d.short || {};

  const rs =
    d.regSho || {};

  const th =
    d.threshold || {};

  const di =
    d.dilution || {};

  const wa =
    d.warrants || {};

  const sec =
    d.sec || {};


  const price =
    q.price;


  let html = "";


  /* 주가 */

  html += `
  <div class="card">

    <div class="title">
      <span>💰 주가</span>
      <span class="company">
        ${esc(d.company || d.symbol)}
      </span>
    </div>

    <div class="price">
      ${money(price)}
    </div>

    <div class="change ${changeClass(q.changePercent)}">
      ${signed(q.change)}
      &nbsp;
      (${signed(q.changePercent)}%)
    </div>

    <div class="grid" style="margin-top:14px">

      <div class="metric">
        <div class="label">
          거래량
        </div>
        <div class="value">
          ${num(q.volume,0)}
        </div>
      </div>

      <div class="metric">
        <div class="label">
          평균 거래량
        </div>
        <div class="value">
          ${num(q.averageVolume,0)}
        </div>
      </div>

      <div class="metric">
        <div class="label">
          거래량 급증
        </div>
        <div class="value">
          ${q.volumeSurge == null
            ? "-"
            : q.volumeSurge.toFixed(2)+"배"}
        </div>
      </div>

      <div class="metric">
        <div class="label">
          52주 고가 / 저가
        </div>
        <div class="value">
          ${money(q.high52)}
          /
          ${money(q.low52)}
        </div>
      </div>

    </div>

  </div>`;


  /* 차트 */

  html += `
  <div class="card">

    <div class="title">
      <span>📈 주가 차트</span>
    </div>

    <div class="chart-tabs">

      <button
        data-range="1D">
        1D
      </button>

      <button
        data-range="5D">
        5D
      </button>

      <button
        class="active"
        data-range="1M">
        1M
      </button>

      <button
        data-range="3M">
        3M
      </button>

    </div>

    <div class="chart-wrap">
      <canvas id="chart"></canvas>
    </div>

  </div>`;


  /* 종합 */

  const score =
    Number.isFinite(Number(s.score))
      ? Number(s.score)
      : 0;


  html += `
  <div class="card">

    <div class="title">
      🎯 종합 분석
    </div>

    <div class="scorebox">

      <div
        class="score"
        id="scoreCircle">

        <strong>
          ${Math.round(score)}
        </strong>

        <small>
          / 100
        </small>

      </div>

      <div>

        <div class="judgment">
          ${esc(s.judgment || "-")}
        </div>

        <div class="reason">

          <b>상승 요인</b>

          ${
            safeArray(s.reasonsUp)
              .length
              ? safeArray(s.reasonsUp)
                .map(x =>
                  "• " + esc(x)
                )
                .join("<br>")
              : "-"
          }

        </div>

        <div class="reason">

          <b>하락 요인</b>

          ${
            safeArray(s.reasonsDown)
              .length
              ? safeArray(s.reasonsDown)
                .map(x =>
                  "• " + esc(x)
                )
                .join("<br>")
              : "-"
          }

        </div>

      </div>

    </div>

  </div>`;


  /* 공매도 */

  html += `
  <div class="card">

    <div class="title">
      🔥 공매도
    </div>

    <div class="row">
      <div class="l">
        Short Interest
      </div>
      <div class="r">
        ${num(sh.shortInterest,0)}
      </div>
    </div>

    <div class="row">
      <div class="l">
        전회 대비
      </div>
      <div class="r">
        ${signed(sh.change)}
        /
        ${pct(sh.changePercent)}
      </div>
    </div>

    <div class="row">
      <div class="l">
        Days to Cover
      </div>
      <div class="r">
        ${num(sh.daysToCover)}
      </div>
    </div>

    <div class="row">
      <div class="l">
        Short Ratio
      </div>
      <div class="r">
        ${num(sh.shortRatio)}
      </div>
    </div>

    <div class="row">
      <div class="l">
        공매 압력
      </div>
      <div class="r">
        ${esc(sh.pressure || "-")}
      </div>
    </div>

    <div class="row">
      <div class="l">
        숏커버 가능성
      </div>
      <div class="r">
        ${esc(sh.squeeze || "-")}
      </div>
    </div>

  </div>`;


  /* Reg SHO */

  html += `
  <div class="card">

    <div class="title">
      📊 Reg SHO
    </div>

    <div class="row">
      <div class="l">
        Short Sale Volume
      </div>
      <div class="r">
        ${num(rs.shortSaleVolume,0)}
      </div>
    </div>

    <div class="row">
      <div class="l">
        공매 비중
      </div>
      <div class="r">
        ${pct(rs.shortPct)}
      </div>
    </div>

    <div class="row">
      <div class="l">
        전일 대비
      </div>
      <div class="r">
        ${signed(rs.previousChange)}%p
      </div>
    </div>

    <div class="row">
      <div class="l">
        날짜
      </div>
      <div class="r">
        ${esc(rs.date || "-")}
      </div>
    </div>

    <div class="row">
      <div class="l">
        압력
      </div>
      <div class="r">
        ${esc(rs.pressure || "-")}
      </div>
    </div>

  </div>`;


  /* Threshold */

  html += `
  <div class="card">

    <div class="title">
      🚨 Threshold List
    </div>

    <div class="row">
      <div class="l">
        등재 여부
      </div>
      <div class="r">
        ${
          th.onThreshold
            ? "🔴 등재"
            : "🟢 미등재"
        }
      </div>
    </div>

    <div class="row">
      <div class="l">
        날짜
      </div>
      <div class="r">
        ${esc(th.date || "-")}
      </div>
    </div>

    <div class="row">
      <div class="l">
        Flag
      </div>
      <div class="r">
        ${esc(th.flag || "-")}
      </div>
    </div>

  </div>`;


  /* 희석 */

  html += `
  <div class="card">

    <div class="title">
      💵 희석
    </div>

    <div class="row">
      <div class="l">
        희석 위험
      </div>
      <div class="r">
        ${esc(di.risk || "-")}
      </div>
    </div>

    <div class="row">
      <div class="l">
        최근 등록
      </div>
      <div class="r">
        ${esc(di.recentRegistration || "-")}
      </div>
    </div>

    <div class="row">
      <div class="l">
        등록일
      </div>
      <div class="r">
        ${esc(di.registrationDate || "-")}
      </div>
    </div>

    <div class="row">
      <div class="l">
        등록 주식
      </div>
      <div class="r">
        ${num(di.registeredShares,0)}
      </div>
    </div>

    <div class="row">
      <div class="l">
        신규 발행 가능
      </div>
      <div class="r">
        ${esc(di.newIssuancePossible || "-")}
      </div>
    </div>

    <div class="row">
      <div class="l">
        잠재 희석률
      </div>
