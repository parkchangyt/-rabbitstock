<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b13">
<title>RabbitStock Ultimate</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;
 padding:0;
 background:#070b13;
 color:#eef3ff;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
body{padding:14px}
button,input{font:inherit}
.container{max-width:900px;margin:auto}

.top{
 display:flex;
 gap:8px;
 margin-bottom:12px;
}
#symbol{
 flex:1;
 min-width:0;
 background:#101827;
 border:1px solid #27354d;
 color:#fff;
 border-radius:12px;
 padding:13px;
 font-size:17px;
 text-transform:uppercase;
 outline:none;
}
.btn{
 border:0;
 border-radius:12px;
 padding:0 17px;
 background:#2f80ed;
 color:#fff;
 font-weight:700;
}
.btn:active{transform:scale(.98)}

.card{
 background:#0d1522;
 border:1px solid #1d2a3d;
 border-radius:16px;
 padding:15px;
 margin-bottom:12px;
 box-shadow:0 4px 20px rgba(0,0,0,.18);
}
.title{
 font-size:13px;
 color:#91a1b9;
 margin-bottom:9px;
}
.price{
 font-size:36px;
 font-weight:800;
 letter-spacing:-1px;
}
.change{font-size:15px;margin-top:5px}
.up{color:#31d17c}
.down{color:#ff6575}
.neutral{color:#9ba9bd}

.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:9px;
}
.metric{
 background:#111c2c;
 border:1px solid #203047;
 border-radius:12px;
 padding:12px;
 min-height:76px;
}
.metric .k{
 color:#8292aa;
 font-size:12px;
 margin-bottom:7px;
}
.metric .v{
 font-size:17px;
 font-weight:750;
 word-break:break-word;
}

.verdict{
 border-radius:14px;
 padding:15px;
 background:#101c2c;
 border:1px solid #263852;
}
.verdict-main{
 font-size:25px;
 font-weight:850;
 margin-bottom:7px;
}
.reason{
 color:#aab7c9;
 font-size:13px;
 line-height:1.6;
}

.badge{
 display:inline-flex;
 align-items:center;
 gap:5px;
 border-radius:999px;
 padding:5px 9px;
 font-size:12px;
 font-weight:750;
 background:#162235;
 border:1px solid #2a3a52;
}
.badge.red{
 background:#32151c;
 border-color:#6d2935;
 color:#ff8290;
}
.badge.green{
 background:#102d22;
 border-color:#24563f;
 color:#55e49a;
}
.badge.yellow{
 background:#30280e;
 border-color:#62541c;
 color:#f2d15e;
}

.regsho{
 background:linear-gradient(135deg,#111d30,#0c1521);
 border:1px solid #334866;
 border-radius:15px;
 padding:15px;
}
.regsho-head{
 display:flex;
 justify-content:space-between;
 align-items:flex-start;
 gap:10px;
}
.regsho-big{
 font-size:28px;
 font-weight:850;
 margin:5px 0;
}
.regsho-days{
 font-size:40px;
 font-weight:900;
 line-height:1;
}
.regsho-sub{
 color:#8798b0;
 font-size:12px;
}
.source-btn{
 display:inline-block;
 margin-top:12px;
 padding:9px 11px;
 border-radius:10px;
 background:#17263a;
 color:#dce9ff;
 text-decoration:none;
 border:1px solid #2b405d;
 font-size:12px;
}

.section-head{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:10px;
}
.section-head h2{
 margin:0;
 font-size:16px;
}
.small{font-size:12px;color:#7889a2}

.table-wrap{
 overflow-x:auto;
 -webkit-overflow-scrolling:touch;
}
table{
 width:100%;
 border-collapse:collapse;
 font-size:12px;
 min-width:560px;
}
th,td{
 padding:9px 7px;
 border-bottom:1px solid #1d2a3d;
 text-align:right;
 white-space:nowrap;
}
th{
 color:#8090a8;
 font-weight:600;
}
td:first-child,th:first-child{text-align:left}

.list{
 display:flex;
 flex-direction:column;
 gap:8px;
}
.item{
 background:#101a29;
 border:1px solid #1e2d43;
 border-radius:11px;
 padding:11px;
}
.item a{
 color:#d8e7ff;
 text-decoration:none;
}
.item-title{
 font-weight:700;
 line-height:1.4;
}
.item-meta{
 color:#71829b;
 font-size:11px;
 margin-top:5px;
}

.chart-wrap{
 position:relative;
 width:100%;
 height:360px;
 background:#080f19;
 border:1px solid #1c2a3d;
 border-radius:12px;
 overflow:hidden;
}
canvas{
 width:100%;
 height:100%;
 display:block;
}
#candleInfo{
 position:absolute;
 display:none;
 pointer-events:none;
 z-index:5;
 background:rgba(10,16,26,.96);
 border:1px solid #38506f;
 border-radius:9px;
 padding:9px 10px;
 font-size:11px;
 line-height:1.6;
 box-shadow:0 6px 20px rgba(0,0,0,.4);
}

.loading{
 text-align:center;
 padding:30px 10px;
 color:#8b9bb0;
}
.error{
 color:#ff7887;
 background:#25141a;
 border:1px solid #522630;
 border-radius:11px;
 padding:12px;
 font-size:13px;
 line-height:1.5;
}

.status-row{
 display:flex;
 justify-content:space-between;
 gap:10px;
 padding:9px 0;
 border-bottom:1px solid #1c293b;
 font-size:12px;
}
.status-row:last-child{border-bottom:0}
.ok{color:#4ce298}
.bad{color:#ff697a}

@media(max-width:600px){
 body{padding:10px}
 .price{font-size:32px}
 .grid{grid-template-columns:repeat(2,1fr)}
 .metric .v{font-size:15px}
 .chart-wrap{height:330px}
}
</style>
</head>

<body>
<div class="container">

  <div class="top">
    <input id="symbol" value="BRNX" placeholder="티커 입력">
    <button class="btn" onclick="analyze()">분석</button>
  </div>

  <div id="app">
    <div class="card loading">티커를 분석하는 중...</div>
  </div>

</div>

<script>
const API = "https://rabbitstock-final.keoss.workers.dev";

const NASDAQ_REGSHO =
  "https://www.nasdaqtrader.com/Trader.aspx?id=RegSHOThreshold";

let DATA = null;
let candles = [];
let chartCanvas = null;

const $ = id => document.getElementById(id);

function esc(v){
  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

function num(v){
  const n = Number(v);
  return Number.isFinite(n) ? n : null;
}

function money(v){
  const n=num(v);
  if(n===null) return "-";
  return "$"+n.toLocaleString(undefined,{
    minimumFractionDigits:n<10?2:2,
    maximumFractionDigits:4
  });
}

function integer(v){
  const n=num(v);
  return n===null ? "-" : Math.round(n).toLocaleString();
}

function pct(v){
  const n=num(v);
  return n===null ? "-" : n.toFixed(2)+"%";
}

function dateOnly(v){
  if(!v) return "-";
  const s=String(v);
  if(/^\d{8}$/.test(s))
    return s.slice(0,4)+"-"+s.slice(4,6)+"-"+s.slice(6,8);
  return s.slice(0,10);
}

function first(obj,...keys){
  for(const k of keys){
    if(obj && obj[k]!==undefined && obj[k]!==null && obj[k]!=="")
      return obj[k];
  }
  return null;
}

async function getJSON(url){
  const r=await fetch(url,{
    cache:"no-store",
    headers:{"Accept":"application/json"}
  });
  const text=await r.text();

  if(!r.ok)
    throw new Error("HTTP "+r.status+" "+text.slice(0,150));

  try{
    return JSON.parse(text);
  }catch{
    throw new Error("JSON 응답 오류");
  }
}

async function analyze(){
  const symbol=$("symbol").value.trim().toUpperCase();

  if(!symbol){
    alert("티커를 입력하세요.");
    return;
  }

  $("symbol").value=symbol;

  $("app").innerHTML=
    `<div class="card loading">
      <div>🔎 ${esc(symbol)} 분석 중...</div>
      <div class="small" style="margin-top:7px">
        주가 · 공매도 · Reg SHO · SEC · 뉴스 데이터를 가져오는 중
      </div>
    </div>`;

  try{
    DATA=await getJSON(
      API+"/all?symbol="+encodeURIComponent(symbol)
    );

    render(DATA);
  }catch(e){
    $("app").innerHTML=
      `<div class="card">
        <div class="error">
          데이터를 가져오지 못했습니다.<br>
          ${esc(e.message)}
        </div>
      </div>`;
  }
}

function getQuote(d){
  return d.quote || d.price || {};
}

function getTech(d){
  return d.technicals || d.technical || {};
}

function getFinra(d){
  return d.finra || {};
}

function getRegSho(d){
  return d.nasdaqRegSho ||
         d.regSho ||
         d.regsho ||
         {};
}

function render(d){
  const q=getQuote(d);
  const t=getTech(d);
  const f=getFinra(d);
  const r=getRegSho(d);

  candles =
    d.history?.values ||
    d.history?.data ||
    d.history ||
    d.candles ||
    [];

  if(!Array.isArray(candles)) candles=[];

  const symbol=
    d.symbol ||
    q.symbol ||
    $("symbol").value.toUpperCase();

  const price=num(first(q,"price","close","last","currentPrice"));
  const change=num(first(q,"change","changePercent","percentChange"));
  const changePct=num(first(q,"changePercent","percentChange"));

  const regCurrent=
    r.current === true ||
    String(r.current).toLowerCase()==="true";

  const regDays=
    num(first(
      r,
      "consecutiveDays",
      "regShoDays",
      "days"
    )) || 0;

  const latestDate=
    first(r,"latestDate") ||
    first(r.latest||{},"date");

  const firstDate=
    first(r,"firstDate");

  let verdict="관망";
  let verdictClass="neutral";

  const score=num(first(
    d,
    "score",
    "totalScore",
    "combinedScore"
  ));

  if(score!==null){
    if(score>=75){
      verdict="강한 상승 우위";
      verdictClass="up";
    }else if(score>=60){
      verdict="상승 우위";
      verdictClass="up";
    }else if(score<=30){
      verdict="하락 위험";
      verdictClass="down";
    }
  }

  $("app").innerHTML=`

  <div class="card">
    <div class="title">${esc(symbol)} 현재 주가</div>
    <div class="price">${money(price)}</div>
    <div class="change ${changePct>=0?'up':'down'}">
      ${changePct!==null ? (changePct>=0?'▲ ':'▼ ')+pct(changePct) : ''}
      ${change!==null && Math.abs(change)>1 ? ' · '+money(change) : ''}
    </div>
  </div>

  <div class="card">
    <div class="section-head">
      <h2>종합 판단</h2>
      <span class="badge">${score!==null ? '점수 '+score+'/100' : '자동분석'}</span>
    </div>

    <div class="verdict">
      <div class="verdict-main ${verdictClass}">
        ${esc(verdict)}
      </div>

      <div class="reason">
        ${buildReasons(d)}
      </div>
    </div>
  </div>

  <div class="card">
    <div class="section-head">
      <h2>캔들차트 · MA20 / MA50</h2>
      <span class="small">캔들 터치 → 날짜별 가격</span>
    </div>

    <div class="chart-wrap">
      <canvas id="chart"></canvas>
      <div id="candleInfo"></div>
    </div>
  </div>

  <div class="card">
    <div class="section-head">
      <h2>핵심 지표</h2>
    </div>

    <div class="grid">
      ${metric("현재가",money(price))}
      ${metric("MA20",money(first(t,"ma20","MA20")))}
      ${metric("MA50",money(first(t,"ma50","MA50")))}
      ${metric("RSI14",num(first(t,"rsi14","RSI14"))?.toFixed(2) ?? "-")}
      ${metric("VWAP20",money(first(t,"vwap20","VWAP20")))}
      ${metric("거래량",integer(first(q,"volume")))}
    </div>
  </div>

  <div class="card">
    <div class="section-head">
      <h2>🔥 Nasdaq Reg SHO</h2>
      <span class="badge ${regCurrent?'red':'green'}">
        ${regCurrent?'THRESHOLD':'정상'}
      </span>
    </div>

    <div class="regsho">
      <div class="regsho-head">

        <div>
          <div class="regsho-sub">현재 NasdaqTrader Threshold List</div>

          <div class="regsho-big ${regCurrent?'down':'up'}">
            ${regCurrent
              ? 'Reg SHO 등재 중'
              : '현재 미등재'}
          </div>

          <div class="regsho-sub">
            최근 확인일: ${esc(dateOnly(latestDate))}
          </div>

          ${firstDate ? `
          <div class="regsho-sub" style="margin-top:3px">
            현재 연속 시작: ${esc(dateOnly(firstDate))}
          </div>` : ''}

        </div>

        <div style="text-align:right">
          <div class="regsho-days ${regCurrent?'down':'neutral'}">
            ${regCurrent ? regDays : 0}
          </div>
          <div class="regsho-sub">
            ${regCurrent ? '일째' : '일'}
          </div>
        </div>

      </div>

      <div style="margin-top:12px;color:#aab7c9;font-size:12px;line-height:1.6">
        ${regCurrent
          ? `현재 NasdaqTrader Threshold List에
             <b>${esc(symbol)}</b>가 연속
             <b>${regDays}일째</b> 관찰되고 있습니다.`
          : `${esc(symbol)}은(는) 최근 확인된 NasdaqTrader Threshold List에서
             현재 등재되지 않았습니다.`}
      </div>

      <a class="source-btn"
         href="${NASDAQ_REGSHO}"
         target="_blank"
         rel="noopener">
         NasdaqTrader 원문 보기 ↗
      </a>
    </div>
  </div>

  <div class="card">
    <div class="section-head">
      <h2>공매도 / Short Interest</h2>
    </div>

    <div class="grid">
      ${metric("Short Interest",
        integer(first(f,"shortInterest","short_interest")))}
      ${metric("Short % Float",
        pct(first(f,"shortPercentFloat","short_percent_float")))}
      ${metric("Days to Cover",
        num(first(f,"daysToCover","days_to_cover"))?.toFixed(2) ?? "-")}
      ${metric("Threshold",
        regCurrent ? "YES" : "NO")}
    </div>
  </div>

  ${renderRegHistory(r,symbol)}

  <div class="card">
    <div class="section-head">
      <h2>희석 / 실제 주식수</h2>
    </div>

    <div class="grid">
      ${metric("Shares Outstanding",
        integer(first(d,"sharesOutstanding","shares")))}
      ${metric("Float",
        integer(first(d,"float","sharesFloat")))}
      ${metric("Market Cap",
        money(first(q,"marketCap")))}
      ${metric("유통비율",
        pct(calcFloatPct(d,q)))}
    </div>
  </div>

  <div class="card">
    <div class="section-head">
      <h2>워런트 / 전환</h2>
    </div>

    <div class="reason">
      ${renderDilution(d)}
    </div>
  </div>

  ${renderSEC(d)}

  ${renderNews(d)}

  ${renderStockTitan(d)}

  ${renderDarkPool(d)}

  ${renderRecentHistory(candles)}

  ${renderSources(d)}
  `;

  drawChart();
}

function metric(k,v){
  return `
    <div class="metric">
      <div class="k">${esc(k)}</div>
      <div class="v">${esc(v)}</div>
    </div>
  `;
}

function calcFloatPct(d,q){
  const sh=num(first(d,"sharesOutstanding","shares"));
  const fl=num(first(d,"float","sharesFloat"));
  if(!sh || !fl) return null;
  return fl/sh*100;
}

function buildReasons(d){
  const r=getRegSho(d);
  const f=getFinra(d);
  const t=getTech(d);

  const reasons=[];

  if(r.current){
    const days=num(r.consecutiveDays)||0;
    reasons.push(
      `🔥 Nasdaq Reg SHO 연속 등재 ${days}일째`
    );
  }

  const rsi=num(first(t,"rsi14","RSI14"));
  if(rsi!==null){
    if(rsi<30) reasons.push("RSI 과매도 구간");
    else if(rsi>70) reasons.push("RSI 과매수 구간");
    else reasons.push("RSI 중립 구간");
  }

  const shortPct=num(first(
    f,
    "shortPercentFloat",
    "short_percent_float"
  ));

  if(shortPct!==null && shortPct>15)
    reasons.push("공매도 비중 높음");

  if(!reasons.length)
    reasons.push("확인 가능한 데이터를 종합해 표시합니다.");

  return reasons.map(x=>"• "+esc(x)).join("<br>");
}

function renderRegHistory(r,symbol){
  const history=Array.isArray(r.history) ? r.history : [];

  if(!history.length){
    return `
      <div class="card">
        <div class="section-head">
          <h2>Reg SHO 등재 이력</h2>
        </div>
        <div class="small">
          Worker에서 NasdaqTrader 일별 파일을 아직 가져오지 못했습니다.
        </div>
      </div>
    `;
  }

  return `
    <div class="card">
      <div class="section-head">
        <h2>Reg SHO 최근 이력</h2>
        <span class="small">${history.length}일 확인</span>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>날짜</th>
              <th>등재</th>
              <th>시장</th>
              <th>3210</th>
              <th>상태</th>
            </tr>
          </thead>
          <tbody>
            ${history.map(x=>{
              const row=x.row||{};
              const on=
                x.onThreshold===true ||
                String(x.onThreshold).toLowerCase()==="true";

              return `
                <tr>
                  <td>${esc(dateOnly(x.date))}</td>
                  <td class="${on?'down':'neutral'}">
                    ${on?'YES':'NO'}
                  </td>
                  <td>${esc(row.marketCategory||"-")}</td>
                  <td>${esc(row.rule3210||"-")}</td>
                  <td>
                    ${on
                      ? '<span class="badge red">THRESHOLD</span>'
                      : '<span class="badge">-</span>'}
                  </td>
                </tr>
              `;
            }).join("")}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function renderDilution(d){
  const arr=
    d.warrants ||
    d.dilution?.warrants ||
    d.dilution ||
    [];

  if(!Array.isArray(arr) || !arr.length){
    const text=
      d.dilution?.summary ||
      d.dilutionSummary ||
      d.dilutionText;

    return esc(text || "확인된 워런트/전환 데이터가 없습니다.");
  }

  return `
    <div class="list">
      ${arr.slice(0,20).map(x=>`
        <div class="item">
          <div class="item-title">
            ${esc(first(x,"type","name","securityType")||"워런트/전환")}
          </div>
          <div class="item-meta">
            수량:
            ${esc(integer(first(x,"shares","quantity","amount")))}
            · 행사가:
            ${esc(money(first(x,"exercisePrice","strike","price")))}
            ${first(x,"expiration","expiry")
              ? ' · 만기 '+esc(first(x,"expiration","expiry"))
              : ''}
          </div>
        </div>
      `).join("")}
    </div>
  `;
}

function renderSEC(d){
  const filings=
    d.sec?.filings ||
    d.filings ||
    [];

  if(!Array.isArray(filings) || !filings.length){
    return `
      <div class="card">
        <div class="section-head">
          <h2>SEC 공시 · 최근 60건</h2>
        </div>
        <div class="small">SEC 공시 데이터 없음</div>
      </div>
    `;
  }

  return `
    <div class="card">
      <div class="section-head">
        <h2>SEC 공시 · 최근 60건</h2>
        <span class="small">${filings.length}건</span>
      </div>

      <div class="list">
        ${filings.slice(0,60).map(x=>{
          const url=
            first(x,"url","link","filingUrl");

          return `
            <div class="item">
              ${url
                ? `<a href="${esc(url)}"
                      target="_blank"
                      rel="noopener">
                     <div class="item-title">
                       ${esc(first(x,"form","title","type")||"SEC Filing")}
                     </div>
                     <div class="item-meta">
                       ${esc(first(x,"filingDate","date")||"")}
                       ${first(x,"accessionNumber")
                         ? ' · '+esc(x.accessionNumber)
                         : ''}
                       ↗
                     </div>
                   </a>`
                : `
                   <div class="item-title">
                     ${esc(first(x,"form","title","type")||"SEC Filing")}
                   </div>
                   <div class="item-meta">
                     ${esc(first(x,"filingDate","date")||"")}
                   </div>
                  `}
            </div>
          `;
        }).join("")}
      </div>
    </div>
  `;
}

function renderNews(d){
  const news=
    d.news ||
    d.finnhub?.news ||
    [];

}

function sourceOK(x){
  if(x===undefined || x===null) return false;
  if(typeof x==="boolean") return x;
  if(typeof x==="object"){
    if(x.ok!==undefined) return !!x.ok;
    return true;
  }
  return true;
}

/* =========================
   CANDLE CHART
========================= */

function normalizeCandles(){
  return candles.map(x=>{
    const date=
      first(x,"datetime","date","time");

    return {
      date,
      open:num(first(x,"open")),
      high:num(first(x,"high")),
      low:num(first(x,"low")),
      close:num(first(x,"close")),
      volume:num(first(x,"volume"))
    };
  }).filter(x=>
    x.open!==null &&
    x.high!==null &&
    x.low!==null &&
    x.close!==null
  ).reverse();
}

function drawChart(){
  chartCanvas=$("chart");
  if(!chartCanvas) return;

  const data=normalizeCandles();

  if(data.length<2){
    const ctx=chartCanvas.getContext("2d");
    ctx.clearRect(0,0,chartCanvas.width,chartCanvas.height);
    ctx.fillStyle="#8190a7";
    ctx.font="13px sans-serif";
    ctx.fillText("차트 데이터가 부족합니다.",20,30);
    return;
  }

  const rect=chartCanvas.getBoundingClientRect();
  const dpr=window.devicePixelRatio||1;

  chartCanvas.width=rect.width*dpr;
  chartCanvas.height=rect.height*dpr;

  const ctx=chartCanvas.getContext("2d");
  ctx.scale(dpr,dpr);

  const W=rect.width;
  const H=rect.height;

  ctx.clearRect(0,0,W,H);

  const pad={
    left:48,
    right:10,
    top:15,
    bottom:35
  };

  const chartW=W-pad.left-pad.right;
  const chartH=H-pad.top-pad.bottom;

  let min=Math.min(...data.map(x=>x.low));
  let max=Math.max(...data.map(x=>x.high));

  if(min===max){
    min*=.99;
    max*=1.01;
  }

  const range=max-min;

  function y(v){
    return pad.top+
      (max-v)/range*chartH;
  }

  const step=chartW/data.length;
  const bodyW=Math.max(3,step*.55);

  /* grid */
  ctx.lineWidth=1;
  ctx.strokeStyle="#162334";
  ctx.fillStyle="#6f8098";
  ctx.font="10px sans-serif";

  for(let i=0;i<5;i++){
    const val=max-range*i/4;
    const yy=y(val);

    ctx.beginPath();
    ctx.moveTo(pad.left,yy);
    ctx.lineTo(W-pad.right,yy);
    ctx.stroke();

    ctx.fillText(
      val.toFixed(val<10?2:1),
      5,
      yy+3
    );
  }

  /* candles */
  data.forEach((c,i)=>{
    const x=pad.left+step*i+step/2;

    const up=c.close>=c.open;

    ctx.strokeStyle=up?"#38d982":"#ff6374";
    ctx.fillStyle=up?"#38d982":"#ff6374";

    /* wick */
    ctx.beginPath();
    ctx.moveTo(x,y(c.high));
    ctx.lineTo(x,y(c.low));
    ctx.stroke();

    /* body */
    const yo=y(c.open);
    const yc=y(c.close);

    const top=Math.min(yo,yc);
    const h=Math.max(1,Math.abs(yc-yo));

    ctx.fillRect(
      x-bodyW/2,
      top,
      bodyW,
      h
    );
  });

  /* MA20 */
  drawMA(ctx,data,20,"#");
  drawMA(ctx,data,50,"#");

  chartCanvas._chartData=data;
  chartCanvas._chartMeta={
    pad,
    step,
    width:W,
    height:H
  };

  chartCanvas.onclick=e=>showCandle(e,false);
  chartCanvas.ontouchstart=e=>{
    if(e.touches && e.touches[0]){
      showCandle(e,true);
    }
  };
}

function drawMA(ctx,data,n,dummy){
  if(data.length<n) return;

  const W=chartCanvas.getBoundingClientRect().width;
  const H=chartCanvas.getBoundingClientRect().height;

  const pad=chartCanvas._chartMeta
    ? chartCanvas._chartMeta.pad
    : {left:48,right:10,top:15,bottom:35};

  const chartW=W-pad.left-pad.right;
  const chartH=H-pad.top-pad.bottom;

  let min=Math.min(...data.map(x=>x.low));
  let max=Math.max(...data.map(x=>x.high));
  if(min===max){min*=.99;max*=1.01}

  const range=max-min;

  const y=v=>pad.top+(max-v)/range*chartH;
  const step=chartW/data.length;

  ctx.beginPath();

  let started=false;

  for(let i=n-1;i<data.length;i++){
    let sum=0;

    for(let j=i-n+1;j<=i;j++)
      sum+=data[j].close;

    const avg=sum/n;
    const x=pad.left+step*i+step/2;

    if(!started){
      ctx.moveTo(x,y(avg));
      started=true;
    }else{
      ctx.lineTo(x,y(avg));
    }
  }

  ctx.strokeStyle=n===20?"#f0c84b":"#61a8ff";
  ctx.lineWidth=1.4;
  ctx.stroke();
}

function showCandle(e,touch){
  const c=chartCanvas;

  if(!c || !c._chartData) return;

  const rect=c.getBoundingClientRect();

  const clientX=
    touch
      ? e.touches[0].clientX
      : e.clientX;

  const x=clientX-rect.left;

  const meta=c._chartMeta;
  const data=c._chartData;

  let idx=
    Math.floor(
      (x-meta.pad.left)/meta.step
    );

  idx=Math.max(0,Math.min(data.length-1,idx));

  const d=data[idx];

  const box=$("candleInfo");

  if(!box) return;

  box.innerHTML=`
    <b>${esc(dateOnly(d.date))}</b><br>
    시가 ${money(d.open)}<br>
    고가 ${money(d.high)}<br>
    저가 ${money(d.low)}<br>
    종가 ${money(d.close)}<br>
    거래량 ${integer(d.volume)}
  `;

  let left=x+10;

  if(left>rect.width-170)
    left=x-170;

  left=Math.max(5,left);

  box.style.left=left+"px";
  box.style.top="12px";
  box.style.display="block";

  if(touch){
    clearTimeout(showCandle._timer);
    showCandle._timer=setTimeout(()=>{
      box.style.display="none";
    },4000);
  }
}

window.addEventListener("resize",()=>{
  if(DATA) drawChart();
});

$("symbol").addEventListener("keydown",e=>{
  if(e.key==="Enter") analyze();
});

analyze();
</script>
