<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>RabbitStock</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#0b1020;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.container{
  max-width:900px;
  margin:auto;
  padding:18px;
}

.header{
  text-align:center;
  margin-bottom:18px;
}

.header h1{
  margin:0;
  font-size:30px;
}

.header p{
  margin:6px 0 0;
  color:#9aa4bd;
}

.search{
  display:flex;
  gap:8px;
  margin-bottom:15px;
}

.search input{
  flex:1;
  min-width:0;
  padding:14px;
  border:1px solid #2d3753;
  border-radius:12px;
  background:#151c30;
  color:#fff;
  font-size:17px;
  text-transform:uppercase;
}

.search button{
  border:0;
  border-radius:12px;
  padding:0 20px;
  background:#4f7cff;
  color:#fff;
  font-size:16px;
  font-weight:bold;
}

.status{
  text-align:center;
  padding:8px;
  color:#8e9ab5;
  font-size:13px;
}

.card{
  background:#12192b;
  border:1px solid #26314d;
  border-radius:16px;
  padding:17px;
  margin-bottom:14px;
}

.title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:14px;
}

.price{
  font-size:38px;
  font-weight:800;
}

.change{
  font-size:18px;
  margin-top:4px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.box{
  background:#0d1425;
  border-radius:12px;
  padding:13px;
}

.label{
  color:#8f9bb5;
  font-size:12px;
  margin-bottom:5px;
}

.value{
  font-size:18px;
  font-weight:bold;
}

.score{
  font-size:42px;
  font-weight:900;
  text-align:center;
  margin:5px 0;
}

.bar{
  height:12px;
  background:#252e45;
  border-radius:20px;
  overflow:hidden;
}

.bar div{
  height:100%;
  width:0%;
  background:#4f7cff;
  transition:.4s;
}

.news{
  border-top:1px solid #28334d;
  padding:12px 0;
}

.news:first-child{
  border-top:0;
}

.news a{
  color:#fff;
  text-decoration:none;
  font-weight:bold;
}

.news small{
  display:block;
  margin-top:6px;
  color:#8f9bb5;
}

.tag{
  display:inline-block;
  padding:6px 10px;
  border-radius:20px;
  background:#26314d;
  margin:3px;
  font-size:13px;
}

.good{
  color:#45d483;
}

.bad{
  color:#ff6575;
}

.warn{
  color:#ffc857;
}

.loading{
  color:#8f9bb5;
}

@media(max-width:600px){
  .container{
    padding:12px;
  }

  .price{
    font-size:32px;
  }

  .grid{
    grid-template-columns:1fr 1fr;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>🐰 RabbitStock</h1>
    <p>미국주식 자동 분석</p>
  </div>

  <div class="search">
    <input
      id="symbol"
      value="BRNX"
      placeholder="티커 입력"
      autocomplete="off"
    >
    <button onclick="analyze()">분석</button>
  </div>

  <div id="status" class="status">
    준비 완료
  </div>


  <!-- 주가 -->

  <div class="card">

    <div class="title">
      📈 주가
    </div>

    <div id="price">
      데이터 없음
    </div>

  </div>


  <!-- 기본 지표 -->

  <div class="card">

    <div class="title">
      📊 시장 데이터
    </div>

    <div class="grid">

      <div class="box">
        <div class="label">시가</div>
        <div id="open" class="value">-</div>
      </div>

      <div class="box">
        <div class="label">고가</div>
        <div id="high" class="value">-</div>
      </div>

      <div class="box">
        <div class="label">저가</div>
        <div id="low" class="value">-</div>
      </div>

      <div class="box">
        <div class="label">전일 종가</div>
        <div id="previous" class="value">-</div>
      </div>

      <div class="box">
        <div class="label">거래량</div>
        <div id="volume" class="value">-</div>
      </div>

      <div class="box">
        <div class="label">데이터 출처</div>
        <div id="source" class="value">-</div>
      </div>

    </div>

  </div>


  <!-- 상승 점수 -->

  <div class="card">

    <div class="title">
      🚀 상승 가능성 점수
    </div>

    <div id="score" class="score">
      -
    </div>

    <div class="bar">
      <div id="scoreBar"></div>
    </div>

    <p id="scoreText" class="status">
      데이터 분석 중
    </p>

  </div>


  <!-- SEC -->

  <div class="card">

    <div class="title">
      🏛 SEC 공시 / 희석 위험
    </div>

    <div id="secStatus" class="loading">
      데이터 불러오는 중...
    </div>

    <div id="secTags"></div>

    <div class="grid">

      <div class="box">
        <div class="label">희석 위험</div>
        <div id="dilutionRisk" class="value">-</div>
      </div>

      <div class="box">
        <div class="label">위험 점수</div>
        <div id="riskScore" class="value">-</div>
      </div>

    </div>

  </div>


  <!-- 뉴스 -->

  <div class="card">

    <div class="title">
      📰 최신 뉴스
    </div>

    <div id="news">
      뉴스 불러오는 중...
    </div>

  </div>


  <!-- 종합 -->

  <div class="card">

    <div class="title">
      🤖 RabbitStock 종합 분석
    </div>

    <div id="analysis">
      티커를 분석하면 결과가 표시됩니다.
    </div>

  </div>

</div>


<script>

const API =
  "https://rabbitstock-final.keoss.workers.dev";


function money(v){

  if(v === undefined ||
     v === null ||
     v === "" ||
     isNaN(Number(v))){

    return "-";

  }

  return "$" +
    Number(v).toFixed(4);

}


function number(v){

  if(v === undefined ||
     v === null ||
     v === "" ||
     isNaN(Number(v))){

    return "-";

  }

  return Number(v).toLocaleString();

}


function percent(v){

  if(v === undefined ||
     v === null ||
     v === "" ||
     isNaN(Number(v))){

    return "-";

  }

  const n = Number(v);

  return (n >= 0 ? "+" : "") +
    n.toFixed(2) +
    "%";

}


function escapeHtml(str){

  return String(str || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================
   주가
===================== */

async function loadQuote(symbol){

  const el =
    document.getElementById("price");

  el.innerHTML =
    '<div class="loading">주가 불러오는 중...</div>';

  try{

    const r =
      await fetch(
        API +
        "/quote?symbol=" +
        encodeURIComponent(symbol)
      );

    const d =
      await r.json();

    if(!d.ok){

      el.innerHTML =
        '<span class="bad">주가 데이터 없음</span>';

      return null;

    }


    const changeClass =
      Number(d.percentChange) >= 0
      ? "good"
      : "bad";


    el.innerHTML =

      '<div class="price">' +
      money(d.price) +
      '</div>' +

      '<div class="change ' +
      changeClass +
      '">' +
      money(d.change) +
      " (" +
      percent(d.percentChange) +
      ")" +
      '</div>';


    document.getElementById("open")
      .textContent =
      money(d.open);

    document.getElementById("high")
      .textContent =
      money(d.high);

    document.getElementById("low")
      .textContent =
      money(d.low);

    document.getElementById("previous")
      .textContent =
      money(d.previousClose);

    document.getElementById("volume")
      .textContent =
      number(d.volume);

    document.getElementById("source")
      .textContent =
      d.source || "-";


    return d;

  }catch(e){

    el.innerHTML =
      '<span class="bad">주가 API 오류</span>';

    return null;

  }

}


/* =====================
   SEC
===================== */

async function loadSEC(symbol){

  const status =
    document.getElementById("secStatus");

  const tags =
    document.getElementById("secTags");

  status.textContent =
    "SEC 데이터 불러오는 중...";

  tags.innerHTML = "";

  try{

    const r =
      await fetch(
        API +
        "/sec?symbol=" +
        encodeURIComponent(symbol)
      );

    const d =
      await r.json();

    if(!d.ok){

      status.innerHTML =
        '<span class="bad">SEC 데이터 없음</span>';

      return null;

    }


    const a =
      d.analysis || {};


    status.innerHTML =
      escapeHtml(
        d.companyName ||
        symbol
      );


    let html = "";


    if(a.offering){

      html +=
        '<span class="tag warn">증권 발행</span>';

    }


    if(a.dilution){

      html +=
        '<span class="tag bad">희석 가능성</span>';

    }


    if(a.warrant){

      html +=
        '<span class="tag warn">워런트</span>';

    }


    if(a.atm){

      html +=
        '<span class="tag bad">ATM</span>';

    }


    if(a.convertible){

      html +=
        '<span class="tag bad">전환증권</span>';

    }


    if(!html){

      html =
        '<span class="tag good">특이 희석 신호 없음</span>';

    }


    tags.innerHTML = html;


    document.getElementById("dilutionRisk")
      .textContent =
      a.riskLevel || "-";


    document.getElementById("riskScore")
      .textContent =
      a.riskScore !== undefined
      ? a.riskScore + "/100"
      : "-";


    return d;

  }catch(e){

    status.innerHTML =
      '<span class="bad">SEC API 오류</span>';

    return null;

  }

}


/* =====================
   뉴스
===================== */

async function loadNews(symbol){

  const box =
    document.getElementById("news");

  box.innerHTML =
    '<div class="loading">뉴스 불러오는 중...</div>';

  try{

    const r =
      await fetch(
        API +
        "/news?symbol=" +
        encodeURIComponent(symbol)
      );

    const d =
      await r.json();


    if(!d.ok){

      box.innerHTML =
        '<span class="bad">뉴스 데이터 없음</span>';

      return [];

    }


    const list =
      Array.isArray(d.news)
      ? d.news
      : [];


    if(list.length === 0){

      box.innerHTML =
        '<span class="warn">' +
        '현재 뉴스 데이터가 없습니다.' +
        '</span>';

      return [];

    }


    box.innerHTML =
      list.map(x => {

        const title =
          escapeHtml(
            x.headline ||
            "제목 없음"
          );

        const source =
          escapeHtml(
            x.source ||
            ""
          );


        let link =
          x.url || "#";


        return (

          '<div class="news">' +

          '<a href="' +
          escapeHtml(link) +
          '" target="_blank">' +

          title +

          '</a>' +

          '<small>' +
          source +
          '</small>' +

          '</div>'

        );

      }).join("");


    return list;

  }catch(e){

    box.innerHTML =
      '<span class="bad">' +
      '뉴스 API 오류' +
      '</span>';

    return [];

  }

}


/* =====================
   상승 점수
===================== */

function calculateScore(quote, sec){

  let score = 50;


  if(quote){

    const change =
      Number(
        quote.percentChange || 0
      );

    if(change > 10)
      score += 20;

    else if(change > 5)
      score += 15;

    else if(change > 2)
      score += 8;

    else if(change < -10)
      score -= 20;

    else if(change < -5)
      score -= 15;

    else if(change < -2)
      score -= 8;

  }


  if(sec && sec.analysis){

    const risk =
      Number(
        sec.analysis.riskScore || 0
      );

    score -=
      Math.round(
        risk * 0.25
      );

  }


  score =
    Math.max(
      0,
      Math.min(
        100,
        score
      )
    );


  return score;

}


function showScore(score){

  const el =
    document.getElementById("score");

  const bar =
    document.getElementById("scoreBar");

  const text =
    document.getElementById("scoreText");


  el.textContent =
    score + " / 100";

  bar.style.width =
    score + "%";


  if(score >= 75){

    text.innerHTML =
      '<span class="good">강한 상승 신호</span>';

  }else if(score >= 60){

    text.innerHTML =
      '<span class="good">상승 우위</span>';

  }else if(score >= 40){

    text.innerHTML =
      '<span class="warn">중립 / 관망</span>';

  }else{

    text.innerHTML =
      '<span class="bad">하락 위험</span>';

  }

}


/* =====================
   종합 분석
===================== */

function showAnalysis(
  symbol,
  quote,
  sec,
  news,
  score
){

  const box =
    document.getElementById("analysis");


  let html = "";


  if(quote){

    const p =
      Number(
        quote.percentChange || 0
      );


    html +=
      "<p><b>" +
      symbol +
      "</b> 현재 주가는 " +
      money(quote.price) +
      "이며 오늘 변동률은 " +
      percent(p) +
      "입니다.</p>";

  }


  if(sec && sec.analysis){

    const a =
      sec.analysis;


    if(a.riskScore >= 70){

      html +=
        '<p class="bad">⚠️ SEC 기준 희석 위험이 높습니다. 신규 발행·워런트·전환증권 등을 반드시 확인해야 합니다.</p>';

    }else if(a.riskScore >= 40){

      html +=
        '<p class="warn">⚠️ 일부 희석 관련 신호가 있어 주의가 필요합니다.</p>';

    }else{

      html +=
        '<p class="good">✅ 현재 확인된 SEC 희석 위험은 비교적 낮습니다.</p>';

    }

  }


  if(news.length > 0){

    html +=
      '<p>📰 최근 뉴스 데이터가 ' +
      news.length +
      '건 확인되었습니다.</p>';

  }else{

    html +=
      '<p class="warn">📰 현재 뉴스 데이터는 확인되지 않았습니다.</p>';

  }


  html +=
    "<p><b>RabbitStock 점수: " +
    score +
    "/100</b></p>";


  html +=
    '<p class="status">' +
    '※ 점수는 참고용 자동 계산값이며 투자판단의 근거로 사용하지 마세요.' +
    '</p>';


  box.innerHTML =
    html;

}


/* =====================
   전체 분석
===================== */

async function analyze(){

  let symbol =
    document
      .getElementById("symbol")
      .value
      .trim()
      .toUpperCase();


  if(!symbol){

    alert("티커를 입력하세요.");

    return;

  }


  document.getElementById("symbol")
    .value =
    symbol;


  document.getElementById("status")
    .textContent =
    symbol +
    " 분석 중...";


  const [
    quote,
    sec,
    news
  ] =
    await Promise.all([

      loadQuote(symbol),

      loadSEC(symbol),

      loadNews(symbol)

    ]);


  const score =
    calculateScore(
      quote,
      sec
    );


  showScore(score);


  showAnalysis(
    symbol,
    quote,
    sec,
    news,
    score
  );


  document.getElementById("status")
    .textContent =
    symbol +
    " 분석 완료";

}


/* =====================
   엔터키
===================== */

document
  .getElementById("symbol")
  .addEventListener(
    "keydown",
    function(e){

      if(e.key === "Enter"){

        analyze();

      }

    }
  );


/* 시작 */

analyze();

</script>

</body>
</html>
