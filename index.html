<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>RabbitStock Ultimate 8.1</title>

<style>

*{
 box-sizing:border-box;
}

body{
 margin:0;
 background:#09101e;
 color:#eef3fb;
 font-family:
 -apple-system,
 BlinkMacSystemFont,
 "Apple SD Gothic Neo",
 "Noto Sans KR",
 sans-serif;
}

.wrap{
 max-width:760px;
 margin:auto;
 padding:14px;
}

.head{
 font-size:23px;
 font-weight:900;
 margin-bottom:12px;
}

.sub{
 color:#8391a7;
 font-size:12px;
}

.inputRow{
 display:flex;
 gap:8px;
}

input{
 flex:1;
 min-width:0;
 background:#111b2c;
 color:white;
 border:1px solid #293952;
 border-radius:12px;
 padding:13px;
 font-size:17px;
 text-transform:uppercase;
}

button{
 border:0;
 border-radius:11px;
 background:#2f80ed;
 color:white;
 font-weight:800;
 padding:0 17px;
}

.card{
 background:#101a2b;
 border:1px solid #22314b;
 border-radius:16px;
 padding:15px;
 margin-top:10px;
}

.title{
 font-size:17px;
 font-weight:900;
 margin-bottom:11px;
}

.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
}

.cell{
 background:#0b1423;
 border-radius:11px;
 padding:10px;
}

.label{
 color:#8795a9;
 font-size:11px;
}

.val{
 font-size:16px;
 font-weight:900;
 margin-top:3px;
}

.big{
 font-size:34px;
 font-weight:900;
}

.good{
 color:#4ade80;
}

.warn{
 color:#facc15;
}

.bad{
 color:#fb7185;
}

.blue{
 color:#60a5fa;
}

.muted{
 color:#91a0b4;
}

.small{
 font-size:12px;
 line-height:1.55;
}

.line{
 border-bottom:1px solid #1f2c41;
 padding:7px 0;
}

.line:last-child{
 border-bottom:0;
}

canvas{
 width:100%;
 height:240px;
 display:block;
 background:#0b1423;
 border-radius:12px;
}

.tabs{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:6px;
 margin-top:8px;
}

.tab{
 padding:8px;
 background:#18243a;
 color:#aab7ca;
}

.tab.on{
 background:#2f80ed;
 color:white;
}

.loading{
 text-align:center;
 padding:40px 10px;
 color:#91a0b4;
}

.error{
 color:#fb7185;
}

a{
 color:#8ab4ff;
 text-decoration:none;
}

.score{
 font-size:38px;
 font-weight:900;
}

.progress{
 height:9px;
 background:#202d42;
 border-radius:20px;
 overflow:hidden;
 margin-top:6px;
}

.progress span{
 display:block;
 height:100%;
 background:#60a5fa;
}

</style>
</head>

<body>

<div class="wrap">

<div class="head">
🐇 RabbitStock Ultimate
<span class="sub">8.1</span>
</div>

<div class="inputRow">

<input
 id="symbol"
 value="BRNX"
 maxlength="12"
 autocomplete="off">

<button onclick="analyze()">
분석
</button>

</div>

<div id="result"
 class="loading">

종목을 입력하고 분석을 눌러주세요.

</div>

</div>


<script>

const API=
"https://rabbitstock-final.keoss.workers.dev";

let chartData=[];
let chartRange=30;


/* =========================
   기본 함수
========================= */

function esc(v){

 return String(v??"")
 .replace(/[&<>"']/g,m=>({

  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"

 }[m]));

}

function number(v,d=2){

 if(v==null ||
    !Number.isFinite(Number(v))){
  return "데이터 없음";
 }

 return Number(v)
 .toLocaleString("en-US",{
  maximumFractionDigits:d
 });

}

function money(v){

 if(v==null){
  return "데이터 없음";
 }

 return "$"+number(v,2);
}

function percent(v){

 if(v==null ||
    !Number.isFinite(Number(v))){
  return "데이터 없음";
 }

 return Number(v).toFixed(2)+"%";

}

function metric(label,value,cls=""){

 return `
 <div class="cell">

   <div class="label">
   ${label}
   </div>

   <div class="val ${cls}">
   ${value}
   </div>

 </div>
 `;

}

function card(title,content){

 return `
 <section class="card">

   <div class="title">
   ${title}
   </div>

   ${content}

 </section>
 `;

}


/* =========================
   차트
========================= */

function drawChart(){

 const canvas=
 document.getElementById("chart");

 if(!canvas)return;

 const ctx=
 canvas.getContext("2d");

 const ratio=
 window.devicePixelRatio||1;

 const width=
 canvas.clientWidth;

 const height=
 canvas.clientHeight;

 canvas.width=
 width*ratio;

 canvas.height=
 height*ratio;

 ctx.scale(ratio,ratio);

 ctx.clearRect(
 0,0,width,height
 );

 const rows=
 chartData.slice(-chartRange);

 if(!rows.length){

  ctx.fillStyle="#8391a7";

  ctx.font="14px sans-serif";

  ctx.fillText(
   "차트 데이터 없음",
   20,
   30
  );

  return;
 }

 const values=
 rows
 .map(x=>Number(x.close))
 .filter(Number.isFinite);

 if(!values.length)return;

 const min=
 Math.min(...values);

 const max=
 Math.max(...values);

 const pad=22;

 /* grid */

 ctx.strokeStyle="#22314b";
 ctx.lineWidth=1;

 for(let i=1;i<5;i++){

  const y=
    pad+
    (height-pad*2)*i/5;

  ctx.beginPath();

  ctx.moveTo(0,y);
  ctx.lineTo(width,y);

  ctx.stroke();

 }

 /* line */

 ctx.strokeStyle="#60a5fa";
 ctx.lineWidth=2.3;

 ctx.beginPath();

 rows.forEach((r,i)=>{

  const x=
   pad+
   (width-pad*2)*
   i/
   Math.max(1,rows.length-1);

  const y=
   height-pad-
   (
    (Number(r.close)-min)/
    Math.max(.000001,max-min)
   )*
   (height-pad*2);

  if(i===0){
   ctx.moveTo(x,y);
  }else{
   ctx.lineTo(x,y);
  }

 });

 ctx.stroke();

 /* latest price */

 const latest=
 values[values.length-1];

 ctx.fillStyle="#aab7ca";
 ctx.font="12px sans-serif";

 ctx.fillText(
  "$"+number(latest,2),
  8,
  15
 );

}


function changeRange(range){

 chartRange=range;

 document
 .querySelectorAll(".tab")
 .forEach(x=>x.classList.remove("on"));

 event.currentTarget.classList.add("on");

 drawChart();

}


function chartHTML(){

 return `
 <canvas id="chart"></canvas>

 <div class="tabs">

 <button
 class="tab ${chartRange===5?"on":""}"
 onclick="changeRange(5)">
 1W
 </button>

 <button
 class="tab ${chartRange===20?"on":""}"
 onclick="changeRange(20)">
 1M
 </button>

 <button
 class="tab ${chartRange===60?"on":""}"
 onclick="changeRange(60)">
 3M
 </button>

 <button
 class="tab ${chartRange===120?"on":""}"
 onclick="changeRange(120)">
 6M
 </button>

 </div>
 `;

}


/* =========================
   판단
========================= */

function shortPressure(si){

 if(!si?.ok){
  return "⚪ 데이터 없음";
 }

 const d=si.daysToCover;

 if(d==null){
  return "🟡 보통";
 }

 if(d>=5){
  return "🔴 높음";
 }

 if(d<=2){
  return "🟢 낮음";
 }

 return "🟡 보통";

}


function regPressure(rs){

 if(!rs?.ok ||
    rs.latest?.shortPct==null){

  return "⚪ 데이터 없음";
 }

 const p=rs.latest.shortPct;

 if(p>=50){
  return "🔴 높음";
 }

 if(p<30){
  return "🟢 낮음";
 }

 return "🟡 보통";

}


function verdict(score){

 if(score==null){
  return [
   "⚪ 판단 보류",
   "데이터 부족으로 종합판정을 확정하지 않습니다."
  ];
 }

 if(score>=75){
  return [
   "🟢 강한 긍정",
   "상승 요인이 하락 요인보다 뚜렷하게 우세합니다."
  ];
 }

 if(score>=60){
  return [
   "🟢 긍정 우세",
   "반등 가능성이 있으나 추세 확인이 필요합니다."
  ];
 }

 if(score>=45){
  return [
   "⚠️ 관망",
   "상승과 하락 신호가 혼재되어 있습니다."
  ];
 }

 return [
  "🔴 약세",
  "현재 하락 요인이 우세합니다."
 ];

}


/* =========================
   분석
========================= */

async function analyze(){

 const input=
 document.getElementById("symbol");

 const symbol=
 input.value
 .trim()
 .toUpperCase();

 if(!symbol)return;

 const result=
 document.getElementById("result");

 result.innerHTML=
 `
 <div class="loading">
 데이터 불러오는 중...
 </div>
 `;

 try{

  const response=
   await fetch(
    `${API}/all?symbol=${encodeURIComponent(symbol)}`
   );

  const data=
   await response.json();

  if(!data.ok){
   throw new Error(
    data.error||"분석 실패"
   );
  }

  render(data);

 }catch(error){

  result.innerHTML=
  `
  <div class="card error">

   <b>데이터 불러오기 실패</b>

   <br><br>

   ${esc(error.message)}

   <br><br>

   Worker 주소 또는 API 설정을 확인하세요.

  </div>
  `;

 }

}


/* =========================
   화면
========================= */

function render(d){

 const q=d.quote||{};
 const f=d.flow||{};
 const si=d.shortInterest||{};
 const rs=d.regSho||{};
 const di=d.dilution||{};
 const se=d.sec||{};
 const nw=d.news||{};
 const an=d.analysis||{};

 chartData=
  d.chart?.values||[];

 const [vTitle,vText]=
  verdict(an.score);

 const shortP=
  shortPressure(si);

 const regP=
  regPressure(rs);

 let up=
  (an.up||[])
  .map(x=>
   `<div class="line good">
   • ${esc(x)}
   </div>`
  )
  .join("");

 if(!up){
  up=
   `<div class="line muted">
   • 확인된 상승 요인 없음
   </div>`;
 }

 let down=
  (an.down||[])
  .map(x=>
   `<div class="line bad">
   • ${esc(x)}
   </div>`
  )
  .join("");

 if(!down){
  down=
   `<div class="line muted">
   • 확인된 하락 요인 없음
   </div>`;
 }

 let news=
  (nw.items||[])
  .slice(0,5)
  .map(x=>
   `
   <div class="line">

    <a
     href="${esc(x.link)}"
     target="_blank">

     ${esc(x.title)}

    </a>

   </div>
   `
  )
  .join("");

 if(!news){
  news=
   `<div class="muted">
   뉴스 데이터 없음
   </div>`;
 }


 let sec=
  (se.filings||[])
  .slice(0,6)
  .map(x=>
   `
   <div class="line">

   ${esc(x.filingDate)}
  　
   <b>${esc(x.form)}</b>
   
   <div class="small muted">
   ${esc(x.primaryDocument||"")}
   </div>

   </div>
   `
  )
  .join("");

 if(!sec){
  sec=
   `<div class="muted">
   SEC 데이터 없음
   </div>`;
 }


 const dilutionRisk=
  di.ok
   ?di.risk==="주의"
    ?"🟠 주의"
    :"🟢 낮음"
   :"⚪ 데이터 없음";


 const trend=
  q.changePercent==null
   ?"데이터 없음"
   :q.changePercent>2
    ?"🟢 강세"
    :q.changePercent<-2
     ?"🔴 약세"
     :"🟡 중립";


 const volumeTrend=
  q.volumeSurge==null
   ?"데이터 없음"
   :q.volumeSurge>=1.5
    ?"🟢 증가"
    :q.volumeSurge<.7
     ?"🔴 감소"
     :"🟡 보통";


 const momentum=
  f.ok
   ?f.score>=60
    ?"🟢 개선"
    :f.score<=40
     ?"🔴 약화"
     :"🟡 중립"
   :"⚪ 데이터 없음";


 let position="데이터 없음";

 if(
  q.price!=null &&
  q.high52!=null &&
  q.low52!=null &&
  q.high52>q.low52
 ){

  position=
   Math.round(
    (
     (q.price-q.low52)/
     (q.high52-q.low52)
    )*100
   )+"%";

 }


 document.getElementById("result").innerHTML=

 /* 주가 */

 card(
  "💰 주가",

  `
  <div class="grid">

   ${metric(
    "현재가",
    money(q.price),
    q.changePercent<0?"bad":"good"
   )}

   ${metric(
    "등락",
    percent(q.changePercent),
    q.changePercent<0?"bad":"good"
   )}

   ${metric(
    "거래량",
    q.volume==null
     ?"데이터 없음"
     :number(q.volume,0)
   )}

   ${metric(
    "거래량 급증",
    q.volumeSurge==null
     ?"데이터 없음"
     :number(q.volumeSurge,2)+"배"
   )}

  </div>
  `
 )

 /* 차트 */

 +
 card(
  "📈 주가 차트",
  chartHTML()
 )

 /* 종합 */

 +
 card(
  "🎯 종합 분석",

  `
  <div class="grid">

   ${metric(
    "종합점수",
    an.score==null
     ?"판단 보류"
     :an.score+" / 100"
   )}

   ${metric(
    "종합판정",
    vTitle
   )}

  </div>

  <div style="margin-top:12px">

   <b class="good">
   🟢 상승 요인
   </b>

   ${up}

  </div>

  <div style="margin-top:12px">

   <b class="bad">
   🔴 하락 요인
   </b>

   ${down}

  </div>

  <div
   class="small muted"
   style="margin-top:10px">

   데이터 커버리지:
   ${an.coverage||0}개 항목

  </div>
  `
 )

 /* 수급 */

 +
 card(
  "📊 수급 분석",

  `
  <div class="grid">

   ${metric(
    "매수세",
    f.ok&&f.buyPct!=null
     ?percent(f.buyPct)
     :"데이터 없음",
    "good"
   )}

   ${metric(
    "매도세",
    f.ok&&f.sellPct!=null
     ?percent(f.sellPct)
     :"데이터 없음",
    "bad"
   )}

   ${metric(
    "매집/분산",
    f.ok
     ?f.label
     :"데이터 없음"
   )}

   ${metric(
    "판단",
    f.ok
     ?f.score>=60
      ?"🟢 매집 우세"
      :f.score<=40
       ?"🔴 분산 우세"
       :"🟡 중립"
     :"⚪ 보류"
   )}

  </div>

  <div
   class="small muted"
   style="margin-top:10px">

   가격과 거래량을 이용한
   추정 수급 분석입니다.

  </div>
  `
 )

 /* 공매도 */

 +
 card(
  "🔥 공매도",

  `
  <div class="grid">

   ${metric(
    "Short Interest",
    si.ok&&si.currentShort!=null
     ?number(si.currentShort,0)
     :"데이터 없음"
   )}

   ${metric(
    "증감",
    si.ok
     ?percent(si.changePercent)
     :"데이터 없음"
   )}

   ${metric(
    "Days to Cover",
    si.ok&&si.daysToCover!=null
     ?number(si.daysToCover,2)
     :"데이터 없음"
   )}

   ${metric(
    "공매 압력",
    shortP
   )}

  </div>

  <div
   class="small muted"
   style="margin-top:10px">

   ${
    si.ok
     ?"FINRA Short Interest 기준"
     :"FINRA Short Interest 데이터 없음"
   }

  </div>
  `
 )

 /* Reg SHO */

 +
 card(
  "📊 Reg SHO",

  `
  <div class="grid">

   ${metric(
    "최근 공매 비중",
    rs.ok&&rs.latest?.shortPct!=null
     ?percent(rs.latest.shortPct)
     :"데이터 없음"
   )}

   ${metric(
    "전일 대비",
    rs.ok&&
    rs.latest?.shortPct!=null&&
    rs.previous?.shortPct!=null

     ?percent(
       rs.latest.shortPct-
       rs.previous.shortPct
      )

     :"데이터 없음"
   )}

   ${metric(
    "Reg SHO 압력",
    regP
   )}

   ${metric(
    "최근 날짜",
    rs.ok&&rs.latest?.date
     ?esc(rs.latest.date)
     :"데이터 없음"
   )}

  </div>

  <div
   class="small muted"
   style="margin-top:10px">

   ${
    rs.ok
     ?"FINRA Reg SHO Daily 기준"
     :"Reg SHO 데이터 없음"
   }

  </div>
  `
 )

 /* 희석 */

 +
 card(
  "💵 희석",

  `
  <div class="grid">

   ${metric(
    "희석 위험",
    dilutionRisk
   )}

   ${metric(
    "최근 등록",
    di.latestFiling
     ?esc(di.latestFiling.form)
     :"없음"
   )}

  </div>

  <div
   class="small muted"
   style="margin-top:10px">

   ${
    di.note
     ?esc(di.note)
     :"SEC 데이터 부족"
   }

  </div>
  `
 )

 /* 워런트 */

 +
 card(
  "🎫 워런트",

  `
  <div class="small">

   SEC 공시에서 확인되는
   워런트 관련 정보를 표시합니다.

   <br><br>

   자동으로 확인되지 않은 수치는
   임의로 만들지 않습니다.

  </div>
  `
 )

 /* 추세 */

 +
 card(
  "📈 추세",

  `
  <div class="grid">

   ${metric(
    "단기",
    trend
   )}

   ${metric(
    "거래량",
    volumeTrend
   )}

   ${metric(
    "모멘텀",
    momentum
   )}

   ${metric(
    "52주 위치",
    position
   )}

  </div>
  `
 )

 /* SEC */

 +
 card(
  "📑 SEC 공시",
  sec
 )

 /* 뉴스 */

 +
 card(
  "📰 뉴스",
  news
 )

 /* 최종 */

 +
 card(
  "🐇 최종 결론",

  `
  <div class="score">

   ${
    an.score==null
     ?"—"
     :an.score+" / 100"
   }

  </div>

  <h3>
  ${vTitle}
  </h3>

  <div>
  ${vText}
  </div>

  <br>

  <div class="small">

  <b>현재 판단</b><br>

  ${
   an.score>=60
    ?"상승 요인이 일부 우세하지만 현재 추세와 위험요인을 함께 확인해야 합니다."
    :an.score>=45
     ?"상승과 하락 신호가 혼재되어 있어 방향성이 확실하지 않습니다."
     :"현재는 하락 요인이 우세합니다."
  }

  <br><br>

  <b>공매도</b> ${shortP}<br>

  <b>Reg SHO</b> ${regP}<br>

  <b>희석</b> ${dilutionRisk}<br>

  <b>매집/분산</b>
  ${
   f.ok
    ?f.label
    :"데이터 없음"
  }

  </div>

  <div
   class="small muted"
   style="margin-top:12px">

   데이터가 없는 항목은
   0으로 처리하지 않습니다.

  </div>

  `
 );

 drawChart();

}


/* =========================
   화면 회전 / 크기 변경
========================= */

window.addEventListener(
 "resize",
 ()=>{
  if(chartData.length){
   drawChart();
  }
 }
);


/* =========================
   엔터키
========================= */

document
