<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RabbitStock Ultimate</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;
 padding:0;
 background:#070b14;
 color:#eef2ff;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
body{padding-bottom:40px}
button,input{font:inherit}

.app{
 max-width:760px;
 margin:auto;
 padding:14px;
}

/* HEADER */
.header{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:14px;
}
.logo{
 font-size:22px;
 font-weight:900;
 letter-spacing:-1px;
}
.logo span{color:#7c8cff}
.status{
 font-size:11px;
 color:#8e9ab5;
 display:flex;
 align-items:center;
 gap:6px;
}
.dot{
 width:7px;
 height:7px;
 border-radius:50%;
 background:#666;
}
.dot.ok{background:#31d17c}
.dot.bad{background:#ff5364}

/* SEARCH */
.search{
 display:flex;
 gap:8px;
 margin-bottom:14px;
}
.search input{
 flex:1;
 min-width:0;
 background:#101725;
 border:1px solid #263149;
 border-radius:12px;
 padding:13px 14px;
 color:#fff;
 outline:none;
 font-size:16px;
 font-weight:700;
 text-transform:uppercase;
}
.search button{
 border:0;
 border-radius:12px;
 padding:0 18px;
 background:#6575ff;
 color:#fff;
 font-weight:800;
}

/* PRICE */
.priceCard{
 background:linear-gradient(145deg,#111a2a,#0b111d);
 border:1px solid #202c43;
 border-radius:18px;
 padding:18px;
 margin-bottom:12px;
 box-shadow:0 10px 30px rgba(0,0,0,.22);
}
.symbolRow{
 display:flex;
 justify-content:space-between;
 align-items:flex-start;
}
.symbol{
 font-size:25px;
 font-weight:900;
}
.company{
 margin-top:4px;
 color:#8793aa;
 font-size:12px;
}
.price{
 font-size:34px;
 font-weight:900;
 margin-top:14px;
 letter-spacing:-1px;
}
.change{
 margin-top:3px;
 font-size:16px;
 font-weight:800;
}
.up{color:#39d98a}
.down{color:#ff5b6e}
.neutral{color:#9ca7bb}
.meta{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:8px;
 margin-top:18px;
}
.metaBox{
 background:#0b111d;
 border:1px solid #1d2739;
 border-radius:11px;
 padding:10px;
}
.metaBox small{
 display:block;
 color:#77849d;
 font-size:10px;
 margin-bottom:4px;
}
.metaBox b{
 font-size:12px;
}

/* JUDGMENT */
.judge{
 background:#0d1421;
 border:1px solid #26344d;
 border-radius:18px;
 padding:18px;
 margin-bottom:12px;
}
.judgeTitle{
 color:#8d9ab1;
 font-size:12px;
 font-weight:700;
}
.judgeMain{
 display:flex;
 align-items:center;
 gap:16px;
 margin-top:12px;
}
.score{
 width:82px;
 height:82px;
 border-radius:50%;
 display:flex;
 align-items:center;
 justify-content:center;
 flex-direction:column;
 background:#131d30;
 border:5px solid #6675ff;
 flex-shrink:0;
}
.score b{font-size:27px}
.score small{font-size:9px;color:#8894aa}
.judgeText b{
 display:block;
 font-size:20px;
 margin-bottom:5px;
}
.judgeText span{
 font-size:12px;
 color:#929eb4;
 line-height:1.5;
}
.scoreBar{
 height:7px;
 border-radius:99px;
 background:#202a3b;
 overflow:hidden;
 margin-top:16px;
}
.scoreFill{
 height:100%;
 width:0;
 background:#6878ff;
 transition:.5s;
}
.reasons{
 margin-top:14px;
 display:grid;
 gap:7px;
}
.reason{
 font-size:12px;
 line-height:1.45;
 padding:9px 10px;
 border-radius:9px;
 background:#101927;
 border:1px solid #1c283b;
}

/* CHART */
.chartCard{
 background:#0c121e;
 border:1px solid #202d43;
 border-radius:18px;
 padding:12px;
 margin-bottom:12px;
}
.chartHeader{
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:3px 4px 10px;
}
.chartHeader b{font-size:14px}
.chartHeader span{
 color:#74819a;
 font-size:10px;
}
.canvasWrap{
 position:relative;
 width:100%;
 height:350px;
 overflow:hidden;
 border-radius:12px;
 background:#080e18;
}
#chart{
 width:100%;
 height:100%;
 display:block;
 touch-action:none;
}
.chartTip{
 position:absolute;
 display:none;
 pointer-events:none;
 background:rgba(10,16,27,.96);
 border:1px solid #33425c;
 border-radius:9px;
 padding:8px;
 font-size:10px;
 line-height:1.55;
 z-index:5;
 min-width:125px;
}

/* INDICATORS */
.sectionTitle{
 font-size:13px;
 font-weight:900;
 margin:18px 2px 9px;
}
.signalGrid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:9px;
}
.signal{
 background:#0d1420;
 border:1px solid #202c41;
 border-radius:14px;
 padding:13px;
}
.signal small{
 display:block;
 color:#78859c;
 font-size:10px;
 margin-bottom:6px;
}
.signal b{
 font-size:15px;
}
.signal p{
 margin:6px 0 0;
 color:#8793a8;
 font-size:10px;
 line-height:1.4;
}

/* DETAILS */
details{
 background:#0c131f;
 border:1px solid #202c40;
 border-radius:14px;
 margin-top:9px;
 overflow:hidden;
}
summary{
 list-style:none;
 cursor:pointer;
 padding:14px;
 font-size:13px;
 font-weight:800;
}
summary::-webkit-details-marker{display:none}
summary:after{
 content:"+";
 float:right;
 color:#6e7b93;
 font-size:18px;
 line-height:12px;
}
details[open] summary:after{content:"−"}
.detailBody{
 padding:0 13px 13px;
 border-top:1px solid #1c2739;
}
.infoRow{
 display:flex;
 justify-content:space-between;
 gap:10px;
 padding:9px 0;
 border-bottom:1px solid #182235;
 font-size:11px;
}
.infoRow:last-child{border-bottom:0}
.infoRow span:first-child{color:#748199}
.infoRow span:last-child{
 text-align:right;
 font-weight:700;
 word-break:break-word;
}
.tableWrap{overflow-x:auto}
table{
 width:100%;
 border-collapse:collapse;
 font-size:10px;
 min-width:620px;
}
th,td{
 padding:8px 6px;
 border-bottom:1px solid #1a2537;
 text-align:right;
 white-space:nowrap;
}
th{
 color:#75829a;
 font-weight:700;
}
td:first-child,th:first-child{text-align:left}

.source{
 margin-top:9px;
 padding:9px;
 background:#09101a;
 border-radius:9px;
 font-size:10px;
 color:#78859b;
 line-height:1.5;
}
.source a{
 color:#7f90ff;
 text-decoration:none;
}

.newsItem{
 padding:11px 0;
 border-bottom:1px solid #192437;
}
.newsItem:last-child{border-bottom:0}
.newsTitle{
 font-size:12px;
 font-weight:800;
 line-height:1.4;
}
.newsMeta{
 margin-top:4px;
 color:#707d95;
 font-size:9px;
}
.newsDesc{
 margin-top:5px;
 color:#8a96aa;
 font-size:10px;
 line-height:1.45;
}
.newsItem a{
 display:inline-block;
 margin-top:7px;
 color:#8290ff;
 text-decoration:none;
 font-size:10px;
 font-weight:700;
}

.loading{
 text-align:center;
 padding:30px 10px;
 color:#718099;
 font-size:12px;
}
.error{
 color:#ff6474;
 background:#24121a;
 border:1px solid #4b202d;
 border-radius:10px;
 padding:12px;
 font-size:11px;
 line-height:1.5;
}
.empty{
 color:#68758d;
 padding:15px 0;
 text-align:center;
 font-size:11px;
}

@media(max-width:420px){
 .app{padding:10px}
 .price{font-size:30px}
 .meta{grid-template-columns:repeat(3,1fr)}
 .metaBox{padding:8px 6px}
 .metaBox b{font-size:11px}
 .canvasWrap{height:310px}
}
</style>
</head>

<body>
<div class="app">

 <div class="header">
  <div class="logo">🐰 RabbitStock <span>ULTIMATE</span></div>
  <div class="status">
   <i id="statusDot" class="dot"></i>
   <span id="statusText">연결 확인 중</span>
  </div>
 </div>

 <div class="search">
  <input id="ticker" value="BRNX" placeholder="티커 입력">
  <button onclick="loadStock()">분석</button>
 </div>

 <div id="main">
  <div class="loading">데이터를 불러오는 중...</div>
 </div>

</div>

<script>
const API_BASE="https://rabbitstock-final.keoss.workers.dev";

let STATE=null;
let candleData=[];
let chartCanvas=null;
let chartCtx=null;
let chartRect=null;

const $=id=>document.getElementById(id);

function esc(v){
 if(v===null||v===undefined)return "";
 return String(v).replace(/[&<>"']/g,m=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#039;"
 }[m]));
}

function num(v){
 const n=Number(v);
 return Number.isFinite(n)?n:null;
}

function fmt(v,d=2){
 const n=num(v);
 if(n===null)return "데이터 없음";
 return n.toLocaleString("en-US",{
  minimumFractionDigits:d,
  maximumFractionDigits:d
 });
}

function compact(v){
 const n=num(v);
 if(n===null)return "데이터 없음";
 if(Math.abs(n)>=1e9)return (n/1e9).toFixed(2)+"B";
 if(Math.abs(n)>=1e6)return (n/1e6).toFixed(2)+"M";
 if(Math.abs(n)>=1e3)return (n/1e3).toFixed(2)+"K";
 return n.toLocaleString();
}

function pct(v){
 const n=num(v);
 if(n===null)return "데이터 없음";
 return (n>0?"+":"")+n.toFixed(2)+"%";
}

function pick(o,...keys){
 for(const k of keys){
  if(o && o[k]!==undefined && o[k]!==null && o[k]!=="")return o[k];
 }
 return null;
}

async function getJSON(url){
 const r=await fetch(url,{cache:"no-store"});
 if(!r.ok)throw new Error("HTTP "+r.status);
 return await r.json();
}

async function loadStock(){
 const symbol=$("ticker").value.trim().toUpperCase();
 if(!symbol)return;

 $("main").innerHTML='<div class="loading">📡 '+esc(symbol)+' 데이터를 통합 분석 중...</div>';
 $("statusDot").className="dot";
 $("statusText").textContent="분석 중";

 try{
  const data=await getJSON(API_BASE+"/all?symbol="+encodeURIComponent(symbol));
  STATE=data;

  if(data && data.ok===false){
   throw new Error(data.error||"API 오류");
  }

  $("statusDot").className="dot ok";
  $("statusText").textContent="API 연결 정상";

  render(data,symbol);

 }catch(e){
  console.error(e);
  $("statusDot").className="dot bad";
  $("statusText").textContent="데이터 오류";

  $("main").innerHTML=
   '<div class="error">데이터를 가져오지 못했습니다.<br><br>'+
   esc(e.message)+
   '<br><br>Worker 주소와 API 상태를 확인해주세요.</div>';
 }
}

function getQuote(data){
 return data.quote||data.twelve?.quote||data.twelveData?.quote||{};
}

function getHistory(data){
 let h=
  data.history||
  data.priceHistory||
  data.twelve?.history||
  data.twelveData?.history||
  [];

 if(!Array.isArray(h) && h?.values)h=h.values;
 if(!Array.isArray(h))h=[];

 return h.map(x=>({
  date:pick(x,"date","datetime","timestamp","time"),
  open:num(pick(x,"open","o")),
  high:num(pick(x,"high","h")),
  low:num(pick(x,"low","l")),
  close:num(pick(x,"close","c")),
  volume:num(pick(x,"volume","v"))
 })).filter(x=>x.date&&x.close!==null);
}

function calcTechnical(history){
 const closes=history.map(x=>x.close).filter(Number.isFinite);
 const vols=history.map(x=>x.volume).filter(Number.isFinite);

 function sma(n){
  if(closes.length<n)return null;
  const a=closes.slice(-n);
  return a.reduce((s,v)=>s+v,0)/a.length;
 }

 function rsi(n=14){
  if(closes.length<n+1)return null;

  let gain=0,loss=0;
  for(let i=closes.length-n;i<closes.length;i++){
   const d=closes[i]-closes[i-1];
   if(d>0)gain+=d;
   else loss-=d;
  }

  if(loss===0)return 100;
  const rs=(gain/n)/(loss/n);
  return 100-(100/(1+rs));
 }

 function vwap(){
  const a=history.slice(-20);
  let pv=0,v=0;
  for(const x of a){
   if(x.close===null||x.volume===null)continue;
   pv+=x.close*x.volume;
   v+=x.volume;
  }
  return v?pv/v:null;
 }

 function obv(){
  if(closes.length<2)return null;
  let o=0;
  for(let i=1;i<history.length;i++){
   const a=history[i-1],b=history[i];
   if(!Number.isFinite(a.close)||!Number.isFinite(b.close)||!Number.isFinite(b.volume))continue;
   if(b.close>a.close)o+=b.volume;
   else if(b.close<a.close)o-=b.volume;
  }
  return o;
 }

 return {
  ma20:sma(20),
  ma50:sma(50),
  rsi:rsi(),
  vwap:vwap(),
  obv:obv(),
  avgVol:vols.length?vols.slice(-20).reduce((a,b)=>a+b,0)/Math.min(20,vols.length):null
 };
}

function calcScore(q,t,data){
 let score=50;
 const reasons=[];

 const price=num(pick(q,"close","price","last","regularMarketPrice"));
 const change=num(pick(q,"percent_change","percentChange","change_percent","changePercent"));

 if(change!==null){
  if(change>5){score+=15;reasons.push("단기 상승 탄력이 강함")}
  else if(change>1){score+=8;reasons.push("단기 상승 흐름")}
  else if(change< -5){score-=15;reasons.push("단기 하락 압력이 강함")}
  else if(change< -1){score-=8;reasons.push("단기 하락 흐름")}
 }

 if(price!==null&&t.ma20!==null){
  if(price>t.ma20){
   score+=7;
   reasons.push("현재가가 MA20 위 → 단기 추세 우위");
  }else{
   score-=7;
   reasons.push("현재가가 MA20 아래 → 단기 추세 약세");
  }
 }

 if(price!==null&&t.ma50!==null){
  if(price>t.ma50){
   score+=5;
   reasons.push("현재가가 MA50 위 → 중기 추세 우위");
  }else{
   score-=5;
   reasons.push("현재가가 MA50 아래 → 중기 추세 약세");
  }
 }

 if(t.rsi!==null){
  if(t.rsi>=70){
   score-=3;
   reasons.push("RSI 70 이상 → 단기 과열 가능성");
  }else if(t.rsi<=30){
   score+=5;
   reasons.push("RSI 30 이하 → 과매도 반등 가능성");
  }else if(t.rsi>=50){
   score+=4;
   reasons.push("RSI 50 이상 → 매수 힘이 상대적으로 우세");
  }
 }

 if(price!==null&&t.vwap!==null){
  if(price>t.vwap){
   score+=5;
   reasons.push("현재가가 VWAP 위 → 거래량 기준 매수 우위");
  }else{
   score-=5;
   reasons.push("현재가가 VWAP 아래 → 거래량 기준 약세");
  }
 }

 const shortObj=data.finra||data.short||data.shortInterest||{};
 const shortPct=num(pick(
  shortObj,
  "shortPercent","shortPercentFloat","short_interest_percent"
 ));

 if(shortPct!==null){
  if(shortPct>=20){
   score+=4;
   reasons.push("공매도 비중이 높아 숏커버 변동성 가능");
  }else if(shortPct>=10){
   score+=2;
   reasons.push("공매도 비중이 유의미한 수준");
  }
 }

 score=Math.max(0,Math.min(100,Math.round(score)));

 let label="중립";
 if(score>=80)label="강한 상승 우위";
 else if(score>=65)label="상승 우위";
 else if(score>=55)label="약한 상승 우위";
 else if(score<=30)label="강한 하락 위험";
 else if(score<=44)label="하락 우위";

 return {score,label,reasons};
}

function render(data,symbol){
 const q=getQuote(data);
 const history=getHistory(data);

 candleData=history.slice(-120);
 const t=calcTechnical(history);

 const price=num(pick(q,"close","price","last","regularMarketPrice"));
 const change=num(pick(q,"percent_change","percentChange","change_percent","changePercent"));
 const volume=num(pick(q,"volume","day_volume","regularMarketVolume"));

 const company=pick(
  data.company?.name,
  data.profile?.name,
  q.name,
  data.name
 )||symbol;

 const judgment=calcScore(q,t,data);

 const html=`
  ${priceSection(symbol,company,price,change,volume,q)}
  ${judgmentSection(judgment)}
  ${chartSection()}
  ${technicalSection(t,price)}
  ${shortSection(data)}
  ${thresholdSection(data)}
  ${dilutionSection(data)}
  ${warrantSection(data)}
  ${finraSection(data)}
  ${secSection(data)}
  ${newsSection(data)}
  ${stockTitanSection(data)}
  ${priceTable(history)}
  ${sourceSection(data)}
 `;

 $("main").innerHTML=html;

 setTimeout(()=>{
  initChart();
 },30);
}

function priceSection(symbol,company,price,change,volume,q){
 const cls=change>0?"up":change<0?"down":"neutral";

 return `
 <div class="priceCard">
  <div class="symbolRow">
   <div>
    <div class="symbol">${esc(symbol)}</div>
    <div class="company">${esc(company)}</div>
   </div>
   <div style="text-align:right">
    <div style="font-size:10px;color:#728099">현재가</div>
   </div>
  </div>

  <div class="price">${price===null?"데이터 없음":"$"+fmt(price,4)}</div>
  <div class="change ${cls}">
   ${change===null?"데이터 없음":pct(change)}
  </div>

  <div class="meta">
   <div class="metaBox">
    <small>거래량</small>
    <b>${compact(volume)}</b>
   </div>
   <div class="metaBox">
    <small>전일 종가</small>
    <b>${fmt(pick(q,"previous_close","previousClose","prev_close"))}</b>
   </div>
   <div class="metaBox">
    <small>거래일</small>
    <b>${esc(pick(q,"datetime","date")||"데이터 없음")}</b>
   </div>
  </div>
 </div>`;
}

function judgmentSection(j){
 return `
 <div class="judge">
  <div class="judgeTitle">종합 판단</div>

  <div class="judgeMain">
   <div class="score">
    <b>${j.score}</b>
    <small>/ 100</small>
   </div>
   <div class="judgeText">
    <b>${j.label}</b>
    <span>
     주가·추세·RSI·VWAP·공매도 등 확인 가능한 데이터를 종합한 참고 점수입니다.
    </span>
   </div>
  </div>

  <div class="scoreBar">
   <div class="scoreFill" style="width:${j.score}%"></div>
  </div>

  <div class="reasons">
   ${j.reasons.length?
    j.reasons.map(x=>`<div class="reason">• ${esc(x)}</div>`).join("")
    :'<div class="reason">확인 가능한 분석 데이터가 부족합니다.</div>'}
  </div>
 </div>`;
}

function chartSection(){
 return `
 <div class="chartCard">
  <div class="chartHeader">
   <b>📈 주가 차트</b>
   <span>캔들 + 거래량 + MA20 / MA50</span>
  </div>
  <div class="canvasWrap">
   <canvas id="chart"></canvas>
   <div id="chartTip" class="chartTip"></div>
  </div>
 </div>`;
}

function technicalSection(t,price){
 const rsi=t.rsi;
 const rsiText=rsi===null?
  "데이터 없음":
  rsi>=70?"과열 가능성":
  rsi<=30?"과매도 가능성":
  rsi>=50?"상승 힘 우세":"하락 힘 우세";

 return `
 <div class="sectionTitle">핵심 지표</div>

 <div class="signalGrid">

  <div class="signal">
   <small>MA20</small>
   <b>${fmt(t.ma20,4)}</b>
   <p>최근 20거래일 평균가. 단기 추세 확인용.</p>
  </div>

  <div class="signal">
   <small>MA50</small>
   <b>${fmt(t.ma50,4)}</b>
   <p>최근 50거래일 평균가. 중기 추세 확인용.</p>
  </div>

/* =========================
   REAL CANDLE CHART
========================= */

function initChart(){
 chartCanvas=$("chart");
 if(!chartCanvas)return;

 chartCtx=chartCanvas.getContext("2d");

 resizeCanvas();
 drawChart();

 const wrap=chartCanvas.parentElement;

 wrap.addEventListener("pointermove",chartMove);
 wrap.addEventListener("pointerdown",chartMove);
 wrap.addEventListener("pointerleave",()=>{
  $("chartTip").style.display="none";
 });

 window.addEventListener("resize",()=>{
  resizeCanvas();
  drawChart();
 });
}

function resizeCanvas(){
 if(!chartCanvas)return;

 const dpr=window.devicePixelRatio||1;
 const r=chartCanvas.getBoundingClientRect();

 chartCanvas.width=Math.floor(r.width*dpr);
 chartCanvas.height=Math.floor(r.height*dpr);

 chartCtx.setTransform(dpr,0,0,dpr,0,0);
 chartRect=r;
}

function drawChart(){
 if(!chartCtx||!candleData.length)return;

 const ctx=chartCtx;
 const w=chartRect.width;
 const h=chartRect.height;

 ctx.clearRect(0,0,w,h);

 const left=42;
 const right=8;
 const top=12;
 const bottom=58;

 const cw=w-left-right;
 const ch=h-top-bottom;

 const prices=candleData.flatMap(x=>[
  x.high,x.low
 ]).filter(Number.isFinite);

 if(!prices.length)return;

 let min=Math.min(...prices);
 let max=Math.max(...prices);

 const padding=(max-min)*.08||.01;
 min-=padding;
 max+=padding;

 function py(v){
  return top+(max-v)/(max-min)*ch;
 }

 function px(i){
  return left+(i+.5)*(cw/candleData.length);
 }

 /* background grid */
 ctx.strokeStyle="#182337";
 ctx.lineWidth=1;

 for(let i=0;i<=4;i++){
  const y=top+(ch*i/4);
  ctx.beginPath();
  ctx.moveTo(left,y);
  ctx.lineTo(w-right,y);
  ctx.stroke();

  const val=max-(max-min)*(i/4);
  ctx.fillStyle="#65728a";
  ctx.font="9px -apple-system,BlinkMacSystemFont";
  ctx.textAlign="right";
  ctx.fillText(val.toFixed(3),left-6,y+3);
 }

 /* volume */
 const volumeHeight=42;
 const maxVol=Math.max(
  ...candleData.map(x=>x.volume||0),
  1
 );

 const candleWidth=Math.max(
  2,
  Math.min(10,(cw/candleData.length)*.62)
 );

 for(let i=0;i<candleData.length;i++){
  const x=candleData[i];
  const cx=px(i);

  if(x.volume){
   const vh=(x.volume/maxVol)*volumeHeight;

   ctx.fillStyle="#26344d";
   ctx.fillRect(
    cx-candleWidth/2,
    h-8-vh,
    candleWidth,
    vh
   );
  }
 }

 /* candles */
 for(let i=0;i<candleData.length;i++){
  const x=candleData[i];
  if(
   !Number.isFinite(x.open)||
   !Number.isFinite(x.high)||
   !Number.isFinite(x.low)||
   !Number.isFinite(x.close)
  )continue;

  const cx=px(i);

  const yo=py(x.open);
  const yc=py(x.close);
  const yh=py(x.high);
  const yl=py(x.low);

  const rising=x.close>=x.open;

  ctx.strokeStyle=rising?"#38d98b":"#ff5369";
  ctx.lineWidth=1;

  ctx.beginPath();
  ctx.moveTo(cx,yh);
  ctx.lineTo(cx,yl);
  ctx.stroke();

  const bodyTop=Math.min(yo,yc);
  const bodyH=Math.max(1,Math.abs(yc-yo));

  ctx.fillStyle=rising?"#38d98b":"#ff5369";
  ctx.fillRect(
   cx-candleWidth/2,
   bodyTop,
   candleWidth,
   bodyH
  );
 }

 /* MA lines */
 drawMA(ctx,20,"#ffd166",py,px);
 drawMA(ctx,50,"#7da2ff",py,px);

 /* labels */
 ctx.fillStyle="#65728a";
 ctx.font="9px -apple-system,BlinkMacSystemFont";
 ctx.textAlign="left";
 ctx.fillText("VOL",left,h-7);

 ctx.fillStyle="#ffd166";
 ctx.fillText("MA20",left+35,18);

 ctx.fillStyle="#7da2ff";
 ctx.fillText("MA50",left+75,18);

 /* date labels */
 ctx.fillStyle="#59667e";
 ctx.textAlign="center";

 const step=Math.max(
  1,
  Math.ceil(candleData.length/5)
 );

 for(let i=0;i<candleData.length;i+=step){
  const d=String(candleData[i].date).slice(5,10);
  ctx.fillText(d,px(i),h-1);
 }
}

function drawMA(ctx,n,color,py,px){
 if(candleData.length<n)return;

 ctx.strokeStyle=color;
 ctx.lineWidth=1.3;
 ctx.beginPath();

 let started=false;

 for(let i=0;i<candleData.length;i++){
  if(i<n-1)continue;

  let sum=0,count=0;

  for(let j=i-n+1;j<=i;j++){
   if(Number.isFinite(candleData[j].close)){
    sum+=candleData[j].close;
    count++;
   }
  }

  if(!count)continue;

  const avg=sum/count;
  const x=px(i);
  const y=py(avg);

  if(!started){
   ctx.moveTo(x,y);
   started=true;
  }else{
   ctx.lineTo(x,y);
  }
 }

 ctx.stroke();
}

function chartMove(ev){
 if(!chartCanvas||!candleData.length)return;

 const wrap=chartCanvas.parentElement;
 const r=wrap.getBoundingClientRect();

 const x=ev.clientX-r.left;

 const left=42;
 const right=8;
 const usable=r.width-left-right;

 if(x<left||x>r.width-right)return;

 const index=Math.floor(
  (x-left)/(usable/candleData.length)
 );

 const item=candleData[
  Math.max(0,Math.min(candleData.length-1,index))
 ];

 if(!item)return;

 const tip=$("chartTip");

 tip.innerHTML=`
  <b>${esc(String(item.date).slice(0,10))}</b><br>
  시가 ${fmt(item.open,4)}<br>
  고가 ${fmt(item.high,4)}<br>
  저가 ${fmt(item.low,4)}<br>
  종가 ${fmt(item.close,4)}<br>
  거래량 ${compact(item.volume)}
 `;

 tip.style.display="block";

 let tx=x+10;

 if(tx+135>r.width)tx=x-145;

 tip.style.left=tx+"px";
 tip.style.top="12px";
}
