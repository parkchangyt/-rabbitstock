<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>RabbitStock Ultimate</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#09101e;
 color:#eef3ff;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.wrap{
 max-width:900px;
 margin:auto;
 padding:14px;
}

h1{
 font-size:23px;
 margin:4px 0 14px;
}

.search{
 display:flex;
 gap:8px;
 margin-bottom:12px;
}

input{
 flex:1;
 background:#111b2e;
 border:1px solid #293754;
 color:#fff;
 border-radius:12px;
 padding:13px;
 font-size:16px;
 text-transform:uppercase;
}

button{
 background:#2b72ff;
 border:0;
 color:white;
 border-radius:11px;
 padding:0 18px;
 font-weight:700;
}

.card{
 background:#101a2d;
 border:1px solid #22314d;
 border-radius:16px;
 padding:15px;
 margin-bottom:12px;
 box-shadow:0 5px 20px rgba(0,0,0,.18);
}

.price{
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.symbol{
 font-size:25px;
 font-weight:800;
}

.priceNum{
 font-size:28px;
 font-weight:800;
}

.sub{
 color:#8fa1bf;
 font-size:12px;
 margin-top:5px;
}

.judge{
 font-size:22px;
 font-weight:800;
 margin-bottom:8px;
}

.reason{
 color:#b8c5dc;
 line-height:1.55;
 font-size:14px;
}

.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:8px;
}

.metric{
 background:#0b1425;
 border-radius:12px;
 padding:11px;
}

.metric b{
 display:block;
 font-size:16px;
 margin-top:3px;
}

.metric span{
 color:#8fa1bf;
 font-size:11px;
}

canvas{
 width:100%;
 height:360px;
 background:#08111f;
 border-radius:12px;
 display:block;
}

details{
 background:#101a2d;
 border:1px solid #22314d;
 border-radius:15px;
 margin-bottom:10px;
 overflow:hidden;
}

summary{
 padding:15px;
 font-weight:800;
 cursor:pointer;
 list-style:none;
}

summary::-webkit-details-marker{
 display:none;
}

.section{
 padding:0 15px 15px;
}

.row{
 padding:12px 0;
 border-bottom:1px solid #202d44;
}

.row:last-child{
 border-bottom:0;
}

.label{
 color:#8fa1bf;
 font-size:12px;
 margin-bottom:3px;
}

.value{
 font-size:15px;
 line-height:1.5;
}

.explain{
 margin-top:7px;
 padding:9px;
 border-radius:10px;
 background:#0a1322;
 color:#aebbd1;
 font-size:13px;
 line-height:1.55;
}

.source{
 margin-top:8px;
 display:inline-block;
 color:#76a9ff;
 text-decoration:none;
 font-size:13px;
}

.badge{
 display:inline-block;
 padding:4px 8px;
 border-radius:8px;
 background:#17233a;
 color:#bcd0ef;
 font-size:11px;
 margin-right:5px;
}

.tableWrap{
 overflow-x:auto;
}

table{
 width:100%;
 border-collapse:collapse;
 font-size:12px;
 min-width:650px;
}

th,td{
 padding:8px 6px;
 border-bottom:1px solid #22314d;
 text-align:right;
 white-space:nowrap;
}

th:first-child,
td:first-child{
 text-align:left;
}

th{
 color:#8295b5;
 font-weight:600;
}

.linkBtn{
 display:inline-block;
 margin-top:8px;
 padding:9px 12px;
 border-radius:9px;
 background:#172844;
 color:#a9c7ff;
 text-decoration:none;
 font-size:13px;
}

.empty{
 color:#71839f;
 padding:10px 0;
}

.loading{
 text-align:center;
 color:#8fa1bf;
 padding:20px;
}

@media(max-width:600px){
 .grid{
  grid-template-columns:repeat(2,1fr);
 }
 canvas{
  height:300px;
 }
}
</style>
</head>

<body>

<div class="wrap">

<h1>🐇 RabbitStock Ultimate</h1>

<div class="search">
<input id="symbol" value="BRNX" placeholder="티커 입력">
<button onclick="load()">분석</button>
</div>

<div id="app">

<div class="card loading">
데이터를 불러오는 중...
</div>

</div>

</div>

<script>

const API =
"https://rabbitstock-final.keoss.workers.dev";

let DATA=null;
let candles=[];
let selectedIndex=-1;


/* =========================
   공통
========================= */

function esc(v){
 if(v===null || v===undefined) return "";
 return String(v)
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;");
}

function n(v,d=2){
 if(v===null || v===undefined || v==="") return "데이터 없음";
 const x=Number(v);
 if(!Number.isFinite(x)) return "데이터 없음";
 return x.toLocaleString("en-US",{
  maximumFractionDigits:d
 });
}

function pct(v){
 if(v===null || v===undefined || v==="") return "데이터 없음";
 const x=Number(v);
 if(!Number.isFinite(x)) return "데이터 없음";
 return (x>0?"+":"")+x.toFixed(2)+"%";
}

function date(v){
 if(!v) return "날짜 없음";
 return String(v).slice(0,10);
}

function link(url,text="원문 읽기"){
 if(!url) return "";
 return `<a class="source"
 target="_blank"
 rel="noopener"
 href="${esc(url)}">${esc(text)} ↗</a>`;
}

function empty(){
 return `<div class="empty">데이터 없음</div>`;
}


/* =========================
   데이터 찾기
========================= */

function pick(...a){
 for(const x of a){
  if(x!==undefined && x!==null && x!=="")
   return x;
 }
 return null;
}

function arr(...a){
 for(const x of a){
  if(Array.isArray(x)) return x;
 }
 return [];
}


/* =========================
   종합판단
========================= */

function buildJudgement(d){

 const q=d.quote||{};
 const t=d.technical||d.technicals||{};

 let score=pick(
  d.score?.total,
  d.score?.overall,
  d.totalScore,
  d.overallScore
 );

 let reasons=[];

 const rsi=Number(pick(t.rsi,d.rsi));
 const ma20=Number(pick(t.ma20,d.ma20));
 const ma50=Number(pick(t.ma50,d.ma50));
 const price=Number(pick(q.price,d.price));

 if(Number.isFinite(price)&&Number.isFinite(ma20)){
  reasons.push(
   price>=ma20
   ? "현재가가 MA20 위에 있어 단기 추세가 상대적으로 강한 상태입니다."
   : "현재가가 MA20 아래에 있어 단기 추세가 약한 상태입니다."
  );
 }

 if(Number.isFinite(price)&&Number.isFinite(ma50)){
  reasons.push(
   price>=ma50
   ? "현재가가 MA50 위에 있어 중기 추세가 유지되고 있습니다."
   : "현재가가 MA50 아래에 있어 중기 추세가 약합니다."
  );
 }

 if(Number.isFinite(rsi)){
  if(rsi>=70)
   reasons.push("RSI가 70 이상으로 단기 과열 가능성을 확인해야 합니다.");
  else if(rsi<=30)
   reasons.push("RSI가 30 이하로 단기 과매도 구간일 가능성이 있습니다.");
  else
   reasons.push("RSI는 극단적인 과열·과매도 구간은 아닙니다.");
 }

 const short=d.short||d.finra||{};
 const si=pick(
  short.currentShortPositionQuantity,
  short.shortInterest,
  short.current
 );

 if(si!==null){
  reasons.push(
   `공매도 잔고 데이터가 확인됩니다: ${n(si,0)}주.`
  );
 }

 const th=d.threshold||d.regsho||{};
 if(th && (
  th.isThreshold ||
  th.thresholdListFlag==="Y" ||
  th.regShoThresholdFlag==="Y"
  )){
  reasons.push(
   "Threshold/Reg SHO 관련 데이터가 확인되어 결제 실패 및 공매도 규제 데이터를 함께 확인해야 합니다."
  );
 }

 const dil=d.dilution||{};
 if(dil.possible===true || dil.dilutionPossible===true){
  reasons.push(
   "공시상 추가 주식 발행 또는 전환에 따른 희석 가능성을 확인해야 합니다."
  );
 }

 if(!reasons.length){
  reasons.push("확인 가능한 데이터가 부족하여 방향을 단정하지 않습니다.");
 }

 let title="중립 / 추가 확인";

 if(Number.isFinite(Number(score))){
  const s=Number(score);
  if(s>=75) title="강한 긍정";
  else if(s>=60) title="긍정";
  else if(s<=30) title="강한 부정";
  else if(s<=45) title="주의";
 }

 return {
  title,
  score,
  reasons
 };
}


/* =========================
   HTML
========================= */

function render(d){

 DATA=d;

 const q=d.quote||{};
 const t=d.technical||d.technicals||{};
 const j=buildJudgement(d);

 const symbol=String(
  pick(d.symbol,q.symbol,
  document.getElementById("symbol").value)
 ).toUpperCase();

 const price=pick(q.price,d.price);

 const change=pick(
  q.percent_change,
  q.change_percent,
  q.changePercent,
  d.changePercent
 );

 const volume=pick(
  q.volume,
  d.volume
 );

 candles=arr(
  d.history,
  d.prices,
  d.timeSeries,
  d.timeseries
 );

 document.getElementById("app").innerHTML=`

 <div class="card">

  <div class="price">

   <div>
    <div class="symbol">${esc(symbol)}</div>
    <div class="sub">
     현재가 · 거래량 · 공식/계산 데이터 구분
    </div>
   </div>

   <div style="text-align:right">
    <div class="priceNum">$${n(price,4)}</div>
    <div class="sub">${pct(change)}</div>
   </div>

  </div>

  <div style="margin-top:12px">
   <span class="badge">
    Volume ${n(volume,0)}
   </span>

   <span class="badge">
    데이터 기준 ${esc(
     pick(q.datetime,q.date,d.asOf,"확인 시점")
    )}
   </span>
  </div>

 </div>


 <div class="card">

  <div class="judge">${esc(j.title)}</div>

  ${
   j.score!==null
   ? `<div class="sub">종합점수 ${n(j.score,1)} / 100</div>`
   : `<div class="sub">종합점수 데이터 없음</div>`
  }

  <div style="margin-top:10px">

   ${j.reasons.map(x=>
    `<div class="reason">• ${esc(x)}</div>`
   ).join("")}

  </div>

 </div>


 <div class="card">

  <div style="font-weight:800;margin-bottom:10px">
   📊 주요 기술지표
  </div>

  <div class="grid">

   <div class="metric">
    <span>MA20 · 20일 이동평균</span>
    <b>${n(pick(t.ma20,d.ma20),4)}</b>
   </div>

   <div class="metric">
    <span>MA50 · 50일 이동평균</span>
    <b>${n(pick(t.ma50,d.ma50),4)}</b>
   </div>

   <div class="metric">
    <span>RSI · 상대강도지수</span>
    <b>${n(pick(t.rsi,d.rsi),2)}</b>
   </div>

   <div class="metric">
    <span>VWAP · 거래량가중평균</span>
    <b>${n(pick(t.vwap,d.vwap),4)}</b>
   </div>

   <div class="metric">
    <span>OBV · 거래량 흐름</span>
    <b>${n(pick(t.obv,d.obv),0)}</b>
   </div>

   <div class="metric">
    <span>Volume Ratio · 거래량비율</span>
    <b>${n(pick(t.volumeRatio,d.volumeRatio),2)}</b>
   </div>

  </div>

  <div class="explain">

   <b>MA20</b> — 최근 20거래일 평균가격. 단기 추세 확인<br>
   <b>MA50</b> — 최근 50거래일 평균가격. 중기 추세 확인<br>
   <b>RSI</b> — 최근 상승·하락 힘. 70 이상 과열, 30 이하 과매도 참고<br>
   <b>VWAP</b> — 거래량을 반영한 평균가격<br>
   <b>OBV</b> — 거래량을 이용한 매집·분산 흐름 참고

  </div>

 </div>


 <div class="card">

  <div style="font-weight:800;margin-bottom:10px">
   🕯️ 캔들차트
  </div>

  <canvas id="chart"></canvas>

  <div id="chartInfo"
   class="explain">
   캔들을 누르면 날짜별 시가·고가·저가·종가·거래량을 볼 수 있습니다.
  </div>

 </div>


 ${shortHTML(d)}

 ${thresholdHTML(d)}

 ${darkPoolHTML(d)}

 ${dilutionHTML(d)}

 ${warrantHTML(d)}

 ${secHTML(d)}

 ${stockTitanHTML(d)}

 ${newsHTML(d)}

 ${historyHTML(d)}

 <div class="card">

  <div style="font-weight:800;margin-bottom:8px">
   ℹ️ 데이터 기준
  </div>

  <div class="reason">
   공식 데이터와 계산 데이터를 구분합니다.
   확인되지 않은 값은 임의로 0으로 만들지 않고
   <b>데이터 없음</b>으로 표시합니다.
  </div>

  <div class="sub" style="margin-top:8px">
   SEC EDGAR · FINRA · Twelve Data · Finnhub · StockTitan
  </div>

 </div>
 `;

 drawChart();

}


/* =========================
   공매도
========================= */

function shortHTML(d){

 const x=d.short||d.finra||{};

 const si=pick(
  x.currentShortPositionQuantity,
  x.shortInterest,
  x.current
 );

 const prev=pick(
  x.previousShortPositionQuantity,
  x.previous,
  x.previousShort
 );

 const avg=pick(
  x.averageDailyVolumeQuantity,
  x.averageVolume
 );

 const days=pick(
  x.daysToCoverQuantity,
  x.daysToCover
 );

 const change=pick(
  x.changePreviousNumber,
  x.change,
  x.changePercent
 );

 return `

 <details>

 <summary>
  🔥 Short Interest · 공매도 잔고
 </summary>

 <div class="section">

  <div class="row">
   <div class="label">Current Short Interest · 현재 공매도 잔고</div>
   <div class="value">${n(si,0)}주</div>
  </div>

  <div class="row">
   <div class="label">Previous · 이전 공매도 잔고</div>
   <div class="value">${n(prev,0)}주</div>
  </div>

  <div class="row">
   <div class="label">Change · 증감</div>
   <div class="value">${n(change,2)}</div>
  </div>

  <div class="row">
   <div class="label">Average Daily Volume · 평균 거래량</div>
   <div class="value">${n(avg,0)}주</div>
  </div>

  <div class="row">
   <div class="label">Days to Cover · 청산 예상일수</div>
   <div class="value">${n(days,2)}</div>
  </div>

  <div class="explain">
   <b>Short Interest (공매도 잔고)</b><br>
   보고된 공매도 포지션 규모입니다.<br><br>

   <b>Days to Cover (청산 예상일수)</b><br>
   평균 거래량을 기준으로 공매도 물량을
   청산하는 데 필요한 예상 거래일입니다.<br><br>

   공매도 잔고가 많다는 사실만으로
   주가 상승이나 하락을 확정할 수 없습니다.
  </div>

  ${link(
   x.sourceUrl||
   "https://www.finra.org/filing-reporting/regulatory-filing-systems/short-interest",
   "FINRA 원문"
  )}

 </div>

 </details>
 `;
}


/* =========================
   Threshold / Reg SHO
========================= */

function thresholdHTML(d){

 const x=d.threshold||d.regsho||{};

 const rows=arr(
  x.rows,
  x.data,
  x.items
 );

 let html="";

 if(rows.length){

  html=rows.slice(0,20).map(r=>`

   <div class="row">

    <div class="label">
     ${esc(pick(r.tradeDate,r.date))}
    </div>

    <div class="value">

     Threshold:
     <b>${esc(pick(
      r.thresholdListFlag,
      r.threshold,
      "데이터 없음"
     ))}</b>

     · Reg SHO:
     <b>${esc(pick(
      r.regShoThresholdFlag,
      r.regSho,
      "데이터 없음"
     ))}</b>

    </div>

   </div>

  `).join("");

 }else{

  html=`

   <div class="row">
    <div class="label">Threshold</div>
    <div class="value">
     ${pick(
      x.thresholdListFlag,
      x.isThreshold
     )===true ||
     x.thresholdListFlag==="Y"
     ? "등재 확인"
     : "데이터 없음"}
    </div>
   </div>

   <div class="row">
    <div class="label">Reg SHO</div>
    <div class="value">
     ${pick(
      x.regShoThresholdFlag,
      x.regSho
     )==="Y"
     ? "확인"
     : "데이터 없음"}
    </div>
   </div>

  `;
 }

 return `

 <details>

 <summary>
  🚨 Reg SHO / Threshold · 공매도 규제·결제실패
 </summary>

 <div class="section">

  ${html}

  <div class="explain">
   <b>Reg SHO</b> — 미국 공매도 관련 규정입니다.<br><br>

   <b>Threshold</b> — 결제 실패가 일정 기준을
   충족해 Threshold List에 포함되는 종목입니다.<br><br>

   Threshold 등재 자체를
   '무조건 상승 신호'로 해석하면 안 됩니다.
   실제 등재일과 지속기간을 함께 봐야 합니다.
  </div>

  ${link(
   x.sourceUrl||
   "https://developer.finra.org/docs",
   "FINRA 공식 데이터"
  )}

 </div>

 </details>
 `;
}


/* =========================
   Dark Pool
========================= */

function darkPoolHTML(d){

 const x=d.darkpool||d.darkPool||{};

 const rows=arr(
  x.rows,
  x.data,
  x.items
 );

 let body="";

 if(rows.length){

  body=rows.slice(0,20).map(r=>`

   <div class="row">

    <div class="label">${esc(
     pick(r.date,r.tradeDate,r.summaryStartDate)
    )}</div>

    <div class="value">

     거래량:
     ${n(pick(
      r.shareQuantity,
      r.totalShareQuantity,
      r.volume
     ),0)}

     · 비중:
     ${n(pick(
      r.percent,
      r.sharePercent,
      r.ATSSharePercent
     ),2)}%

    </div>

   </div>

  `).join("");

 }else{

  body=empty();

 }

 return `

 <details>

 <summary>
  🌑 Dark Pool · 비공개/대체 거래
 </summary>

 <div class="section">

  ${body}

  <div class="explain">
   <b>Dark Pool</b>은 공개 거래소 밖에서
   기관·대량 거래가 이루어지는 시장을 의미합니다.<br><br>

   주의:
   <b>공매도 거래량 = Dark Pool 거래량</b>이 아닙니다.
   서로 다른 데이터입니다.
  </div>

  ${link(
   x.sourceUrl||
   "https://developer.finra.org/catalog",
   "FINRA 데이터 설명"
  )}

 </div>

 </details>
 `;
}


/* =========================
   희석
========================= */

function dilutionHTML(d){

 const x=d.dilution||{};

 const rows=arr(
  x.rows,
  x.items,
  x.data
 );

 let body="";

 if(rows.length){

  body=rows.slice(0,20).map(r=>`

   <div class="row">

    <div class="label">${esc(
     pick(r.title,r.form,r.date)
    )}</div>

    <div class="value">
     ${esc(pick(
      r.summary,
      r.description,
      r.text,
      "내용 확인 필요"
     ))}
    </div>

    ${
     pick(r.shares,r.quantity,r.amount)!==null
     ? `<div class="sub">
       수량: ${n(pick(r.shares,r.quantity,r.amount),0)}
       </div>`
     : ""
    }

    ${link(r.url||r.sourceUrl)}

   </div>

  `).join("");

 }else{

/* =========================
   캔들차트
========================= */

function drawChart(){

 const canvas=document.getElementById("chart");
 if(!canvas || !candles.length) return;

 const rect=canvas.getBoundingClientRect();

 const dpr=window.devicePixelRatio||1;

 canvas.width=rect.width*dpr;
 canvas.height=rect.height*dpr;

 const ctx=canvas.getContext("2d");

 ctx.scale(dpr,dpr);

 const W=rect.width;
 const H=rect.height;

 ctx.clearRect(0,0,W,H);

 const data=candles.slice(-60);

 const vals=[];

 data.forEach(r=>{

  const h=Number(pick(r.high,r.h));
  const l=Number(pick(r.low,r.l));

  if(Number.isFinite(h)) vals.push(h);
  if(Number.isFinite(l)) vals.push(l);

 });

 if(!vals.length) return;

 let min=Math.min(...vals);
 let max=Math.max(...vals);

 const pad=(max-min)*.08 || .1;

 min-=pad;
 max+=pad;

 const left=45;
 const right=10;
 const top=15;
 const bottom=25;

 const cw=W-left-right;
 const ch=H-top-bottom;

 function y(v){
  return top+(max-v)/(max-min)*ch;
 }

 /* grid */

 ctx.strokeStyle="#1b2940";
 ctx.lineWidth=1;

 for(let i=0;i<5;i++){

  const yy=top+(ch/4)*i;

  ctx.beginPath();
  ctx.moveTo(left,yy);
  ctx.lineTo(W-right,yy);
  ctx.stroke();

  const val=max-(max-min)*(i/4);

  ctx.fillStyle="#71839f";
  ctx.font="10px sans-serif";
  ctx.fillText(
   "$"+val.toFixed(2),
   4,
   yy+3
  );
 }

 const step=cw/data.length;
 const body=Math.max(3,step*.55);

 data.forEach((r,i)=>{

  const o=Number(pick(r.open,r.o));
  const h=Number(pick(r.high,r.h));
  const l=Number(pick(r.low,r.l));
  const c=Number(pick(r.close,r.c,r.price));

  if(![
   o,h,l,c
  ].every(Number.isFinite)) return;

  const x=left+step*i+step/2;

  ctx.strokeStyle=
   c>=o ? "#39d98a" : "#ff5d73";

  ctx.lineWidth=1;

  ctx.beginPath();

  ctx.moveTo(x,y(h));
  ctx.lineTo(x,y(l));

  ctx.stroke();

  const yy1=y(o);
  const yy2=y(c);

  const by=Math.min(yy1,yy2);
  const bh=Math.max(1,Math.abs(yy2-yy1));

  ctx.fillStyle=
   c>=o ? "#39d98a" : "#ff5d73";

  ctx.fillRect(
   x-body/2,
   by,
   body,
   bh
  );

 });

 canvas.onclick=function(e){

  const rect=canvas.getBoundingClientRect();

  const px=e.clientX-rect.left;

  let i=Math.floor(
   (px-left)/step
  );

  if(i<0) i=0;

  if(i>=data.length)
   i=data.length-1;

  const r=data[i];

  const close=Number(pick(
   r.close,r.c,r.price
  ));

  const vol=Number(pick(
   r.volume,r.v
  ));

  const value=
   Number.isFinite(close)&&
   Number.isFinite(vol)
   ? close*vol
   : null;

  const info=document.getElementById("chartInfo");

  info.innerHTML=`

   <b>${esc(pick(
    r.date,
    r.datetime,
    r.time,
    "날짜 없음"
   ))}</b><br><br>

   시가: ${n(pick(r.open,r.o),4)}<br>
   고가: ${n(pick(r.high,r.h),4)}<br>
   저가: ${n(pick(r.low,r.l),4)}<br>
   종가: ${n(close,4)}<br>
   거래량: ${n(vol,0)}<br>
   거래대금*: ${n(value,0)}

   <br><br>

   <span class="sub">
   * 거래대금 = 종가 × 거래량 참고 계산
   </span>
  `;

 };

}

async function load(){

 const input=document.getElementById("symbol");

 const symbol=
  input.value.trim().toUpperCase();

 if(!symbol){
  alert("티커를 입력하세요.");
  return;
 }

 input.value=symbol;

 document.getElementById("app").innerHTML=`

  <div class="card loading">
   ${esc(symbol)} 데이터를 불러오는 중...
  </div>

 `;

 try{

  const res=await fetch(
   API+
   "/all?symbol="+
   encodeURIComponent(symbol),
   {
    cache:"no-store"
   }
  );

  if(!res.ok)
   throw new Error(
    "API HTTP "+res.status
   );

  const data=await res.json();

  if(!data || data.error)
   throw new Error(
    data?.error||
    "데이터가 없습니다."
   );

  render(data);

 }catch(e){

  document.getElementById("app").innerHTML=`

   <div class="card">

    <div class="judge">
     데이터 연결 오류
    </div>

    <div class="reason">
     ${esc(e.message)}
    </div>

    <div class="explain">
     Cloudflare Worker 주소와
     /all?symbol=${esc(symbol)}
     응답을 확인하세요.
    </div>

   </div>

  `;

 }

}

 "resize",
 ()=>{
  if(DATA) drawChart();
 }
);

load();
